# Railway config-as-code for the ALINA service.
# https://docs.railway.com/reference/config-as-code
#
# The same Docker image serves the app and runs the database migrations:
# the pre-deploy command executes `scripts/migrate.mjs` (advisory-locked)
# inside the freshly built image before the new deployment receives traffic.
#
# Required service variables are listed in .env.example under "Railway".

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs in the built image with the service variables, before traffic switches.
preDeployCommand = ["node scripts/migrate.mjs"]
# The container listens on 3000 (see Dockerfile). Set the same target port on
# the public domain in Settings > Networking.
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
