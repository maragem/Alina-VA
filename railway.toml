# Railway config-as-code for the ALINA service.
# https://docs.railway.com/reference/config-as-code
#
# Database migrations run inside the container at start (see the Dockerfile
# CMD), so no pre-deploy command is needed. Required service variables are
# listed in .env.example under "Railway".

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The container listens on 3000 (see Dockerfile). Set the same target port on
# the public domain in Settings > Networking.
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
