services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alina
      POSTGRES_USER: alina
      POSTGRES_PASSWORD: alina-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - alina-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alina -d alina"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  alina-postgres: