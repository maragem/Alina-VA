# haystack-pipeline
# ALINA v1 - AGENT pipeline DIGIT.R3 (DRAFT 9 - reference Q&A tool + tool-routing rules)
#
# DRAFT 9 (minimal, on top of the green draft 8):
#   1. New tool `consult_reference_qa`: the 34 exemplar Q&A of "ALINA - Exemplar questions
#      and answers" (DIGIT.R3) embedded IN the tool as static data. In-memory lexical lookup,
#      no document store, no ingestion, no entitlement interaction. Its output never enters
#      agent state, so an entry can never be cited as a source: it tells the agent WHICH
#      instruments/provisions apply and what the answer should look like; the passages are
#      still retrieved and cited from the corpus. Shape: PipelineTool wrapping ONE Code
#      component, i.e. the exact shape of list_corpus_files, which is proven to import and
#      run here.
#   2. System prompt, "Using your tools" rewritten as a 4-step decision procedure:
#        - named/referenced document -> ALWAYS list_corpus_files then search_in_file;
#        - general / non-specific question (definition, general rule, principle) -> ALWAYS
#          search_in_file on the Financial Regulation using its known file_id (file_id
#          4abf8796-9157-4ceb-932e-74cb788e4f1b, hard-coded in the prompt), no listing needed;
#        - consult_reference_qa first for any substantive question;
#        - search_corpus for the rest.
#      One "shape of an answer" line mirrors the structure of the exemplar entries.
#   Nothing else changed: generator, streaming, state, tools 1-3, connections, I/O.
#
# DRAFT 9b (after the first runs of draft 9):
#   3. Anti-laziness. The agent anchored on the Financial Regulation and stopped there.
#      Step 3 of the procedure now makes a second search MANDATORY unless the FR passages
#      answer exactly and completely; a new pre-answer check "Depth" repeats it from the
#      answer side; the shape rule orders sources by descending authority (FR first, then
#      guidance detail), as the exemplar Q&A does. max_agent_steps 8 -> 10 to pay for the
#      extra round (nominal path: reference lookup, FR, corpus, [one in-file], answer).
#   4. Authority visible to the agent. list_corpus_files now sorts by authority_rank
#      (unknown last), prints the rank and its label on every line plus a legend in the
#      header, and takes an optional `authority_rank` argument to list one level only.
#      The prompt explains the scale and tells the agent to search/cite the lowest number
#      first. PRECONDITION: authority_rank must be attached as file-level metadata at
#      upload - the indexing pipeline does not populate it (alina-indexing-v0.4.yaml,
#      header note). The FR file_id stays hard-coded in the prompt until that is done.
#      UPDATE 07/09/2026: authority_rank IS populated now. The corpus scale is not the one
#      assumed here (only the EU Charter is rank 1; the Financial Regulation is rank 2,
#      guidance and the vademecum rank 3) - confirmed correct by DIGIT.R3, nothing to fix.
#
# ========================= DRAFT 9c: CITATION TOKENS (BUG FIX) ==============================
# THE BUG (trace f6b32b91, 07/09/2026): the answer quoted the Guidelines on external
# consultants but the reference numbers pointed at the Financial Regulation. Not a model
# hallucination - the numbering was structurally wrong.
#
# Chain of evidence: at step 2 the model emitted FOUR tool calls in ONE assistant message
# (search_in_file on the FR + 3x search_corpus). Haystack's ToolInvoker runs them in
# PARALLEL against the SAME snapshot of agent state, which was still empty. All four
# result_formatter spans therefore saw len(state_documents) == 0, computed offset 0, and
# numbered their passages from [1]: the model received four blocks all using [1], [2],
# [3]... for different documents. merge_lists then concatenated the four results in tool-
# call order (FR first, 26 passages = panel [1]-[26], guidance from [27]), so [n] in the
# answer no longer mapped to documents[n-1]. Same cause, second symptom: cross-tool dedup
# also failed (each formatter deduped against an empty state), giving a 90-document panel
# with 25 duplicates for ~10 actually cited passages.
#
# WHY THE OBVIOUS FIX WAS NOT TAKEN: `parallel_tool_calls: false` would restore the
# invariant, but the parallelism is buying real latency here - four searches in 27s where
# sequential would be 50-60s (the reranker alone is 7-10s per call) - and an unknown
# parameter is a 400 on this gateway.
#
# THE FIX: make the reference independent of position and of execution order.
#   - result_formatter and attachment_formatter now emit
#         reference="<6 hex chars of sha1(document.id)>"
#     a stable per-document token. No offset, no coordination between tools, so parallel
#     calls cannot collide (~0.03% collision risk over 100 documents).
#   - The model cites [a1b2c3] instead of [3] (see "Citing and quoting" in the prompt).
#   - NEW trailing component `citation_renumberer` reads the final assistant message and
#     the accumulated state documents, extracts the tokens in order of first appearance,
#     rewrites them as [1], [2], [3]... and rebuilds the `documents` output to exactly the
#     cited passages in that order. The [n] <-> documents[n-1] contract the app relies on
#     is therefore restored by construction, and the sources panel now holds only what was
#     actually cited (~10 instead of 90, duplicates gone).
#   - The pipeline I/O contract is unchanged: same `documents` and `messages` outputs, they
#     are simply produced by citation_renumberer instead of straight from the agent.
#
# NOTE if streaming is ever re-enabled (the commented streaming_callback below): the
# streamed text would carry the raw tokens until the result event replaces it with the
# renumbered text. Either keep the agent unstreamed, or renumber client-side.
# ===========================================================================================
#
# DRAFT 9d (08/09/2026):
#   5. REGRESSION FIXED in citation_renumberer. A revision of 9c handed a number to
#      unresolvable tokens as well as to real ones, appending only the real ones to the
#      order list. numbering and order then had different lengths, so every citation after
#      the first invented token pointed one document too far and the last one ran off the
#      end - the misattribution bug again, in a new form. Reproduced: "FR[t1] x[deadbe]
#      GL[t2] VM[t3]" rendered [1][2][3][4] over a 3-document panel, so [3] resolved to the
#      vademecum instead of the guidelines. A number is now issued only for a token that
#      resolves; see the INVARIANT comment in the code. The case-insensitive token pattern
#      from that revision is kept - it is a real improvement.
#   6. FRONT END: each returned document now carries meta.citation_number ([n]) and
#      meta.citation_token, so clickable references can be built by lookup instead of by
#      array position, and the two can be cross-checked.
#   7. REFUSALS. The agent was declining on the topic of the question, before searching.
#      The corpus is not only procurement law (it holds internal guidelines, HR and
#      in-house service rules, contractual and operational documents), so a topic-based
#      refusal is a guess. A refusal now requires a search plus one reformulation behind
#      it, and must say what was searched. Only greetings, thanks, small talk and
#      questions about ALINA itself skip the tools.
#   8. STOPPING AT THE FINANCIAL REGULATION. The 9b rule had an escape hatch ("unless the
#      FR answers exactly and completely") and the model took it every time. The follow-up
#      search is now mandatory, stated in the procedure, repeated in pre-answer check 4
#      and in the descriptions of both search tools, which the model re-reads at every call.
#
# DRAFT 9e (08/09/2026): scoping the depth rule, after it over-corrected.
#   Symptom: "What is the definition of a DPS according to the FR?" used to be answered in
#   two lines with Article 2's definition ("'dynamic purchasing system' means a completely
#   electronic process for making commonly used purchases of items generally available on
#   the market"). Under 9d the agent kept searching, answered "not defined in a single
#   sentence but described through its key features", and buried the question under
#   Article 167(6), Annex I point 9 and a vademecum paraphrase - MISSING the definition
#   that exists. Two defects: an unconditional "always go further" turns a lookup into an
#   essay, and the pressure to broaden made it never look in the definitions article.
#
#   The 9b escape hatch was wrong because it asked the model to self-assess completeness,
#   which it always answered "yes" to. The condition is now the SHAPE OF THE QUESTION,
#   decided before searching and objectively checkable:
#     - LOOKUP (what a term means, what a provision says, what a named document requires):
#       quote the provision and stop. Adding sources is the failure mode here.
#     - PRACTICAL (conditions, procedure, thresholds, exceptions, what to do in a case):
#       the FR alone is never enough, the follow-up search on the guidance stays mandatory.
#   Both shapes are stated in the procedure, in pre-answer check 4, in the Style length
#   rule and in both search tool descriptions. Rule 2 also states that a question scoped
#   to one document ("according to the FR") is answered from that document only.
#   A search rule was added for the miss itself: a legal act defines its terms in its
#   definitions article, in the form "'<term>' means ...", so query the bare term plus
#   "means" before concluding that the act does not define it.
#
# ============ DRAFT 9f: list_corpus_files COULD NOT SEE PAST 10 000 CHUNKS =================
# Symptom (trace e680dd3d, v37): "List of EUIs_04.2025.xlsx" is in the corpus and correctly
# indexed, and ALINA answered that no such file exists. Three defects, one of them the cause.
#
#   9. THE CAUSE - corpus_scan is capped at 10 000 chunks, and not by us.
#      OpenSearchDocumentStore._prepare_filter_search_request() hard-codes {"size": 10_000}
#      and filter_documents() goes straight through it; no store or FilterRetriever
#      parameter raises it (verified against the installed integration source). The corpus
#      is bigger than that, so the scan returned exactly 10 000 chunks - 481 distinct files
#      on this trace - and every file outside that arbitrary window was invisible. The
#      MAX_FILES=300 cap that was removed to fix this sat in the lister, DOWNSTREAM of the
#      real truncation, so removing it could not have helped.
#      FIX: a second retriever, `name_search`, runs BM25 on the name pattern. Haystack's
#      default BM25 body is a multi_match with no `fields`, so OpenSearch falls back to
#      index.query.default_field ("*") and meta.file_name is searched: a targeted name
#      lookup now reaches the whole corpus regardless of the cap. corpus_scan stays for the
#      unfiltered listing, and the lister now states when that listing is partial instead
#      of implying the corpus is what it returned. The display cap is back, but only for an
#      unfiltered listing (400 files) - a pattern-narrowed listing is never truncated.
#
#  10. A REAL BUG IN THE LISTER, mine, from 9b: `ranks_seen` was incremented only for chunks
#      that passed the name filter. With a pattern matching nothing it stayed 0, so the tool
#      announced "No file carries an authority_rank in this corpus" - flatly false (that
#      scan held 7 635 chunks at rank 2, 967 at rank 3, 406 at rank 4, 5 at rank 1) - and
#      the agent burned its first call chasing that. Now counted over every chunk seen,
#      before any filtering, and the empty-result messages distinguish "the name matched
#      nothing" from "the name matched but not at that rank".
#
#  11. outputs_to_string on list_corpus_files had drifted to `result: {source: result}`,
#      which is not the expected shape: the LLM was handed the stringified dict
#      "{'result': '...'}" instead of the text. Restored to `{source: result}`, the shape
#      the other three tools use.
#
# Note for the next time a document "is not found": check the tool result in the trace
# before changing the pipeline. Both failures above announced themselves in plain English
# in the tool output, and neither said what the actual problem was.
#
# ================= DRAFT 9g: SCAN FILES, NOT CHUNKS (the actual fix) =======================
# 9f was not enough (trace a3dd08bf, v38). It worked as designed - name_search ran, the
# agent used the short pattern "EUIs" as the prompt now asks, the listing came back with 4
# files - and "List of EUIs_04.2025.xlsx" was still not one of them.
#
# Why the BM25 branch could not find it: Haystack's default BM25 body is a `multi_match`
# with no `fields`, so it searches whatever OpenSearch's default_field resolves to. On this
# index that is effectively the analysed TEXT - the 418 hits for "EUIs" are documents whose
# CONTENT mentions EUIs (T-637 EURIS via fuzziness, "Participation of EUIs in DIGIT...",
# "EU Survey guidelines"), not documents whose NAME contains it. A spreadsheet listing EU
# institutions contains agency names, not the token "EUIs", so it scored nothing. Matching
# a file name through a full-text query on chunk content was the wrong mechanism.
#
# THE REAL FIX - stop trying to work around the 10 000 cap and stop hitting it. Every chunk
# carries `split_id`, which restarts at 0 for each source document (verified on 10 418
# chunks from the trace: always present, always int, one or two split_id==0 chunks per
# file_id). scan_filter now ANDs `split_id == 0` into the entitlement filters, so
# corpus_scan returns about ONE CHUNK PER FILE - a few hundred hits instead of tens of
# thousands. The listing is complete for the first time, and it is also much cheaper.
#
# What follows from that:
#   - the listing no longer carries a per-file chunk count (only one chunk per file is
#     retrieved); it was informational only;
#   - "not in the listing" now genuinely means "not accessible", so the not-found message
#     says so and tells the agent to answer from search_corpus rather than stopping;
#   - name_search stays as a complement - it finds a file whose name the user half
#     remembers, and content matches that suggest which file to open - but it is no longer
#     load-bearing for enumeration;
#   - the SCAN_CAP check stays: at ~10 000 FILES the same silent truncation would return.
#
# IF THE DOCUMENT IS STILL MISSING after this, the pipeline has done all it can and the
# cause is upstream: run list_corpus_files with an empty pattern and look for the file. If
# it is absent from a complete listing, it is either not indexed in ALINA-V0.3 or its
# `alina_project_ids` do not include the caller's project, and no pipeline change will
# surface it.
#
# CONFIRMED 07/09/2026 (trace 199b284e, v39): that is what happened. The scan returned 505
# chunks, all split_id 0, for 491 distinct files - nowhere near the 10 000 cap, in 351ms
# instead of 5.7s - so the listing is complete and cheap. "List of EUIs_04.2025.xlsx" is
# not among the 491. Cross-check that the enumeration loses nothing: name_search is NOT
# restricted by split_id and reaches any chunk in the index, and the files it returned were
# a strict subset of the scan's. Two other .xlsx files ARE listed, so the spreadsheet
# ingestion path works. Every one of the 505 chunks carries alina_project_ids ['global'].
# The query pipeline is correct; the file is not in the index. Next step is ingestion, not
# this YAML.
#
# DRAFT 9h (small, same day): the model passed `authority_rank: 4` on a name lookup - a
# guess it cannot justify, since a document's level is only visible once listed - which
# narrowed "EUIs" from 5 files to 2. The parameter description and the prompt now forbid
# combining authority_rank with a name_pattern, and the lister reports how many name
# matches the rank filter is hiding instead of dropping them silently.
#
# DRAFT 9i (09/09/2026): `authority_rank` REMOVED from list_corpus_files altogether.
# Telling the model not to pass it did not stop it: it kept guessing a level on name
# lookups and quietly losing files. The argument had one legitimate use - browsing a
# single authority level - which is worth far less than the failure it causes, and the
# same view is one glance away in a full listing that is now complete and cheap (9g).
# Removed from the tool schema, from input_mapping, from the lister's signature and from
# the prompt. The rank stays where it was always useful: computed, used as the sort key,
# and printed with its label on every line. It is now output only, so no argument the
# model invents can shrink a listing.
# ===========================================================================================
#
# ---------------------------------------------------------------------------------------------
# DRAFT 7: `streaming_callback` removed from the agent. Both traces show tool_invoker as a
# no-op (16ms, 6ms), i.e. the first generator call returns an empty assistant message every
# single time - so the cause is structural, not per-tool. The one thing v0.x never did
# through this EC proxy is send `tools`, and tool calls stream as different SSE events than
# text. Full reasoning at the streaming_callback site.
#
# TWO CHECKS THAT SETTLE THIS - do them before changing anything else:
#   A. Logs tab of a failing run: look for the warning "malformed JSON string for tool call
#      arguments ... will be skipped". PRESENT -> the model did emit a tool call and its
#      arguments were lost in transport (streaming): draft 7 is the fix. ABSENT -> the
#      provider returned nothing usable at all, and the problem is upstream of Haystack.
#   B. Isolation test, 5 minutes: a throwaway pipeline with this same chat_generator, no
#      streaming, and ONE trivial deepset CodeTool (the get_weather @tool example from the
#      docs). Ask it "what is the weather in Brussels". If no tool call happens there
#      either, the EC gpt-5.1 endpoint does not do tool calling in the shape Haystack
#      sends, and no amount of pipeline YAML will fix it - see PLAN B below.
#
# PLAN B if tool calling is unavailable through this endpoint: keep the v0.x fixed chain and
# solve the named-document problem WITHOUT an agent - a ConditionalRouter in front of
# retrieval, fed by a small extraction step that spots a document reference in the query and
# resolves it against the file list, then routes to a file-filtered branch or the normal one.
# Less flexible than an agent, but it needs no tool calling at all.
#
# DRAFT 6: every tool now declares its LLM-facing `parameters` schema explicitly instead
# of letting PipelineTool derive it from input_mapping. Deriving it exposed `filters` and
# `state_documents` (list[Document]) as model-supplied arguments, which produced malformed
# tool-call arguments; Haystack drops such a call silently and hands back an EMPTY
# assistant message, which then kills the next loop iteration. Full chain of evidence in
# the comment above search_corpus.parameters.
#
# One diagnostic setting is still on: `generation_kwargs: {}` (reasoning off), kept only
# so this fix is tested in isolation. Restore `reasoning_effort: medium` once green.
#
# DRAFT 4 (runtime): deepset's replayed chat history must be sanitized before it reaches
# the Agent. The app sends no `messages`; deepset rebuilds prior turns from
# search_session_id, and now that assistant turns carry tool calls, a content-less
# ChatMessage can appear and the generator rejects it on outgoing serialization. See the
# history_sanitizer component.
#
# DRAFT 3 (runtime): document stores MUST be declared in YAML, never built in Python.
# deepset injects the real cluster host/credentials when a store is deserialized from the
# YAML; a store constructed inside a Code component skips that hook and tries
# localhost:9200. list_corpus_files now scans through a FilterRetriever (store in YAML)
# and its Code component only reduces chunks to a file listing. See the tool for detail.
#
# See v1-agent-design.md for the full rationale. In one line: the v0.x fixed chain cannot
# answer "what does <named document> say about X" from the named document, because nothing
# resolves the name or constrains retrieval to it. This pipeline gives the LLM three tools
# (list_corpus_files, search_corpus, search_in_file) and lets it decide.
#
# CONTRACT: only the v0.x pipeline I/O is kept. Same inputs (query, filters, messages,
# files), same outputs (documents, messages), same streaming callback, pipeline_output_type
# chat. Switching the app to this pipeline is a HAYSTACK_PIPELINE(_ID) env change only.
#
# ========================= DRAFT 2: WHAT THE FIRST IMPORT TAUGHT US =========================
# The first import into deepset resolved most of the [U1]/[U2] uncertainty:
#
#   1. inputs_from_state maps {state_key: tool_parameter_name} with a STRING value
#      (import error: "inputs_from_state values must be str, not list"). The fan-out to
#      internal sockets stays in input_mapping, which DOES take lists. So a state-fed
#      value needs BOTH entries:
#          input_mapping:      state_documents: [result_formatter.state_documents]
#          inputs_from_state:  documents: state_documents
#   2. outputs_to_state has the shape {state_key: {source: <tool output name>}}.
#   3. outputs_to_string: {source: <tool output name>} selects what the LLM receives as
#      the tool result. Without it the tool would return ALL mapped outputs serialized,
#      including the raw Document list - a context bomb. Required on both search tools.
#   4. deepset's native custom-code tool is deepset_cloud_custom_nodes.tools.code_tool.CodeTool
#      with data: {name, description, code} where code holds a @tool-decorated FUNCTION
#      (haystack.tools.tool, Annotated params), plus a _meta block (Builder bookkeeping).
#      It is NOT the ComponentTool-wrapping-a-Code-component shape of draft 1.
#      list_corpus_files is nevertheless kept as a PipelineTool below, because it MUST
#      receive the entitlement filters from state and the CodeTool path has no documented
#      inputs_from_state - see the tool's own comment.
#
# STILL UNVERIFIED:
#   [U1'] Whether parameters fed via inputs_from_state are hidden from the LLM's tool
#         schema, and whether state values take precedence if the model supplies them
#         anyway. SECURITY-RELEVANT for `filters`: verify in the playground by prompting
#         the agent to pass its own filters and checking they are ignored. If they are
#         not, guard inside the tool pipelines (ignore any filters argument not coming
#         from state).
#   [U3]  Wiring pipeline inputs / connections into Agent state fields (filters,
#         documents seed) and into user_prompt variables (attachments).
#   [U4]  Append semantics of list-typed state fields (design assumes haystack State's
#         default list-merge behaviour, i.e. extend).
# ============================================================================================
#
# ENTITLEMENT INVARIANT (unchanged from v0.x): the request's `filters` carry per-user /
# per-project document entitlement. They are injected server-side into EVERY tool via agent
# state; the LLM never sees or sets them. file_ids chosen by the LLM are ANDed with these
# filters, so a hallucinated or non-entitled file_id returns zero documents, never a leak.
# The v0.8 warning applies verbatim: test the empty-filters path of file_filter_merger
# carefully - a mistake here has access-control consequences, not just relevance ones.
# DRAFT 9 note: the hard-coded Financial Regulation file_id in the system prompt is covered by the same
# invariant - search_in_file ANDs it with the entitlement filters, so a user not entitled to
# the Financial Regulation gets zero passages, never a leak.
#
# CITATION SCHEME: agent state accumulates documents across tool calls in call order; the
# pipeline `documents` output is that list, unreordered. Each tool's result_formatter
# numbers passages globally (offset = len(state.documents)) and dedups by document id, so
# [n] in the answer always maps to documents[n-1] in the sources panel. Authority grouping
# (meta_field_grouping_ranker) runs INSIDE each tool, before appending - never after the
# agent, where it would break the numbering.
components:
  # ---------------------------------------------------------------------------
  # Attachment branch (carried over from the v0.9 draft, still UNVERIFIED there)
  # Attachments seed the agent's documents state (references 1..k) and are rendered
  # into the first user turn, so they are always in context without any tool call.
  # ---------------------------------------------------------------------------
  attachment_converter:
    type: haystack.components.converters.multi_file_converter.MultiFileConverter
    init_parameters: {}
  attachment_metadata_stamper:
    # authority_rank=0 (above every corpus source), sequential split_id, header
    # "Attached file: <name>" - same stamping as v0.9.
    type: deepset_cloud_custom_nodes.code.code_component.Code
    init_parameters:
      code: |
        from haystack import component
        from haystack.dataclasses import Document
        @component
        class AttachmentMetadataStamper:
            """Stamps attachments with the metadata the grouping/formatting layer expects."""
            @component.output_types(documents=list[Document])
            def run(self, documents: list[Document]):
                for split_id, document in enumerate(documents):
                    document.meta["authority_rank"] = 0
                    document.meta.setdefault("file_id", document.id)
                    document.meta["split_id"] = split_id
                    file_name = document.meta.get("file_name", "attached file")
                    document.meta["header"] = f"Attached file: {file_name}"
                return {"documents": documents}
  attachment_formatter:
    # Same rendering logic as the in-tool result_formatter. Outputs both the rendered
    # block (into the user_prompt) and the documents (seeding agent state). [U3]
    # DRAFT 9c: attachments carry the same stable citation tokens as retrieved passages,
    # so citation_renumberer resolves them the same way.
    type: deepset_cloud_custom_nodes.code.code_component.Code
    init_parameters:
      code: |
        import hashlib
        from haystack import component
        from haystack.dataclasses import Document
        PER_DOC_CHARS = 12000
        TOKEN_LEN = 6
        def citation_token(document_id):
            """Stable per-document citation token. MUST stay identical in
            attachment_formatter, both result_formatters and citation_renumberer."""
            return hashlib.sha1(str(document_id).encode("utf-8")).hexdigest()[:TOKEN_LEN]
        @component
        class AttachmentFormatter:
            @component.output_types(documents=list[Document], result=str)
            def run(self, documents: list[Document]):
                blocks = []
                for doc in documents:
                    full = doc.content or ""
                    body = full[:PER_DOC_CHARS]
                    truncated = ' truncated="true"' if len(full) > len(body) else ""
                    tail = "\n[... this passage continues beyond what is shown here ...]" if truncated else ""
                    blocks.append(
                        f'<document reference="{citation_token(doc.id)}" source="{doc.meta.get("file_name")}" '
                        f'section="{doc.meta.get("header")}" page="{doc.meta.get("page_number")}"{truncated}>\n'
                        f"{body}{tail}\n</document>"
                    )
                result = "<documents>\n" + "\n".join(blocks) + "\n</documents>" if blocks else ""
                return {"documents": documents, "result": result}
  history_sanitizer:
    # ======================= DRAFT 4 FIX =======================
    # Symptom: OpenAIResponsesChatGenerator fails with
    #   A `ChatMessage` must contain at least one `TextContent`, `ToolCall`,
    #   `ToolCallResult`, `ImageContent`, `FileContent`, or `ReasoningContent`.
    #
    # That check lives in _convert_chat_message_to_responses_api_format(), i.e. on the
    # OUTGOING serialization of the conversation. So the offending message is already in
    # the list the agent replays - it is not something the model returned.
    #
    # Where it comes from: the application does NOT send `messages`. It sends
    # search_session_id + chat_history_limit: 20 (see search-stream/route.ts) and deepset
    # reconstructs the prior turns into this pipeline's `messages` input. In v0.x that
    # history was only ever rendered as Jinja inside chat_prompt_builder, so a
    # content-less message rendered as an empty string and nobody noticed. An Agent hands
    # the same list straight to the generator, which validates every message. Two ways a
    # content-less message appears now that the assistant's turns carry tool calls:
    #   - a stored assistant turn whose content was only a tool call / only reasoning,
    #     replayed with that part dropped -> a message with nothing in it;
    #   - chat_history_limit truncating between a function_call and its
    #     function_call_output, orphaning one of the pair.
    #
    # Fix: rebuild the history as plain user/assistant TEXT turns before it reaches the
    # agent. This is also what the design intended - history is context for resolving
    # follow-ups, not source material, and never the agent's own tool trace (the agent
    # re-runs its tools every turn, and citation numbering restarts per turn anyway).
    # Side benefit: it drops the replayed tool results, which were pure context cost.
    #
    # If the error survives this, the empty message is being produced INSIDE the agent
    # loop instead (a streamed turn whose text was empty and whose tool-call arguments
    # failed to parse). Diagnosis: does it fail on the very first question of a fresh
    # conversation (-> inside the loop) or only on a follow-up (-> history, fixed here)?
    # In the first case the levers are the streaming assembly and reasoning_effort, not
    # this component.
    # ===========================================================
    type: deepset_cloud_custom_nodes.code.code_component.Code
    init_parameters:
      code: |
        from haystack import component
        from haystack.dataclasses import ChatMessage
        MAX_HISTORY_MESSAGES = 20
        @component
        class HistorySanitizer:
            """Rebuilds replayed history as plain user/assistant text turns.
            Guarantees every message handed to the generator carries a TextContent:
            anything content-less, any tool-call / tool-result / reasoning residue, and
            any role other than user/assistant is dropped rather than passed through.
            """
            @component.output_types(messages=list[ChatMessage])
            def run(self, messages: list[ChatMessage] | None = None):
                clean: list[ChatMessage] = []
                for message in messages or []:
                    role = getattr(message.role, "value", message.role)
                    if role not in ("user", "assistant"):
                        continue
                    try:
                        text = (message.text or "").strip()
                    except Exception:
                        text = ""
                    if not text:
                        continue
                    clean.append(
                        ChatMessage.from_user(text)
                        if role == "user"
                        else ChatMessage.from_assistant(text)
                    )
                return {"messages": clean[-MAX_HISTORY_MESSAGES:]}
  citation_renumberer:
    # ======================= DRAFT 9c: THE OTHER HALF OF THE FIX =======================
    # The tools now hand the model stable per-document tokens ([a1b2c3]) instead of
    # positions. This component closes the loop: it reads the answer, replaces the tokens
    # the model actually used with [1], [2], [3] in order of first appearance, and emits a
    # `documents` list containing exactly those passages in that order. The app's contract
    # ([n] maps to documents[n-1]) therefore holds by construction, whatever order the
    # tools ran in, and the sources panel no longer carries every passage that was merely
    # retrieved (90 documents with 25 duplicates on the trace that motivated this).
    #
    # Failure modes, all handled:
    #   - a token the model invented, or one whose document is not in state: the citation
    #     is dropped from the text rather than pointing at the wrong passage;
    #   - an answer with no citations at all (greeting, refusal, or the model forgetting):
    #     the state documents are passed through deduplicated, so the panel still shows
    #     what was consulted instead of going empty;
    #   - anything that is not a well-formed token is left untouched.
    type: deepset_cloud_custom_nodes.code.code_component.Code
    init_parameters:
      code: |
        import hashlib
        import re
        from haystack import component
        from haystack.dataclasses import ChatMessage, Document
        TOKEN_LEN = 6
        # [a1b2c3] and, defensively, [A1B2C3] and [a1b2c3, d4e5f6]
        TOKEN_PATTERN = re.compile(
            r"\[([0-9a-fA-F]{%d}(?:\s*,\s*[0-9a-fA-F]{%d})*)\]" % (TOKEN_LEN, TOKEN_LEN)
        )
        def citation_token(document_id):
            """Stable per-document citation token. MUST stay identical in
            attachment_formatter, both result_formatters and citation_renumberer."""
            return hashlib.sha1(str(document_id).encode("utf-8")).hexdigest()[:TOKEN_LEN].lower()
        @component
        class CitationRenumberer:
            """Turns citation tokens into [1], [2], [3] and aligns the documents output.
            Each returned document also carries meta.citation_number (its [n]) and
            meta.citation_token, so the front end can build clickable references by
            lookup rather than by array position.
            """
            @component.output_types(documents=list[Document], messages=list[ChatMessage])
            def run(self, messages: list[ChatMessage], documents: list[Document] | None = None):
                documents = documents or []
                by_token = {}
                for doc in documents:
                    by_token.setdefault(citation_token(doc.id), doc)

                # The answer is the last assistant message carrying text; everything
                # before it (tool calls, tool results) is passed through untouched.
                target = None
                for index in range(len(messages) - 1, -1, -1):
                    role = getattr(messages[index].role, "value", messages[index].role)
                    if role != "assistant":
                        continue
                    try:
                        text = messages[index].text or ""
                    except Exception:
                        text = ""
                    if text.strip():
                        target = index
                        break

                def deduplicated():
                    seen, out = set(), []
                    for doc in documents:
                        if doc.id not in seen:
                            seen.add(doc.id)
                            out.append(doc)
                    return out

                if target is None:
                    return {"documents": deduplicated(), "messages": list(messages)}

                numbering = {}
                order = []

                def replace(match):
                    rendered = []
                    for token in (t.strip().lower() for t in match.group(1).split(",")):
                        # INVARIANT - do not "improve" this: a number is handed out ONLY
                        # for a token that resolves to a document, and `numbering` and
                        # `order` are therefore always the same length. Numbering an
                        # unresolvable token (an invented one, or a document no longer in
                        # state) shifts every later citation by one and re-creates exactly
                        # the misattribution bug this component exists to fix.
                        if token not in by_token:
                            continue
                        if token not in numbering:
                            numbering[token] = len(numbering) + 1
                            order.append(token)
                        rendered.append(f"[{numbering[token]}]")
                    return "".join(rendered)

                original = messages[target].text or ""
                rewritten = TOKEN_PATTERN.sub(replace, original)
                cited = []
                for position, token in enumerate(order, start=1):
                    document = by_token[token]
                    # Stamped so the front end can resolve [n] by lookup instead of by
                    # array position, and check the two agree.
                    document.meta["citation_number"] = position
                    document.meta["citation_token"] = token
                    cited.append(document)

                rebuilt = list(messages)
                rebuilt[target] = ChatMessage.from_assistant(
                    text=rewritten, meta=dict(messages[target].meta or {})
                )
                # No citation survived: keep the consulted documents rather than an
                # empty sources panel.
                return {"documents": cited or deduplicated(), "messages": rebuilt}
  # ---------------------------------------------------------------------------
  # THE AGENT
  # ---------------------------------------------------------------------------
  agent:
    type: haystack.components.agents.agent.Agent
    init_parameters:
      chat_generator:
        # ===================== DRAFT 8: CHAT COMPLETIONS, NOT RESPONSES =====================
        # v0.x used OpenAIResponsesChatGenerator (/responses) and worked - but it never sent
        # `tools`. Test B proved the endpoint is the problem, not our YAML: a throwaway
        # pipeline with ONE CodeTool whose schema is two plain strings, no PipelineTool, no
        # retrieval, no state, no streaming, failed with the identical empty-ChatMessage
        # error. The /responses endpoint answers 200 with output that maps to no tool call,
        # so Haystack builds an empty assistant message and dies re-serializing it.
        #
        # This switches to /chat/completions, where function calling is long-standing and
        # universally implemented by gateways.
        #
        # CONFIRMED 31/08/2026: test B2 (same throwaway pipeline, this generator) calls its
        # tool correctly. The ECGPT gateway does function calling on /chat/completions and
        # not on /responses. Do not switch this back.
        #
        # Note: `reasoning_effort` (v0.x) is a Responses-API parameter. On Chat Completions
        # pass it inside generation_kwargs only after checking the gateway accepts it -
        # an unknown parameter is a 400 here, not a silent ignore.
        # ===================================================================================
        type: haystack.components.generators.chat.openai.OpenAIChatGenerator
        init_parameters:
          model: gpt-5.1
          api_key:
            type: env_var
            strict: true
            env_vars:
            - GPTEC_API_KEY
          api_base_url: https://api.tech.ec.europa.eu/ecgpt/v1
          # ======================= DRAFT 5 DIAGNOSTIC (HYPOTHESIS DISPROVED) ==========
          # `reasoning_effort: medium` (carried over from v0.x) is still disabled here,
          # but ONLY to keep one variable at a time while the draft-6 tool-schema fix is
          # tested. Reasoning was NOT the cause: the failure reproduced identically with
          # it off. RESTORE `reasoning_effort: medium` once the run is green.
          # The original (wrong) reasoning is kept below for the record.
          #
          # The trace shows chat_generator(922ms, ok) -> tool_invoker(16ms, ok) ->
          # chat_generator(15ms, FAIL), all inside ONE Agent Run. 15ms means it died
          # before any network round trip, i.e. while serializing the conversation. The
          # raise condition is
          #   not any([texts, tool_calls, tool_call_results, images, reasonings, files])
          # so a message with a ToolCall passes, and one with ReasoningContent passes:
          # the offending message has literally nothing. Since call 1 succeeded on the
          # same list minus the last two entries, the empty message is one the LOOP
          # added - it cannot come from replayed history, and history_sanitizer cannot
          # fix it.
          #
          # What produces a content-less message there: on the Responses API a reasoning
          # model returns a `reasoning` item alongside the `function_call` item. With an
          # effort set but NO summary requested, that reasoning item carries no text, so
          # the ChatMessage built from it ends up empty - fine on the way out of the
          # model, fatal when the loop serializes it back on the next iteration.
          #
          # TEST: run the client's question again with reasoning off.
          #   - error gone  -> confirmed. Re-enable reasoning WITH a summary so the
          #                    reasoning content is never empty:
          #                      generation_kwargs:
          #                        reasoning:
          #                          effort: medium
          #                          summary: auto
          #                    (the app already sends include_reasoning: true, so a
          #                    summary is what it expects to stream anyway)
          #   - error stays -> the empty message comes from the streaming assembly
          #                    instead: drop `streaming_callback` from the agent for one
          #                    run to confirm, then stream from a trailing component.
          # =================================================================
          generation_kwargs: {}
      # ======================= DRAFT 7: STREAMING DISABLED =======================
      # Streaming is OFF. This is the last untested variable behind the empty-message
      # failure, and it is now the prime suspect.
      #
      # What both traces actually show: tool_invoker returned in 16ms, then 6ms. Both are
      # NO-OPS - no tool has ever actually executed. So the first generator call returns
      # an empty assistant message EVERY time, not intermittently. That rules out a
      # per-tool schema problem and points at something structural.
      #
      # What is structurally new versus v0.x: v0.x used this same generator, through this
      # same EC proxy, with this same streaming callback, and streamed text fine - but it
      # never sent `tools`. Tool calls stream as a DIFFERENT set of SSE events than text
      # (function-call argument deltas). A gateway that implements text streaming but not
      # those events leaves Haystack accumulating an empty arguments string; the assembler
      # then drops the tool call with only a log warning and returns
      #   ChatMessage.from_assistant(text=None, tool_calls=[], ...)
      # 885ms of real latency with 0 recorded tokens fits: the response was streamed and
      # not understood.
      #
      # CONSEQUENCE: answers arrive in one block instead of token by token. The app copes -
      # search-stream/route.ts already finalizes from the result event (finalizeBlock /
      # parseHaystackResultEvent), streamedText simply stays empty.
      #
      # UPDATE: streaming was NOT the cause (test B1 failed with it off). It stays off for the
      # FIRST deployment of this draft only, because test B2 validated tool calling in the
      # unstreamed configuration and one variable should move at a time after seven
      # deployments spent on compound uncertainty.
      #
      # STEP 2, once the two golden questions pass: uncomment the line below and redeploy.
      # That verifies streaming works with tool calls on /chat/completions. If the empty
      # message returns at that point, streaming is the culprit after all and the fallback
      # is to keep the agent unstreamed - the app copes (finalizeBlock in route.ts).
      #   streaming_callback: deepset_cloud_custom_nodes.callbacks.streaming.streaming_callback
      # ===========================================================================
      exit_conditions:
      - text
      # Bounds cost/latency AND total document accumulation. ~3 tool rounds + answer.
      # DRAFT 9: the reference lookup adds one cheap round (a few ms, no retrieval).
      # DRAFT 9b: the mandatory second search adds another. Nominal path is now
      # consult_reference_qa -> search_in_file(FR) -> search_corpus -> [search_in_file on
      # guidance] -> answer = 4-5 steps; one reformulation must still fit, hence 10.
      # Each step is one generator call + one tool round; the reranker memory note (v0.7)
      # still applies - do not raise further without re-checking the OOM signature.
      max_agent_steps: 10
      # Kept at the default. Turning this on in draft 5 proved nothing, and that was
      # itself informative: no tool invocation was failing because no tool was being
      # invoked at all (tool_invoker returning in 6ms is a no-op, not a fast failure).
      raise_on_tool_invocation_failure: false
      # [U3] documents is seeded by attachment_formatter and appended to by both search
      # tools; filters comes straight from the pipeline input and is read-only for tools.
      state_schema:
        documents:
          type: list[haystack.dataclasses.document.Document]
        filters:
          # Parameterized, matching what the retrievers declare (dict[str, Any] | None).
          # A bare `dict` is what haystack's connection type check rejects as a sender.
          type: dict[str, typing.Any] | None
      # Derived from the v0.6 system prompt. Edits: "documents supplied in the user
      # message" -> "documents returned by your tools"; new "Using your tools" section;
      # the three pre-answer checks moved here from the old user-turn template.
      # DRAFT 9: "Using your tools" rewritten as a decision procedure; "Reference file
      # ids" added; one "shape of an answer" line added under Style.
      # |- literal block in this source file; the Builder re-serializes to >- with blank
      # lines on export, which is equivalent - do not "fix" the export back by hand.
      system_prompt: >-
        {% message role="system" %}

        You are ALINA, the AI assistant of the European Commission's DIGIT.R3
        procurement

        division: a source-grounded assistant for procurement and contract
        intelligence.

        You answer strictly from a curated corpus of procurement documents
        (legal acts,

        internal rules, guidance, tender documents, Q&A logs) that you access
        through your

        search tools, plus any files the user attached to the conversation.

        # Your tools

        - `consult_reference_qa`: a curated set of exemplar questions and
        answers written by

        DIGIT.R3 procurement experts. Fast and local. It returns the entries
        closest to the

        question, each with the instruments and provisions it relies on. The
        entries are

        guidance for you, NOT sources: never quote or cite them, and never rely
        on them

        when the corpus does not confirm them.

        - `list_corpus_files`: lists the documents you can access, optionally
        filtered by a

        name pattern. Resolves a document name, alias or abbreviation to an
        exact

        file_name and file_id.

        - `search_in_file`: searches inside specific documents (by file_id).

        - `search_corpus`: searches the whole corpus.

        # Reference file ids and document authority

        - Financial Regulation, i.e. Regulation (EU, Euratom) 2024/2509
        including its

        Annex I (procurement rules): file_id
        `4abf8796-9157-4ceb-932e-74cb788e4f1b`. Use it directly with

        `search_in_file`; no need to list files first.

        - Every file in a `list_corpus_files` listing carries an
        `authority_rank`:

        1 = legal acts (Financial Regulation and annexes, EU directives), 2 =
        internal

        rules, Commission decisions and circulars, 3 = guidance and the
        vademecum,

        4 = tender specifications and contract documents, 5 = Q&A logs,
        checklists and

        correspondence. When several files could hold the answer, search the

        lowest-numbered one first and cite it first; use the higher-numbered
        ones for

        the practical detail. The rank is shown on every line of a listing so
        you can

        choose; there is nothing to pass, `list_corpus_files` takes a name
        pattern and

        nothing else.

        # How to use your tools - follow this procedure for every question about
        the corpus

        1. Start with `consult_reference_qa` for any substantive question. Use
        the matching

        entries to decide which document(s) to search, which terms to search
        for, and

        how to structure the answer. Then apply the routing rules below.

        2. The user names or refers to a specific document, by name, alias or
        abbreviation

        ("the FR", "the vademecum", "the circular on subcontracting", "the
        tender

        specifications", "document X", "the Q&A of the DPS"): ALWAYS resolve it
        first

        with `list_corpus_files`, then search inside it with `search_in_file`.
        Never

        answer a question about a named document from `search_corpus` results.
        If the

        document does not contain the requested information, say so explicitly,
        and only

        then present what other retrieved sources say, clearly attributed to
        them. Never

        silently substitute another source for the named one. If no accessible
        file

        matches the name, say so; do not guess at documents. When the user
        restricts

        the question to one document ("according to the FR", "what does the
        vademecum

        say"), the answer comes from that document and stops there: other
        sources are

        off-topic, however relevant they look.

        3. The question is general or non-specific - a definition, a general
        rule, a

        principle, a procedure type, a threshold, a time limit ("what is / what
        are /

        when can / who can / is it allowed to"): ALWAYS search the Financial
        Regulation

        first, with `search_in_file` and file_id
        `4abf8796-9157-4ceb-932e-74cb788e4f1b`. What you do next depends

        on which of the two question shapes below you are answering.

        4. Any other question (a case-specific situation, tender documents,
        operational

        matters): `search_corpus`, then `search_in_file` on the higher-authority

        document when the reference entry or the results point to one, so that
        the

        answer opens with the highest-authority source that covers the point.

        # How far to go: the two question shapes

        Decide which one you are answering BEFORE you start, and follow it to
        the end.

        - A LOOKUP asks what a term means, what a provision says, or what a
        named document

        defines or requires: "what is the definition of X", "what does the FR
        say about

        Y", "what is a Z", "which article covers W". Find the provision that
        answers,

        quote it, name it, and STOP. Do not add neighbouring rules, do not bring
        in

        guidance to paraphrase what you already quoted, do not summarise how the
        thing

        works: on a lookup, a padded answer is a worse answer, and burying the
        quoted

        definition under related material is the failure mode to avoid. Search
        further

        only if the document does not actually contain what was asked.

        - A PRACTICAL question asks how a rule applies: the conditions,
        thresholds,

        procedure, exceptions, evidence or steps that govern a situation, or
        what to do

        in a given case. Here the Financial Regulation alone is never enough -
        it states

        the rule, while the vademecum, circulars, guidelines and explanatory
        notes state

        how it is applied in the Commission. Run the follow-up search on that

        implementing guidance before writing, and present the FR provision
        first, then

        the lower-authority sources for the practical detail, each attributed.
        Stopping

        at the FR on a practical question is a failure, not a shortcut.

        When a question carries both ("what is a framework contract and when can
        we extend

        one"), answer the lookup part from the provision and treat the rest as
        practical.

        NEVER refuse on the topic of the question. You cannot know what this
        corpus

        contains without searching it: it holds procurement law, but also
        internal

        guidelines, HR and in-house service rules, contractual and operational
        documents,

        and project material. A question that sounds unrelated to procurement
        may well be

        answered by a document in the corpus. Search first, then decide.

        Rules:

        - Formulate short, self-contained search queries (keywords, synonyms,
        article

        terms). Never paste conversation history into a query. Reformulate and
        search

        again if a first search misses; when the first formulation returns
        nothing

        useful, try the vocabulary the documents themselves would use before
        concluding

        anything.

        - For a definition, search the term as the act itself writes it, in the
        definitions

        article rather than in the operative provisions: a legal act defines its
        terms in

        one place, in the form "'<term>' means ...". Query the bare term plus
        "means"

        first. Never conclude that an act does not define a term until you have
        looked

        there.

        - `list_corpus_files` matches on the file name, so a full file name
        typed by the

        user can miss a document that exists. Search it with ONE distinctive
        word

        ("EUIs" rather than "List of EUIs_04.2025", "vademecum" rather than the
        full

        title). If that also returns nothing, call it once with an empty
        pattern: the

        listing covers every accessible document, so what is not in it is not
        available

        to you. Only after that may you say a document is not in the corpus -
        and when

        you do, still answer the question from `search_corpus` if the subject is
        covered

        by other documents, rather than stopping at the missing file.

        - Only these need no tool at all: a greeting, thanks, small talk, or a
        question

        about you and what you do. Everything else is a question about the
        corpus and

        gets searched, including questions that look off-topic.

        # Before answering, check

        1. Answerability: retrieval always returns the closest matches, so tool
        results

        sharing the question's topic do not prove the question is answerable. If
        the

        passages do not actually contain the requested information, say you
        cannot

        answer from the available documents instead of building an answer from
        loosely

        related passages. A reference Q&A entry is never a substitute for a
        passage.

        This conclusion is only ever reached AFTER searching, and after at least
        one

        reformulation with different terms: a refusal written without a search
        behind

        it is always wrong, however far the question seems from procurement.
        When you

        do decline, say what you searched for and that the corpus returned
        nothing on

        it, so the user knows it was looked up and not judged.

        2. Completeness: after finding the general rule, re-read every passage
        for

        exceptions, derogations, extensions, thresholds and special cases
        ("unless",

        "except", "however", "may be extended", "by way of derogation", "in duly

        justified cases") and include every applicable one. Distinguish
        mandatory from

        discretionary.

        3. Source selection: when several documents state the same rule, answer
        from the

        highest-authority source: legal acts (Financial Regulation and annexes,
        EU

        directives) above internal rules, decisions and circulars, above
        guidance and

        the vademecum, above project tender specifications, above Q&A logs,
        checklists

        and correspondence. Cite the exact section that answers, not a
        neighbour.

        4. Depth, judged against the question shape you identified. On a
        PRACTICAL

        question, look at where your passages come from: if they all come from
        one

        document, you are not ready to answer, and if that document is the
        Financial

        Regulation you are certainly not ready - run the missing search on the
        guidance

        that implements the provision first. On a LOOKUP, the opposite check
        applies:

        if you have the provision that answers, you are done, and every extra
        source

        you add pushes the answer the user asked for further down the page. Cut

        anything that is not the answer.

        # Grounding

        - Base every factual statement exclusively on passages returned by your
        search

        tools or attached by the user. No outside knowledge, no assumptions, no
        invented

        references, figures, dates, clauses or article numbers.

        - If the documents only partially answer, answer the supported part and
        flag what

        remains unanswered. If documents conflict, present both positions with
        sources.

        - A passage tagged truncated="true" continues beyond the text you
        received: never

        treat the cut-off as the end of a provision, and say so if the answer
        may

        depend on the missing part.

        - Never mention or reconstruct documents the user has not been given
        access to.

        # Citing and quoting

        - Support every claim with a short verbatim quotation in quotation marks
        followed

        by the passage's reference token in square brackets, e.g. [a1b2c3],
        inline, next

        to the claim.

        - The token is the value of the `reference` attribute of the passage in
        the tool

        results, six characters. Copy it character for character. Never write a
        citation

        as a number, never invent a token, never reuse a token for a different
        passage:

        the tokens are converted into the final [1], [2], [3] numbering after
        you answer,

        and a token you invented is dropped from the answer.

        - One token per pair of brackets. For several passages, write
        [a1b2c3][d4e5f6].

        - The Sources list at the end carries the same tokens, next to each
        instrument.

        - Quoted text must be an exact substring of a retrieved passage. If you
        cannot

        locate the exact wording, paraphrase without quotation marks and cite,
        or state

        the information is missing.

        # Style

        - Professional, precise, neutral, suited to an EU institutional context.
        Markdown.

        - The first paragraph must contain the complete direct answer;
        supporting quotes

        and detail follow. Be brief; no padding, no generic closing advice.

        - Shape the answer like the reference entries: the direct verdict first,
        then the

        operative rule from the highest-authority source, naming the instrument
        in the

        prose ("Point 23.1 of Annex I FR"), then the practical detail,
        exceptions and

        distinctions from the lower-authority sources in descending order of
        authority,

        then a final "Sources" list of the distinct instruments relied on.

        - Match the length to the question. A lookup is answered in a few lines:
        the

        quoted provision, where it sits, and nothing else - no headings, no
        bullet

        inventory of related rules, no "practical clarification" section. The
        full

        structure above is for practical questions.

        - Preserve exact terminology, reference numbers, dates and amounts as
        written.

        - Always answer in English.

        # Boundaries

        - You provide information grounded in the documents; you do not give
        legal advice,

        make procurement decisions, or issue binding interpretations. Where
        judgement

        beyond the text is needed, state what the documents say and note the
        decision

        rests with the responsible officer.

        {% endmessage %}
      # Conversation history arrives through the agent's native `messages` input; this
      # template only carries the current turn. [U3] for the attachments variable.
      user_prompt: |-
        {% message role="user" %}
        {%- if attachments %}
        The user attached the following file(s) to this conversation. They are always
        available context, already numbered for citation:
        {{ attachments }}
        {%- endif %}
        <query>
        {{ query }}
        </query>
        {% endmessage %}
      required_variables:
      - query
      tools:
      # =========================================================================
      # TOOL 0 (DRAFT 9): consult_reference_qa - the 34 exemplar Q&A, in memory
      #
      # Why a PipelineTool around ONE Code component and not deepset's native CodeTool:
      # this is the exact shape of list_corpus_files (minus the retriever), which is
      # proven to import and run on this platform; the CodeTool `_meta` block is
      # undocumented here. Switching to CodeTool later is a mechanical change.
      #
      # Why the data lives in the code and not in the index: the entries are exemplar
      # ANSWERS, quotable and tailored to the question, so once indexed they beat the
      # Financial Regulation at reranking and the agent ends up citing a tuning
      # document instead of the legal act - the very thing the UAT testers sanction.
      # Kept out of the store, out of agent state, and out of the citation numbering,
      # they can only ever steer the agent, never be cited.
      #
      # No inputs_from_state, no outputs_to_state: the tool touches neither filters nor
      # documents. outputs_to_string is still required so the LLM receives the text.
      #
      # Maintenance: regenerate the compressed blob from the .docx when DIGIT.R3 updates
      # it (see the comment inside the code).
      # =========================================================================
      - type: haystack.tools.pipeline_tool.PipelineTool
        data:
          name: consult_reference_qa
          description: >-
            Look up the curated exemplar Q&A written by DIGIT.R3 procurement
            experts (34 entries on framework contracts, abnormally low tenders,
            standstill, subcontracting, conflicts of interest, exclusion,
            selection and award criteria, procedures, publicity, DPS,
            guarantees, late tenders...). Call it FIRST for any substantive
            procurement question: it returns the closest entries with the
            instruments and provisions they rely on, which tells you which
            document to search and what the answer should cover. The entries are
            guidance, not sources: never quote or cite them; always retrieve and
            cite the actual passages with search_in_file or search_corpus.
          parameters:
            type: object
            additionalProperties: false
            properties:
              query:
                type: string
                description: >-
                  The user's question, or a short reformulation of it with
                  procurement vocabulary (e.g. "abnormally low tender",
                  "standstill period specific contract", "framework contract
                  ceiling increase").
            required:
            - query
          input_mapping:
            query:
            - qa_lookup.query
          output_mapping:
            qa_lookup.result: result
          outputs_to_string:
            source: result
          pipeline:
            components:
              qa_lookup:
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
