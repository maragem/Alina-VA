                        "/+1Rqk4btLDhLVSp3avrHQ7GbKeTAhzt2KEx6VRSGnK1OFxZQEukskynBSvc6hy5XOQiOYEJDmKFhAeKfDg4EfCC67wTEHkL"
                        "L/LjUQiPgClWH+7G88iPo4VMqrEm11KOc442cfUPK9E9UMbF0tJBvP/b/wWLHgNH"
                    )
                    QA_ENTRIES = json.loads(zlib.decompress(base64.b64decode("".join(_BLOB.split()))).decode("utf-8"))

                    STOPWORDS = {
                        "a", "an", "the", "and", "or", "of", "to", "in", "on", "for", "is", "are", "be",
                        "can", "could", "may", "must", "shall", "should", "would", "do", "does", "did",
                        "we", "it", "its", "this", "that", "these", "those", "what", "which", "who", "whom",
                        "when", "where", "how", "why", "with", "without", "by", "from", "as", "at", "if",
                        "not", "no", "any", "all", "such", "than", "there", "their", "they", "them", "has",
                        "have", "had", "been", "being", "was", "were", "will", "under", "into", "about",
                        "after", "before", "between", "also", "only", "one", "same", "other", "us", "our",
                        "you", "your", "i", "my", "me", "please", "tell", "explain", "say", "says", "mean",
                    }
                    TOP_K = 3
                    MAX_ANSWER_CHARS = 6000

                    def _tokens(text):
                        out = []
                        for tok in re.findall(r"[a-z0-9]+", (text or "").lower()):
                            if tok in STOPWORDS or len(tok) < 2:
                                continue
                            # crude stemming: plural / verbal endings
                            for suffix in ("ations", "ation", "ings", "ing", "ies", "ly", "es", "s", "ed"):
                                if tok.endswith(suffix) and len(tok) - len(suffix) >= 4:
                                    tok = tok[: -len(suffix)]
                                    break
                            out.append(tok)
                        return out

                    # Pre-tokenize once at import.
                    _INDEX = []
                    for _e in QA_ENTRIES:
                        q_toks = _tokens(_e["question"])
                        a_toks = _tokens(_e["answer"] + " " + " ".join(_e.get("sources", [])))
                        a_tf = {}
                        for t in a_toks:
                            a_tf[t] = a_tf.get(t, 0) + 1
                        _INDEX.append({"q": set(q_toks), "q_list": q_toks, "a_tf": a_tf, "a_len": max(len(a_toks), 1)})

                    # Document frequency over answers, so generic procurement vocabulary weighs less.
                    _DF = {}
                    for _ix in _INDEX:
                        for t in _ix["a_tf"]:
                            _DF[t] = _DF.get(t, 0) + 1
                    _N = len(_INDEX)

                    def _idf(tok):
                        return math.log(1 + _N / (1 + _DF.get(tok, 0)))

                    def _score(query_tokens, ix):
                        if not query_tokens:
                            return 0.0
                        qset = set(query_tokens)
                        # Title match dominates: the entries are keyed by their question.
                        title_hits = sum(_idf(t) for t in qset if t in ix["q"])
                        title_cov = len(qset & ix["q"]) / max(len(ix["q"]), 1)
                        # Body match, tf-idf-ish and length-normalized.
                        body = 0.0
                        for t in qset:
                            tf = ix["a_tf"].get(t, 0)
                            if tf:
                                body += (1 + math.log(tf)) * _idf(t)
                        body /= math.sqrt(ix["a_len"] / 200.0)
                        # Consecutive-bigram bonus on the title.
                        bigram = 0
                        ql = ix["q_list"]
                        for i in range(len(query_tokens) - 1):
                            pair = (query_tokens[i], query_tokens[i + 1])
                            for j in range(len(ql) - 1):
                                if (ql[j], ql[j + 1]) == pair:
                                    bigram += 1
                                    break
                        return 3.0 * title_hits + 4.0 * title_cov + 1.2 * body + 1.5 * bigram

                    @component
                    class ReferenceQALookup:
                        """Returns the exemplar Q&A entries closest to a query (lexical matching, in memory)."""
                        @component.output_types(result=str)
                        def run(self, query: str):
                            query_tokens = _tokens(query)
                            scored = sorted(
                                ((_score(query_tokens, ix), i) for i, ix in enumerate(_INDEX)),
                                key=lambda p: p[0],
                                reverse=True,
                            )
                            best = scored[0][0] if scored else 0.0
                            # Keep the top entries that are at least reasonably close to the best one.
                            picked = [i for s, i in scored[:TOP_K] if s > 0 and s >= 0.35 * best]
                            if not picked:
                                return {"result": (
                                    "No reference Q&A entry matches this question. Proceed with the corpus "
                                    "search tools directly (search_in_file on the Financial Regulation for "
                                    "general questions, search_corpus otherwise)."
                                )}
                            blocks = []
                            for rank, i in enumerate(picked, start=1):
                                e = QA_ENTRIES[i]
                                answer = e["answer"]
                                if len(answer) > MAX_ANSWER_CHARS:
                                    answer = answer[:MAX_ANSWER_CHARS] + "\n[... entry truncated ...]"
                                sources = "\n".join(f"- {s}" for s in e.get("sources", [])) or "- (none listed)"
                                blocks.append(
                                    f"### Reference entry {rank}: {e['question']}\n{answer}\nSources:\n{sources}"
                                )
                            header = (
                                f"{len(picked)} reference Q&A entr{'y' if len(picked) == 1 else 'ies'} matching the "
                                "question (best first). These are curated exemplar answers, NOT corpus passages: "
                                "use them to identify the applicable instruments and provisions, the search terms, "
                                "and the expected structure of the answer. Then retrieve and cite the actual "
                                "passages with search_in_file / search_corpus. Never quote or cite these entries.\n"
                            )
                            return {"result": header + "\n\n".join(blocks)}
      # =========================================================================
      # TOOL 1: list_corpus_files - resolve a document name/alias to file_id(s)
      #
      # Deliberately a PipelineTool (single Code component), NOT deepset's native
      # CodeTool (deepset_cloud_custom_nodes.tools.code_tool.CodeTool, @tool
      # function): the listing MUST be restricted by the entitlement filters, which
      # only reach a tool via inputs_from_state, and the CodeTool path has no
      # documented state access. Project isolation depends on this: without the
      # filters, the tool would reveal file names the user is not entitled to see.
      # =========================================================================
      - type: haystack.tools.pipeline_tool.PipelineTool
        data:
          name: list_corpus_files
          description: >-
            List the documents available in the corpus, optionally filtered by a
            case-insensitive name pattern (substring or simple regex, e.g.
            "financial regulation"). Use this FIRST whenever the user refers to
            a specific document by name, alias or abbreviation, to resolve it to
            an exact file_name and file_id before calling search_in_file. The
            listing covers every accessible document: one line per file, sorted
            by authority then name, with file_name, file_id and authority_rank
            (1 = legal acts, 2 = internal rules and circulars, 3 = guidance and
            vademecum, 4 = tender and contract documents, 5 = Q&A logs and
            correspondence). Read authority_rank off the listing to pick which
            file to search and cite first. Match with ONE distinctive word
            ("EUIs", "vademecum") rather than a full file name, and if that
            returns nothing, call again with an empty pattern to see everything
            that is accessible before concluding a document is absent.
          # DRAFT 6: explicit schema - see the note on search_corpus.parameters.
          # DRAFT 9i: `authority_rank` REMOVED as a tool argument. It existed so the agent
          # could browse one authority level, but the model kept passing it on name
          # lookups - a level it cannot possibly know before the file is listed - and a
          # wrong guess silently hid the file being looked for (trace 199b284e: EUIs
          # narrowed from 5 files to 2 by an invented authority_rank: 4). Softening the
          # description was not enough; the argument is gone, so the failure cannot recur.
          # The rank is still computed, still sorted on, and still printed on every line -
          # it is now output only, which is all it was ever needed for.
          parameters:
            type: object
            additionalProperties: false
            properties:
              name_pattern:
                type: string
                description: >-
                  Case-insensitive substring or simple regex matched against
                  document file names. Prefer ONE distinctive word ("EUIs",
                  "vademecum", "subcontracting") over a full file name. Pass an
                  empty string to list every accessible document.
            required:
            - name_pattern
          input_mapping:
            # LLM-provided. name_pattern feeds BOTH the Python name filter and the
            # BM25 name search (draft 9f).
            name_pattern:
            - lister.name_pattern
            - name_search.query
            # State-provided (see inputs_from_state). NOTE: the filters go to the
            # RETRIEVERS, not to the Code component - the Code component never talks to
            # OpenSearch itself (see the "document stores live in YAML" note below).
            filters:
            - scan_filter.base_filters
            - name_search.filters
          output_mapping:
            lister.result: result
          inputs_from_state:
            # {state_key: tool parameter name} - values are STRINGS (draft-2 fix).
            filters: filters
          outputs_to_string:
            # {source: <tool output name>} - the same shape as the other three tools.
            # A revision had `result: {source: result}` here, which is not the expected
            # shape: the LLM then received the stringified dict "{'result': '...'}"
            # instead of the text. Readable by luck, wrong by contract.
            source: result
          pipeline:
            components:
              scan_filter:
                # DRAFT 9g. SECURITY-SENSITIVE, same rule as file_filter_merger: it must
                # AND the entitlement filters, never replace them. The added condition
                # reduces the scan to one chunk per source document so the file listing
                # fits inside the store's 10 000-hit cap - see corpus_scan.
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    from typing import Any
                    from haystack import component
                    @component
                    class ScanFilterBuilder:
                        """ANDs the entitlement filters with `split_id == 0` (first chunk of
                        each source document), so the scan enumerates files, not chunks."""
                        # dict[str, Any], not bare dict: FilterRetriever's filters input is
                        # declared dict[str, Any] | None and haystack's connection type check
                        # rejects an unparameterized dict as the sender.
                        @component.output_types(filters=dict[str, Any])
                        def run(self, base_filters: dict[str, Any] | None = None):
                            first_chunk = {"field": "split_id", "operator": "==", "value": 0}
                            if not base_filters:
                                return {"filters": {"operator": "AND", "conditions": [first_chunk]}}
                            return {"filters": {"operator": "AND", "conditions": [base_filters, first_chunk]}}
              corpus_scan:
                # ======================= DRAFT 3 FIX =======================
                # The previous version built an OpenSearchDocumentStore inside the Code
                # component. That fails at runtime with
                #   ConnectionError(HTTPConnection(host='localhost', port=9200) ...)
                # because deepset injects the real cluster host and credentials when a
                # document store is deserialized FROM THE YAML (its from_dict hook). A
                # store constructed in Python never goes through that hook, so it keeps
                # the library defaults (localhost:9200) and there is no such cluster in
                # the container.
                #
                # RULE: every document store must be DECLARED IN YAML as an
                # init_parameter of a real component. Never instantiate one in a Code
                # component. Any store the pipeline needs must therefore be reachable
                # through a component that accepts `document_store` - here FilterRetriever,
                # which is exactly `filter_documents(filters)` wrapped as a component.
                # ===========================================================
                #
                # Entitlement: filters arrive from agent state and are applied here, by
                # the same code path as the other retrievers - no custom DSL, no
                # $filters-rendering subtlety (cf. the v0.8 custom_query warning). As
                # everywhere else in ALINA, absent filters means "the whole corpus", which
                # is the existing semantics, not a new one.
                #
                # ============ DRAFT 9g: ONE CHUNK PER FILE, NOT EVERY CHUNK ===============
                # The store caps any filter_documents() call at 10 000 hits:
                # _prepare_filter_search_request() hard-codes {"size": 10_000} and there is
                # no parameter, on the store or on FilterRetriever, that raises it (checked
                # against the installed integration source). Scanning every chunk therefore
                # could never enumerate this corpus - it returned an arbitrary 10 000 of
                # them, 481 files out of the real total, and any file outside that window
                # was invisible. That is how "List of EUIs_04.2025.xlsx" went missing.
                #
                # The fix is to stop scanning chunks and scan FILES. scan_filter ANDs the
                # entitlement filters with `split_id == 0`, and every chunk carries a
                # split_id that restarts at 0 for each source document (verified on 10 418
                # trace chunks: split_id present and integer on all of them, and exactly
                # one or two split_id==0 chunks per file_id). So this now returns about one
                # chunk per file - a few hundred instead of tens of thousands - and the
                # listing is COMPLETE, comfortably inside the cap.
                #
                # The lister still checks whether the cap was hit, because at ~10 000 FILES
                # this would silently truncate again.
                #
                # Consequence: the listing no longer reports a chunk count per file, since
                # only one chunk per file is retrieved. That count was informational only.
                #
                # COST: ~6s per call before, much cheaper now. If it ever matters again,
                # add `return_embedding: false` to the store below - it strips the 768-dim
                # vectors, which are the bulk of the payload. The parameter exists in the
                # version checked on 08/09/2026, but VERIFY before adding: an unknown init
                # parameter fails the whole pipeline.
                type: haystack.components.retrievers.filter_retriever.FilterRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 768
                      index: ALINA-V0.3
                      use_ssl: false
                      # return_embedding: false   # see COST note above - verify first
              name_search:
                # ================= DRAFT 9f: NAME RESOLUTION BEYOND THE 10 000 ============
                # Full-text search on the name pattern, so a file can be resolved wherever
                # it sits in the corpus. Haystack's default BM25 body is a `multi_match`
                # with no `fields`, so OpenSearch falls back to index.query.default_field
                # ("*"): meta.file_name is searched along with the content. Matches on
                # content are noise here, but harmless - the lister re-filters on the file
                # name in Python, so this branch can only ADD files the scan missed.
                #
                # fuzziness AUTO (not 0 like the retrieval chain): this resolves names a
                # user typed from memory, where an edit or two is expected.
                # An empty query returns nothing, which is the correct behaviour: with no
                # pattern the listing comes from corpus_scan alone.
                # filter_policy is REPLACE by default, so the entitlement filters passed at
                # runtime apply - same path as every other retriever here.
                type: haystack_integrations.components.retrievers.opensearch.bm25_retriever.OpenSearchBM25Retriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 768
                      index: ALINA-V0.3
                      use_ssl: false
                  top_k: 500
                  fuzziness: AUTO
              lister:
                # Pure in-memory reduction: chunks -> distinct files. Touches no service.
                # DRAFT 9b: the listing is sorted by authority_rank (unknown last), each
                # line carries the rank AND its label, and the header carries the legend.
                # DRAFT 9i: the rank is OUTPUT ONLY. The tool no longer takes an
                # authority_rank argument, so nothing the model guesses can remove a file
                # from the listing; a file with no rank shows "authority_rank": /
                # "unknown" and sorts last, which is the only behaviour that ever mattered.
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    import json
                    import re
                    from haystack import component
                    from haystack.dataclasses import Document
                    # The store hard-codes a 10 000-hit cap on the scan. Since draft 9g the
                    # scan returns ~one chunk per FILE, so reaching this would mean ~10 000
                    # files; the check stays because a silent truncation here is exactly the
                    # failure that cost two debugging rounds.
                    SCAN_CAP = 10000
                    # Bounds the context cost of an UNFILTERED listing only. A listing
                    # narrowed by a name pattern is never truncated: the earlier cap applied
                    # to both, which hid files for no benefit.
                    MAX_FILES_UNFILTERED = 400
                    AUTHORITY_LABELS = {
                        1: "legal acts (Financial Regulation and annexes, EU directives)",
                        2: "internal rules, Commission decisions, circulars",
                        3: "guidance documents, vademecum",
                        4: "tender specifications, contract documents",
                        5: "Q&A logs, checklists, correspondence",
                    }
                    LEGEND = "authority_rank: " + ", ".join(f"{k} = {v}" for k, v in AUTHORITY_LABELS.items())

                    def _rank(value):
                        """Normalizes the meta value (int, numeric string or None) to int or None."""
                        try:
                            rank = int(str(value).strip())
                        except (TypeError, ValueError):
                            return None
                        return rank if rank in AUTHORITY_LABELS else None

                    @component
                    class CorpusFileLister:
                        """Reduces entitled chunks to a distinct-file listing, ordered by authority.
                        Receives documents from upstream retrievers (which own the document
                        store), so this component never opens a connection itself:
                          - `documents`    the exhaustive-ish scan, capped at SCAN_CAP;
                          - `name_matches` the BM25 hits on the name pattern, which reach
                                           the whole corpus and cover what the cap hides.
                        Name matching is done here, on meta.file_name: a regex when the
                        pattern compiles, a case-insensitive substring otherwise.
                        """
                        @component.output_types(result=str)
                        def run(self, documents: list[Document], name_matches: list[Document] | None = None, name_pattern: str = ""):
                            name_pattern = (name_pattern or "").strip()
                            scanned = len(documents or [])
                            scan_truncated = scanned >= SCAN_CAP
                            # Merge both sources, one entry per chunk.
                            seen_ids, merged = set(), []
                            for doc in list(documents or []) + list(name_matches or []):
                                if doc.id in seen_ids:
                                    continue
                                seen_ids.add(doc.id)
                                merged.append(doc)
                            pattern = None
                            if name_pattern:
                                try:
                                    pattern = re.compile(name_pattern, re.IGNORECASE)
                                except re.error:
                                    pattern = None
                            needle = name_pattern.lower()
                            files = {}
                            name_hits = 0
                            for doc in merged:
                                name = doc.meta.get("file_name") or "unknown"
                                rank = _rank(doc.meta.get("authority_rank"))
                                if pattern is not None:
                                    if not pattern.search(name):
                                        continue
                                elif needle and needle not in name.lower():
                                    continue
                                name_hits += 1
                                files.setdefault(name, {
                                    "file_name": name,
                                    "file_id": doc.meta.get("file_id"),
                                    "authority_rank": rank,
                                    "authority": AUTHORITY_LABELS.get(rank, "unknown"),
                                })
                            listing = sorted(files.values(), key=lambda e: (e["authority_rank"] is None, e["authority_rank"] or 0, e["file_name"]))
                            partial_note = (
                                " WARNING: the file scan hit its limit, so this listing is partial."
                                if scan_truncated else ""
                            )
                            if not listing:
                                if name_pattern and name_hits == 0:
                                    return {"result": (
                                        f'No accessible document matches "{name_pattern}".' + partial_note +
                                        " Retry with ONE distinctive word from the name (e.g. \"EUIs\" rather "
                                        "than \"List of EUIs_04.2025\"), and with an empty pattern to see the "
                                        "full list of accessible documents. If it is still absent, the document "
                                        "is not in this corpus or not accessible under the current entitlement: "
                                        "say so, and answer from search_corpus if the subject is covered "
                                        "elsewhere."
                                    )}
                                return {"result": "No documents are accessible in this conversation." + partial_note}
                            truncated = not name_pattern and len(listing) > MAX_FILES_UNFILTERED
                            if truncated:
                                listing = listing[:MAX_FILES_UNFILTERED]
                            header = f"{len(listing)} accessible document(s), highest authority first"
                            if truncated:
                                header += f" (showing the first {MAX_FILES_UNFILTERED} - narrow with a name pattern)"
                            header += partial_note
                            header += f"\n{LEGEND}"
                            body = "\n".join(json.dumps(e) for e in listing)
                            return {"result": f"{header}:\n{body}"}
            connections:
            - sender: scan_filter.filters
              receiver: corpus_scan.filters
            - sender: corpus_scan.documents
              receiver: lister.documents
            - sender: name_search.documents
              receiver: lister.name_matches
      # =========================================================================
      # TOOL 2: search_corpus - the entire v0.x retrieval chain, corpus-wide
      # =========================================================================
      - type: haystack.tools.pipeline_tool.PipelineTool
        data:
          name: search_corpus
          description: >-
            Search the whole document corpus with a short, self-contained query.
            Use for any question that does not target one specific document, to
            check whether a higher-authority source also covers a rule found
            elsewhere, and as the mandatory follow-up search after reading the
            Financial Regulation on a PRACTICAL question (conditions, procedure,
            thresholds, what to do in a case), to find the guidance that
            implements the provision. Not needed after a plain lookup, where the
            quoted provision is the answer. The corpus is not limited to
            procurement law: it also holds internal guidelines, HR and in-house
            service rules, contract and operational documents. Search before
            concluding that a question is out of scope. Returns the most
            relevant passages, each tagged with a reference token for citation.
          # ======================= DRAFT 6 FIX =======================
          # THE tool schema is now declared explicitly instead of being derived from
          # input_mapping. This is the fix for the empty-ChatMessage failure.
          #
          # Chain of evidence: the trace shows chat_generator(885ms, ok) ->
          # tool_invoker(6ms, ok) -> chat_generator(5ms, FAIL), with Total tokens 0.
          # No tool here can run in 6ms, and a ToolInvoker that returns that fast has
          # nothing to invoke: the assistant message carried NO tool call. In Haystack's
          # streaming path, a tool call whose accumulated arguments are empty or invalid
          # JSON is dropped with only a log warning, and the assembler then returns
          #   ChatMessage.from_assistant(text=None, tool_calls=[], ...)
          # i.e. a genuinely empty message. exit_conditions: [text] does not match it
          # either (no text), so the loop runs again and dies serializing it.
          #
          # Why the arguments were malformed: without an explicit `parameters`,
          # PipelineTool derives the LLM-facing schema from input_mapping - which here
          # also lists `filters` and `state_documents`. The model was being asked to
          # produce a `state_documents` argument typed list[Document]. That also answers
          # open question [U1']: inputs_from_state does NOT hide a parameter from the
          # schema, so state-fed inputs must be kept out of `parameters` by hand - which
          # is a SECURITY requirement for `filters`, not only a correctness one.
          # Consistent with list_corpus_files having worked: its only derived argument
          # was a plain string.
          #
          # IF THIS IS NOT ENOUGH: the remaining suspect is the streaming assembly
          # itself (the EC proxy may not emit argument deltas the way the assembler
          # expects). Test by removing `streaming_callback` from the agent for one run;
          # if that fixes it, keep the agent unstreamed and stream from a trailing
          # component instead - the app already handles a non-streamed result event
          # (finalizeBlock in search-stream/route.ts).
          # ===========================================================
          parameters:
            type: object
            additionalProperties: false
            properties:
              query:
                type: string
                description: >-
                  A short, self-contained search query: keywords and the terms
                  the documents themselves would use. Never paste conversation
                  history.
            required:
            - query
          input_mapping:
            # LLM-provided argument -> internal pipeline sockets (lists are fine HERE):
            query:
            - retrieval_query.query
            - ranker.query
            - ranker_scoring.query
            # State-provided (see inputs_from_state):
            filters:
            - bm25_retriever.filters
            - embedding_retriever.filters
            state_documents:
            - result_formatter.state_documents
          output_mapping:
            # {pipeline output socket: tool output name}
            result_formatter.documents: documents
            result_formatter.result: result
          inputs_from_state:
            # {state_key: tool parameter name} - STRING values (draft-2 fix).
            # [U1'] verify these are hidden from the LLM schema and win over LLM args.
            filters: filters
            documents: state_documents
          outputs_to_state:
            # New unique documents append to state.documents [U4].
            documents:
              source: documents
          outputs_to_string:
            # What the LLM receives as tool result: the rendered block only, never the
            # serialized Document list.
            source: result
          pipeline:
            components:
              retrieval_query:
                # v0.8 guard kept. The agent writes short queries, so this should never
                # trigger, but it is free insurance against maxClauseCount regressions.
                type: haystack.components.converters.output_adapter.OutputAdapter
                init_parameters:
                  template: '{{ query.split()[-100:] | join('' '') }}'
                  output_type: str
              bm25_retriever:
                type: haystack_integrations.components.retrievers.opensearch.bm25_retriever.OpenSearchBM25Retriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 768
                      index: ALINA-V0.3
                      use_ssl: false
                  top_k: 30
                  fuzziness: 0
              query_embedder:
                type: deepset_cloud_custom_nodes.embedders.nvidia.text_embedder.DeepsetNvidiaTextEmbedder
                init_parameters:
                  normalize_embeddings: true
                  model: intfloat/e5-base-v2
                  prefix: 'query: '
                  suffix: ''
              embedding_retriever:
                type: haystack_integrations.components.retrievers.opensearch.embedding_retriever.OpenSearchEmbeddingRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 768
                      index: ALINA-V0.3
                      use_ssl: false
                  top_k: 30
              document_joiner:
                type: haystack.components.joiners.document_joiner.DocumentJoiner
                init_parameters:
                  join_mode: reciprocal_rank_fusion
              ranker:
                # v0.7 memory settings kept (batch 8; agent multiplies reranker rounds,
                # so do NOT raise these without re-checking the OOM signature).
                type: deepset_cloud_custom_nodes.rankers.nvidia.ranker.DeepsetNvidiaRanker
                init_parameters:
                  model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
                  top_k: 10
                  batch_size: 8
                  meta_fields_to_embed:
                  - header
                  - file_name
                  embedding_separator: \n
              sentence_window_retriever:
                type: haystack.components.retrievers.sentence_window_retriever.SentenceWindowRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 768
                      index: ALINA-V0.3
                      use_ssl: false
                  window_size: 1
                  source_id_meta_field: file_id
                  split_id_meta_field: split_id
                  raise_on_missing_meta_fields: false
              window_joiner:
                type: haystack.components.joiners.document_joiner.DocumentJoiner
                init_parameters:
                  join_mode: concatenate
              ranker_scoring:
                # v0.6 fix kept: scores without trimming (top_k >= 10 * (2*1+1)).
                type: deepset_cloud_custom_nodes.rankers.nvidia.ranker.DeepsetNvidiaRanker
                init_parameters:
                  model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
                  top_k: 30
                  batch_size: 8
                  meta_fields_to_embed:
                  - header
                  - file_name
                  embedding_separator: \n
                  scale_score: true
                  calibration_factor: 1
              meta_field_grouping_ranker:
                # Groups by authority INSIDE the tool, before state append - never after
                # the agent, where reordering would break citation numbering.
                type: haystack.components.rankers.meta_field_grouping_ranker.MetaFieldGroupingRanker
                init_parameters:
                  group_by: authority_rank
                  subgroup_by: file_id
                  sort_docs_by: split_id
              result_formatter:
                # DRAFT 9c: stable citation tokens instead of positional numbers.
                # Dedup against state + v0.6 context budget unchanged.
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    import hashlib
                    from haystack import component
                    from haystack.dataclasses import Document
                    PER_DOC_CHARS = 12000
                    MAX_DOCS_PER_CALL = 30
                    TOKEN_LEN = 6
                    def citation_token(document_id):
                        """Stable per-document citation token. MUST stay identical in
                        attachment_formatter, both result_formatters and citation_renumberer."""
                        return hashlib.sha1(str(document_id).encode("utf-8")).hexdigest()[:TOKEN_LEN]
                    @component
                    class ResultFormatter:
                        """Renders passages for the LLM with STABLE citation tokens.
                        The reference is derived from the document id, not from a position,
                        so it does not depend on how many documents are already in state.
                        Parallel tool calls all read the same (possibly empty) state, which
                        is why positional numbering collided - see the DRAFT 9c header note.
                        citation_renumberer turns the tokens the model actually used into
                        [1], [2], [3] and rebuilds the documents list in that order.
                        state_documents is still used so a passage already in state is
                        re-rendered but not appended twice.
                        """
                        @component.output_types(documents=list[Document], result=str)
                        def run(self, documents: list[Document], state_documents: list[Document] | None = None):
                            known = {d.id for d in (state_documents or [])}
                            new_docs, blocks = [], []
                            for doc in documents[:MAX_DOCS_PER_CALL]:
                                if doc.id not in known:
                                    known.add(doc.id)
                                    new_docs.append(doc)
                                full = doc.content or ""
                                body = full[:PER_DOC_CHARS]
                                truncated = ' truncated="true"' if len(full) > len(body) else ""
                                tail = "\n[... this passage continues beyond what is shown here ...]" if truncated else ""
                                blocks.append(
                                    f'<document reference="{citation_token(doc.id)}" source="{doc.meta.get("file_name")}" '
                                    f'section="{doc.meta.get("header")}" page="{doc.meta.get("page_number")}"{truncated}>\n'
                                    f"{body}{tail}\n</document>"
                                )
                            if not blocks:
                                result = ("No documents found for this query. Reformulate, or tell the "
                                          "user you have no source material for this point.")
                            else:
                                result = ("Passages grouped by authority rank (earlier = higher legal "
                                          "authority). Cite each claim with the passage's reference "
                                          "token in square brackets, copied exactly, e.g. [a1b2c3].\n"
                                          "<documents>\n" + "\n".join(blocks) + "\n</documents>")
                            return {"documents": new_docs, "result": result}
            connections:
            - sender: retrieval_query.output
              receiver: bm25_retriever.query
            - sender: retrieval_query.output
              receiver: query_embedder.text
            - sender: bm25_retriever.documents
              receiver: document_joiner.documents
            - sender: query_embedder.embedding
              receiver: embedding_retriever.query_embedding
            - sender: embedding_retriever.documents
              receiver: document_joiner.documents
            - sender: document_joiner.documents
              receiver: ranker.documents
            - sender: ranker.documents
              receiver: sentence_window_retriever.retrieved_documents
            - sender: sentence_window_retriever.context_documents
              receiver: window_joiner.documents
            - sender: window_joiner.documents
              receiver: ranker_scoring.documents
            - sender: ranker_scoring.documents
              receiver: meta_field_grouping_ranker.documents
            - sender: meta_field_grouping_ranker.documents
              receiver: result_formatter.documents
      # =========================================================================
      # TOOL 3: search_in_file - identical chain + file_id constraint
      # Only the differences from search_corpus are commented.
      # =========================================================================
      - type: haystack.tools.pipeline_tool.PipelineTool
        data:
          name: search_in_file
          description: >-
            Search INSIDE one or more specific documents, identified by file_ids
            obtained from list_corpus_files, or by a known reference file_id
            such as the Financial Regulation's. Use whenever the user asks what
            a specific document says, defines or requires, and for every general
            question (definition, general rule, principle) on the Financial
            Regulation. On a practical question - conditions, procedure,
            thresholds, what to do in a case - the Financial Regulation is only
            the starting point: run a further search for the guidance that
            implements the provision rather than answering from the FR alone. On
            a plain lookup (what a term means, what a provision says) the quoted
            provision is the complete answer. If this returns nothing relevant,
            tell the user the named document does not contain it - do not
            silently substitute another source. Returns passages tagged with a
            reference token for citation.
          # DRAFT 6: explicit schema - see the note on search_corpus.parameters.
          parameters:
            type: object
            additionalProperties: false
            properties:
              query:
                type: string
                description: >-
                  A short, self-contained search query using the terms the
                  document itself would use. Never paste conversation history.
              file_ids:
                type: array
                items:
                  type: string
                description: >-
                  file_id values returned by list_corpus_files, or a known
                  reference file_id. Only documents with these ids are searched.
            required:
            - query
            - file_ids
          input_mapping:
            query:
            - retrieval_query.query
            - ranker.query
            - ranker_scoring.query
            # LLM-provided list of file_ids, ANDed with entitlement filters below.
            file_ids:
            - file_filter_merger.file_ids
            # State-provided:
            filters:
            - file_filter_merger.base_filters
            state_documents:
            - result_formatter.state_documents
          output_mapping:
            result_formatter.documents: documents
            result_formatter.result: result
          inputs_from_state:
            filters: filters
            documents: state_documents
          outputs_to_state:
            documents:
              source: documents
          outputs_to_string:
            source: result
          pipeline:
            components:
              file_filter_merger:
                # SECURITY-SENSITIVE (v0.8 warning applies): must AND, never replace,
                # the entitlement filters. Unit-test the empty/None base_filters path.
                # [O5] Use the exact field spelling the app sends today ("file_id" vs
                # "meta.file_id") - check src/app/api/haystack/search-stream/route.ts.
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    from typing import Any
                    from haystack import component
                    @component
                    class FileFilterMerger:
                        """ANDs the entitlement filters with a file_id constraint."""
                        # dict[str, Any], not bare dict: the retrievers' filters input is
                        # declared dict[str, Any] | None and haystack's connection type
                        # check rejects an unparameterized dict as the sender.
                        @component.output_types(filters=dict[str, Any])
                        def run(self, file_ids: list[str], base_filters: dict[str, Any] | None = None):
                            file_condition = {
                                "field": "file_id",
                                "operator": "in",
                                "value": [str(f) for f in file_ids if f],
                            }
                            if not base_filters:
                                return {"filters": {"operator": "AND", "conditions": [file_condition]}}
                            return {"filters": {"operator": "AND", "conditions": [base_filters, file_condition]}}
              retrieval_query:
                type: haystack.components.converters.output_adapter.OutputAdapter
                init_parameters:
                  template: '{{ query.split()[-100:] | join('' '') }}'
                  output_type: str
              bm25_retriever:
                type: haystack_integrations.components.retrievers.opensearch.bm25_retriever.OpenSearchBM25Retriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 768
                      index: ALINA-V0.3
                      use_ssl: false
                  top_k: 30
                  fuzziness: 0
              query_embedder:
                type: deepset_cloud_custom_nodes.embedders.nvidia.text_embedder.DeepsetNvidiaTextEmbedder
                init_parameters:
                  normalize_embeddings: true
                  model: intfloat/e5-base-v2
                  prefix: 'query: '
                  suffix: ''
              embedding_retriever:
                type: haystack_integrations.components.retrievers.opensearch.embedding_retriever.OpenSearchEmbeddingRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 768
                      index: ALINA-V0.3
                      use_ssl: false
                  top_k: 30
              document_joiner:
                type: haystack.components.joiners.document_joiner.DocumentJoiner
                init_parameters:
                  join_mode: reciprocal_rank_fusion
              ranker:
                type: deepset_cloud_custom_nodes.rankers.nvidia.ranker.DeepsetNvidiaRanker
                init_parameters:
                  model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
                  top_k: 10
                  batch_size: 8
                  meta_fields_to_embed:
                  - header
                  - file_name
                  embedding_separator: \n
              sentence_window_retriever:
                type: haystack.components.retrievers.sentence_window_retriever.SentenceWindowRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 768
                      index: ALINA-V0.3
                      use_ssl: false
                  window_size: 1
                  source_id_meta_field: file_id
                  split_id_meta_field: split_id
                  raise_on_missing_meta_fields: false
              window_joiner:
                type: haystack.components.joiners.document_joiner.DocumentJoiner
                init_parameters:
                  join_mode: concatenate
              ranker_scoring:
                type: deepset_cloud_custom_nodes.rankers.nvidia.ranker.DeepsetNvidiaRanker
                init_parameters:
                  model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
                  top_k: 30
                  batch_size: 8
                  meta_fields_to_embed:
                  - header
                  - file_name
                  embedding_separator: \n
                  scale_score: true
                  calibration_factor: 1
              meta_field_grouping_ranker:
                type: haystack.components.rankers.meta_field_grouping_ranker.MetaFieldGroupingRanker
                init_parameters:
                  group_by: authority_rank
                  subgroup_by: file_id
                  sort_docs_by: split_id
              result_formatter:
                # Same code as in search_corpus - keep the two copies in sync.
                # DRAFT 9c: stable citation tokens instead of positional numbers.
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    import hashlib
                    from haystack import component
                    from haystack.dataclasses import Document
                    PER_DOC_CHARS = 12000
                    MAX_DOCS_PER_CALL = 30
                    TOKEN_LEN = 6
                    def citation_token(document_id):
                        """Stable per-document citation token. MUST stay identical in
                        attachment_formatter, both result_formatters and citation_renumberer."""
                        return hashlib.sha1(str(document_id).encode("utf-8")).hexdigest()[:TOKEN_LEN]
                    @component
                    class ResultFormatter:
                        """Renders passages for the LLM with STABLE citation tokens."""
                        @component.output_types(documents=list[Document], result=str)
                        def run(self, documents: list[Document], state_documents: list[Document] | None = None):
                            known = {d.id for d in (state_documents or [])}
                            new_docs, blocks = [], []
                            for doc in documents[:MAX_DOCS_PER_CALL]:
                                if doc.id not in known:
                                    known.add(doc.id)
                                    new_docs.append(doc)
                                full = doc.content or ""
                                body = full[:PER_DOC_CHARS]
                                truncated = ' truncated="true"' if len(full) > len(body) else ""
                                tail = "\n[... this passage continues beyond what is shown here ...]" if truncated else ""
                                blocks.append(
                                    f'<document reference="{citation_token(doc.id)}" source="{doc.meta.get("file_name")}" '
                                    f'section="{doc.meta.get("header")}" page="{doc.meta.get("page_number")}"{truncated}>\n'
                                    f"{body}{tail}\n</document>"
                                )
                            if not blocks:
                                result = ("This document does not contain passages matching the query. "
                                          "Reformulate with the document's own vocabulary, or tell the "
                                          "user the named document does not contain this information.")
                            else:
                                result = ("Passages from the requested document(s), grouped by authority "
                                          "rank. Cite each claim with the passage's reference token in "
                                          "square brackets, copied exactly, e.g. [a1b2c3].\n"
                                          "<documents>\n" + "\n".join(blocks) + "\n</documents>")
                            return {"documents": new_docs, "result": result}
            connections:
            - sender: file_filter_merger.filters
              receiver: bm25_retriever.filters
            - sender: file_filter_merger.filters
              receiver: embedding_retriever.filters
            - sender: retrieval_query.output
              receiver: bm25_retriever.query
            - sender: retrieval_query.output
              receiver: query_embedder.text
            - sender: bm25_retriever.documents
              receiver: document_joiner.documents
            - sender: query_embedder.embedding
              receiver: embedding_retriever.query_embedding
            - sender: embedding_retriever.documents
              receiver: document_joiner.documents
            - sender: document_joiner.documents
              receiver: ranker.documents
            - sender: ranker.documents
              receiver: sentence_window_retriever.retrieved_documents
            - sender: sentence_window_retriever.context_documents
              receiver: window_joiner.documents
            - sender: window_joiner.documents
              receiver: ranker_scoring.documents
            - sender: ranker_scoring.documents
              receiver: meta_field_grouping_ranker.documents
            - sender: meta_field_grouping_ranker.documents
              receiver: result_formatter.documents
      # TOOL 4 (v1.1, not included): get_file_outline(file_id) - filter_documents sorted
      # by split_id returning header/parent_headers, for when in-file search misses.
      # See design doc §4.4. If it must be stateless it can use deepset's native CodeTool
      # (deepset_cloud_custom_nodes.tools.code_tool.CodeTool, @tool function in `code`),
      # but like list_corpus_files it needs the entitlement filters, so PipelineTool.
      # ---------------------------------------------------------------------------
      # OPTIONAL [O2]: if the app persists the `messages` output verbatim and chokes on
      # tool-call/tool-result messages, filter them inside citation_renumberer (it already
      # rebuilds the list) rather than adding another component: return only the rewritten
      # assistant message instead of `rebuilt`.
      # ---------------------------------------------------------------------------
connections:
- sender: attachment_converter.documents
  receiver: attachment_metadata_stamper.documents
- sender: attachment_metadata_stamper.documents
  receiver: attachment_formatter.documents
- sender: attachment_formatter.documents
  receiver: agent.documents
- sender: attachment_formatter.result
  receiver: agent.attachments
- sender: history_sanitizer.messages
  receiver: agent.messages
- sender: agent.messages
  receiver: citation_renumberer.messages
- sender: agent.documents
  receiver: citation_renumberer.documents

max_runs_per_component: 100

metadata: {}
# CONTRACT: identical inputs/outputs to v0.x - the app does not change. Only the producer
# of `documents` and `messages` moved from the agent to citation_renumberer (draft 9c).
inputs:
  query:
  - agent.query
  filters:
  - agent.filters
  messages:
  - history_sanitizer.messages
  files:
  - attachment_converter.sources

outputs:
  documents: citation_renumberer.documents
  messages: citation_renumberer.messages

pipeline_output_type: chat

