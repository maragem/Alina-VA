# Reference Q&A for the SUMMA assistant: 9 canned answers from the Pacioli workspace (SUMMA Q&A set 9)
# plus 127 entries extracted from the BUDGpedia FAQ page 'SUMMA questions and answers' (03/09/2026)
# with kit/tools/budgpedia_faq_to_qa.py. Guidance for the agent, never cited: the same content is
# indexed as citable documents from ../../summa/corpus-additions/. Known extraction limits: bullet
# markers and hyperlink targets are lost ('see the calendar' keeps only the link text).
# REVIEW before deploying: the canned answers and the FAQ are official text, but check them for
# statements that have since changed (release dates, 'not yet planned').
entries:
- question: How to create a recovery order for fines?
  answer: All the instructions are situated here. https://eceuropaeu.sharepoint.com/sites/budgpedia/SitePages/recovery-fines.aspx
  sources:
  - Pacioli support team canned answers (SUMMA Q&A set 9)
- question: How to encode a pre-financing?
  answer: Use tile "Create Supplier Down Payment Request" transaction code F-47
  sources:
  - Pacioli support team canned answers (SUMMA Q&A set 9)
- question: How to find/see an attached document?
  answer: To review the attachment, click on the “Services for Object”. Afterwards, press the “Attachment
    list” to check one of the documents.
  sources:
  - Pacioli support team canned answers (SUMMA Q&A set 9)
- question: How to know if a payment has been executed?
  answer: Please consult the tile manage supply line items and check if your document has been cleared.
  sources:
  - Pacioli support team canned answers (SUMMA Q&A set 9)
- question: What are the possible types of PO managed in SUMMA?
  answer: ZDC=ProcContract-Direct ZGA=Grant Agreement ZOLC=Other Legal Commit. ZSC-ProcContractSpecific
    ZSH=Shared Management
  sources:
  - Pacioli support team canned answers (SUMMA Q&A set 9)
- question: What does the word "SUMMA" mean?
  answer: SUMMA is not an acronym! SUMMA takes its name from "Summa de arithmetica, geometria, proportioni
    et proportionalita" written by my namesake Luca Pacioli. In "Summa de arithmetica" Pacioli first codifies
    the double entry accounting, which was already known since ancient Egypt.
  sources:
  - Pacioli support team canned answers (SUMMA Q&A set 9)
- question: Where can I find the accounts assignment field in an invoice?
  answer: There is no account assignment field selectable in the invoice.
  sources:
  - Pacioli support team canned answers (SUMMA Q&A set 9)
- question: how to change the supplier in a purchase order?
  answer: It is currently not possible to change the supplier of a purchase order. Please contact the
    summa helpdesk.
  sources:
  - Pacioli support team canned answers (SUMMA Q&A set 9)
- question: what does DPR mean?
  answer: DPR means Down Payment Request.
  sources:
  - Pacioli support team canned answers (SUMMA Q&A set 9)
- question: When will SUMMA go live in my entity?
  answer: 'Following the rollout of SUMMA to the pilot agencies CINEA, ERA and EUROJUST (2022) and CAJU
    (2023), SUMMA is live for the Commission and Executive Agencies as of November 2024 for the anticipated
    budget and as of January 2025 for full budget operations


    Other EU agencies and entities currently still using ABAC will be onboarded to SUMMA in two waves
    in January 2026 and January 2027. See the full list of planned SUMMA rollouts for these entities.


    For the management of Business Partners, SUMMA is already live, including for those entities still
    using ABAC, and replaces ABAC''s LEF/BAF module for the entry and maintenance of third parties and
    their bank accounts. The Business Partners created and updated in SUMMA are automatically replicated
    in ABAC, so there will be no impact on other ABAC processes.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Timeline of SUMMA releases',
    question 1
- question: When is the next SUMMA release planned?
  answer: SUMMA will continue to evolve with improvements and new functionalities released on a quarterly
    basis. Exact dates will be announced in due course, see the calendar for details. For more information,
    please visit the SUMMA releases page.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Timeline of SUMMA releases',
    question 2
- question: What is the SUMMA Change Network?
  answer: 'During the pre-SUMMA go-live phase, the Change Network - consisting of Change Coordinators,
    Change Leads, and STIGs (SUMMA Transition and Implementation Groups) - ensured that key messages reached
    all end users within a DG/Service. Acting as ''the eyes and ears'' at the local level, these change
    actors collectively gathered feedback in order to adjust the change approach accordingly. They then
    escalated this feedback to the SUMMA Programme Team via the defined channels and regular Change Network
    touchpoints.


    Following the SUMMA go-live, the focus gradually shifts towards the Local SUMMA Coordinators, who
    become increasingly vital as the roles of the change actors fade. They take the lead in supporting
    and sustaining change, ensuring that all SUMMA users receive smooth, continuous operational support
    in their day-to-day activities. Moreover, they serve as the first point of contact for users, replacing
    the Change Coordinators in this regard, and will remain active after hypercare in view of the system''s
    future evolutions and needs.


    Please refer to the list of Change Leads and Change Coordinators and the list of Local SUMMA Coordinators
    appointed in each DG/Service, to identify the relevant contact points in your area.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Change management', question
    1
- question: What were the responsibilities of the Change Coordinators?
  answer: 'The Change Coordinators were the single point of contact with the SUMMA Programme Team, overseeing
    and facilitating change activities within their DG/Service. Their responsibilities included:


    Monitoring change readiness alongside the SUMMA Transition and Implementation Groups (STIGs) at local
    DG/Service level, and aligning with Change Lead; Reporting and discussing change readiness with DG
    BUDG; Participating in regular touchpoints with DG BUDG; Managing the STIGs to drive pre-go-live activities;
    Following up on implementation local change plans, such as internal communication, and other preparation,
    such as UATs; Identifying and addressing roadblocks and concerns with the Change Leads and/or the
    SUMMA Programme team.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Change management', question
    2
- question: How did the SUMMA Programme team support the Change Network?
  answer: 'The SUMMA Programme team supported the Change Network by providing relevant materials and fulfilling
    key responsibilities related to change management including:


    Facilitate recurring touchpoints with the Change Coordinators; Promote good change management practices
    and facilitate the exchange of experiences; Track, report and regularly communicate the progress and
    development of overall change readiness and progression towards the specific activities outlined in
    the Change Readiness Checklist; Ensure coordination with DG BUDG for training, UAT, technology, communication
    and organisational readiness activities; Provide and promote selected learning and communication materials
    (e.g., webinars and training announcements), including materials based on Change Network feedback;
    and Provide templates (e.g., communications, the Readiness Checklist and progress monitoring); Provide
    guidance and keep up to date high-level plan of change management activities during the transition
    to SUMMA; Provide any other support needed for specific issues.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Change management', question
    3
- question: What is the Change Readiness Checklist?
  answer: 'The Change Readiness Checklist is a tool that was used to help each DG/Service monitor, track
    and follow up on preparatory activities that needed to be completed within the DG/Service in order
    to support the SUMMA rollout. In particular, the checklist helped DGs to identify actions to be implemented
    in five different activity areas: Testing, training, communication, technology and organisational
    preparedness. The tasks and activities on the checklist provided the basis for regularly tracking
    completion, monitoring change readiness feedback, and identifying next steps.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Change management', question
    4
- question: How important is the testing for the successful implementation of the programme?
  answer: 'Testing is essential for the successful implementation of SUMMA. It is the most effective means
    of ensuring that the system meets the requirements and is fit for purpose. During UAT, end users conduct
    tests that simulate real-world scenarios to ensure that the system meets their needs and functions
    as intended. This process ensures that any bugs or issues are identified and can be fixed before the
    system goes live.


    Ahead of the SUMMA go-live on 1 January 2025, we have already held UAT sessions with the Commission
    and Executive Agencies. Our experience shows that involving committed, experienced key users with
    a constructive mindset is vital to success. The UAT sessions for the next wave of entities to be onboarded
    to SUMMA in January 2026 concluded on 11 July 2025. Additionally, UAT sessions for entities going
    live in January 2027 will take place next year. Exact dates will be communicated in due course.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'User acceptance testing', question
    1
- question: Is training foreseen before the User Acceptance Testing?
  answer: 'Before the UAT campaign begins, kick-off sessions are organised to explain the main differences
    between SUMMA and ABAC, cover the testing process and to help users familiarise themselves with the
    new navigation system. This short onboarding exercise makes it easier for users to get started with
    SUMMA. However, it is not intended as a substitute for regular end-user training, which enables users
    to become fully autonomous in using the new system.


    Introductory training on specific topics, as well as hands-off workshops and info sessions, is available
    prior to the UAT. Key users are also encouraged to use the online training resources on BUDGpedia,
    including the SUMMA glossary, to better prepare for the UATs.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'User acceptance testing', question
    2
- question: How are the User Acceptance Testing sessions organised?
  answer: The UAT sessions organised by the SUMMA team are usually guided. After a brief introduction
    to the process to be tested and the test scenario(s) on the agenda, the testers execute the scenario(s)
    and document the results using a testing tool called Focused Build. The test scenarios provide very
    detailed instructions on what needs to be done. SUMMA experts are present to help participants execute
    the scenarios, providing step-by-step guidance and answering questions as needed.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'User acceptance testing', question
    3
- question: How much time should key users plan for the testing activities?
  answer: This depends on various factors, such as the number and duration of guided UAT sessions, involvement
    in additional exploratory testing after sessions, and the user's role during and after the session(s).
    Therefore, the estimate needs to be reassessed as the SUMMA programme progresses.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'User acceptance testing', question
    4
- question: What kind of feedback can testers provide to DG BUDG following the User Acceptance Testing?
  answer: Key users are asked to register test results and identified defects in a testing tool called
    Focused Build in a timely manner. This allows the SUMMA project team to analyse the overall results
    and track the resolution of defects. After each session, key users are given extra free testing time.
    This enables them to work through the scenario at their own pace, exploring variations and alternative
    scenarios to ensure the system meets their specific requirements.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'User acceptance testing', question
    5
- question: Could DG BUDG tailor the UAT sessions to the needs of each entity and increase the number
    of testers who participate?
  answer: 'We would have loved to tailor your sessions more. However, due to limited resources, we have
    to take a standardised approach to testing. Our priority is to ensure that the standard test scenarios
    work well for all entities that may require the tested business processes. These standard tests form
    the basis of SUMMA and are something that everyone should be familiar with.


    Moreover, we encourage key users to perform additional free tests based on their understanding of
    the standard scenarios. This results in variations of the standard scenarios being tested that reflect
    real-life situations, addressing more specific cases relevant to their entities, and combining the
    building blocks of the sessions completed so far.


    Furthermore, entities are encouraged to participate in or organise integration-focused UAT sessions.
    System owners typically play a leading role in such UATs.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'User acceptance testing', question
    6
- question: How does DG BUDG ensure that all crucial business scenarios are tested?
  answer: 'As SUMMA is already in production, extensive testing has been carried out on the system developments,
    and they have been approved for use. Entities that will be onboarded to SUMMA in 2026 and 2027 (with
    the exception of the EEAS, which has a specific development project) will receive a copy of the standard
    SUMMA template. Business Process Owners, with the help of Business Managers and experts, identify
    the key business processes that should be tested by end users in UAT sessions, to verify that the
    template is suitable and accurate for specific entities.


    The UAT planning details, including the sessions and tested scenarios, are shared with the Task Force
    managing the entities’ transition, and the scenarios are tested during the UAT campaign.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'User acceptance testing', question
    7
- question: How do testers from onboarding entities gain access to the testing environment?
  answer: Access is provided by the entities themselves. During the onboarding process, each entity nominates
    an ExAM (External Authorisation Manager) and an ExAM backup. After receiving the relevant training,
    they provide the necessary permissions to access the SUMMA test environment for users who have been
    officially nominated by their entity via ARES or an equivalent system. Access to the test environment
    is granted on a need-to-have basis and is not open to anyone working at the entity.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'User acceptance testing', question
    8
- question: Is it possible to conduct free testing for entities that are onboarded in 2026 and 2027?
  answer: Yes, once the UAT campaign has finished and any critical issues have been reported, users of
    the onboarded entities will be granted access to the test environment to perform free testing. Access
    may be provided by the entity's ExAMs (External Authorisation Managers). DG BUDG does not provide
    access for UAT or free testing for onboarded entities. Users who previously participated in the UAT
    will retain their access and can perform free testing without any additional access procedures.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'User acceptance testing', question
    11
- question: Is the Single Electronic Data Interchange Area (SEDIA) used for registering every business
    partner, or only for procedures for which eSubmission is required?
  answer: SEDIA cannot be used for every single Business Partner. For example, 'staff' BPs are usually
    managed by the PMO. Currently, the general obligation is to use REA Validation Services for all eSubmission
    procedures. Please note that additional types of procedures will gradually use eSubmission in procurement,
    so creating and validating the PIC will be very valuable for future implementation.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    1
- question: Are Business Partners created by one DG also available for the transactions of other DGs?
  answer: Yes, a BP created under one company code can be used by others. However, if the BP was created
    under a different company code - for example, a joint undertaking - you will first need to extend
    it to your company code in the SUMMA MDG. There is a specific button in the MDG ('Extend BP') that
    allows you to easily extend it to your own company code. Please note that it is not possible to extend
    a BP if it is blocked (the user will first have to request unblocking).
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    2
- question: When using SEDIA as an entry point, are the notions of Business Partner and PIC unified to
    avoid double validation of the PIC for existing Business Partners?
  answer: No, because the BP and the PIC (used in SEDIA/PDM) are different concepts that do not always
    correspond one-to-one. In accordance with the Financial Regulation, BPs registered in SUMMA are legal
    entities with legal personality (with the exception of ministries), or are treated as such. This is
    not always the case for PICs registered in PDM.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    3
- question: In the event of mergers or takeovers, are the relevant changes replicated in the Purchase
    Orders, or do they need to be amended manually, as it was in ABAC?
  answer: This continues to work as it did in ABAC. In SUMMA, changes resulting from mergers or takeovers
    are not replicated automatically in Purchase Orders, requiring manual intervention by the user instead.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    4
- question: Are there any controls to ensure authenticity of data provided by a BP, e.g. in the event
    of a change of bank account?
  answer: As per the Financial Regulation, it is the responsibility of the Initiating Agent (IA) to confirm
    the payer's identity. Like ABAC, SUMMA provides controls (business rules and algorithms) to confirm
    the validity of the data, but it is the IA who must confirm that it corresponds to the provided name.
    BUDG C3 also performs post-quality control checks on a sample of data to ensure the authenticity of
    the data and smooth payment to entities.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    5
- question: What is a BP contact?
  answer: A BP contact is a way to register the contact details of a business partner (e.g. the name,
    address and phone number of a person or department).
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    6
- question: How should a company with different branches in other countries be registered?
  answer: As branches do not have legal personality, they cannot be registered as BPs. Only the company
    itself will be registered as a BP, while the branches’ bank accounts are under the mother company.
    The applicable rules remain the same in this respect and do not change with SUMMA.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    7
- question: How are consortia/group members registered in SUMMA?
  answer: We only register a BP for a consortium if it has legal personality, just like we did in ABAC.
    Otherwise, the Purchase Order should be made out to one of the consortium members. Please click here
    for more information on consortia.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    8
- question: Do BP checks include beneficial ownership?
  answer: No, as these are aimed at the completeness, relevance and accuracy of the data provided by the
    initiating services, this is not foreseen for post-validation checks.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    9
- question: Is there mandatory training on BPs? If so, who is the target audience for this training?
  answer: Yes, mandatory training is provided for Initiating Agents who will be registering Business Partners
    in SUMMA. More information about training can be found here.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    10
- question: Have the LEF/BAF that were already in ABAC been transferred to SUMMA? Or must DGs enter all
    historical BPs in SUMMA?
  answer: All the LEF/BAF created or used in the last 2 years, or having open transactions, were migrated
    to SUMMA before the go-live. If you are still using ABAC and wish to have a blocked LEF/BAF in SUMMA
    please contact BUDG-SUMMA-BP@ec.europa.eu. If you are working fully in SUMMA and need a BP that was
    not migrated, ABAC should not be regarded, and you should create a BP from scratch with all the necessary
    documentation (even if this entity existed before in ABAC). More information can be found here.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Business partners', question
    11
- question: What approach is used for data migration?
  answer: For the migration of the European Commission data and the subsequent data migration in 2026
    and 2027, a greenfield approach will be applied. This involves migrating only open ABAC transactions
    while all closed transactions remain in ABAC, open for consultation. For full contract cycle monitoring,
    a dedicated data warehouse solution allows users to view closed ABAC transactions, as well as open
    SUMMA transactions in a single contract view in the 'Single view of file' report.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Data migration', question 1
- question: What transaction data was migrated to SUMMA (Data Migration scope)?
  answer: 'Data migration included the following transactions:


    All open transactions related to the legal commitment identified in ABAC at the end of the year (after
    the execution of the carry forward/carry over); All open transactions that are not related to a legal
    commitment, but relevant for business continuity.


    More specifically, all of the following transactions were migrated:


    Carried-forward/Carried-over budget appropriations; Open commitments (''RAL'' - reste à liquider >
    0) Budgetary commitments with open amount; Validated legal commitments with open budgetary commitments;
    Commitments with RAL = 0, but with open pre-financing still to be cleared in SUMMA; Open invoices
    (cost claim, commercial invoice, internal invoice, internal document); Open pre-financing payment
    (balance); Open forecasts of revenue with open amount; Open recovery orders with open amount; General
    Ledger ''GL'' balance and open items; Budgetary Guarantees (LIGA); Inventoried items and balances.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Data migration', question 2
- question: What transaction data was not migrated to SUMMA (Data Migration scope)?
  answer: 'Data migration did not include the following transactions:


    Closed transactions.


    More specifically, all the following transactions are not migrated:


    Closed commitments (''RAL''- reste à liquider = 0) except if these have an open pre-financing still
    to be cleared; Closed budgetary commitments without open amount. Note that commitments level 1 with
    no open amount (RAC ''reste à contracter'' = 0) still have to be migrated if at least one of their
    linked commitments level 2 has RAL >0. This is in line with the carry-forward process; Closed invoices:
    invoices fully cleared by a payment and/or by a pre-financing; Closed recovery orders: recovery without
    open amount; Closed forecast of revenues: forecast without open amount; Payments: payment requests
    and payment orders are not migrated; Framework contracts and procedures (managed by eProcurement).'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Data migration', question 3
- question: What master data was migrated to SUMMA (Data Migration scope)?
  answer: 'Data migration included the following master data:


    Extension of legal entities: vendors, customers, bank accounts; Inventory: products (material), functional
    location, inventory balance/inventoried items (equipment in storage location/functional location);
    Fixed Assets.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Data migration', question 4
- question: What is to be considered as an open transaction and a closed transaction in ABAC (Data Migration
    scope)?
  answer: 'DG BUDG released the Open transaction dashboard which simulates the scope of transactions selected
    for migration to SUMMA.


    The definition of open and closed transactions is the following:


    ABAC open transactions (migrated to SUMMA) are transactions either in the workflow or validated but
    with open amounts in ABAC ABAC closed transactions (not migrated to SUMMA) were completed in the past,
    and there are no further changes allowed on them in ABAC.


    For more details, see the answers to questions 2 and 3.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Data migration', question 5
- question: Will we get access to the SUMMA data warehouse with the migrated data after go-live?
  answer: 'Yes, the SUMMA data warehouse access remains available. Please consult the following pages
    dedicated to SUMMA reporting:


    SUMMA reporting - access and procedures SUMMA dashboards.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Data migration', question 6
- question: Will it be possible to do some sort of merger between data from the "frozen" ABAC DATA-WAREHOUSE
    and the dashboards?
  answer: All closed financial transactions in ABAC will remain available in the ABAC DWH. SUMMA datawarehouse
    will contain only a reduced set of ABAC data linked to open/ongoing transactions. Both ABAC and SUMMA
    data are already presented in the SUMMA dashboard called “Single View of File”, which allows contract
    financial monitoring with data coming from both ABAC and SUMMA.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Data migration', question 7
- question: Will access to the ABAC warehouse remain open?
  answer: ABAC warehouse remains accessible. While you can still consult its content, editing is no longer
    possible.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Data migration', question 8
- question: What will happen to the documents we have in ABAC? Will they be migrated?
  answer: Supporting documents are in scope and will be migrated to SUMMA.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Data migration', question 9
- question: Which systems are integrated with SUMMA?
  answer: 'A limited set of corporate and local systems are "integrated" with SUMMA to implement seamless,
    efficient, end-to-end processes. These systems exchange bilaterally information with SUMMA (reading
    and writing) in a way that ensures that financial transactions are properly recorded in SUMMA. The
    list was approved by the ITCB following a rationalisation study:


    Systems that will be interfaced with SUMMA Systems that will be interfaced with SUMMA pending availability
    of a corporate system Systems that will not be interfaced with SUMMA eGrants eProc


    COLI/COLI2 (EMPL) CRIS (INTPA/DIGIT)


    APPFIN (EACEA) FASIS (REA)


    Systems that will be interfaced with SUMMA Systems that will be interfaced with SUMMA pending availability
    of a corporate system Systems that will not be interfaced with SUMMA ESIF systems (AGREX, RDIS, SFC)


    PMO systems (Payment Factory, AGM and MIPS)


    OPSYS including MAPP (INTPA/DIGIT)


    REMIS (OIB – connected to ABAC SAM)


    FINSJ (LS)


    Service Now (in development – DIGIT) HOPE (ECHO)


    BLUEBELL (ERCEA)


    TREFFLE (DGT) JIPSY (JRC)


    PEGASUS II (EACEA)


    STAGES (EAC)


    WIFI4EU (CNECT)


    GRIF (SCIC)


    eSIRE (HR) More information: Info session 1 on eGrants - 14/03/2024 Info session 2 on eGrants - 21/03/2024


    Systems that were not approved by the ITCB are not allowed to integrate directly with SUMMA. However,
    local systems that only need to read data in SUMMA are offered access to the EC Corporate Data Warehouse
    or the SUMMA Data Warehouse. The respective system owners need to take the necessary measures to adapt
    their systems accordingly.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'SUMMA integration with other
    systems', question 1
- question: How does the rationalisation exercise and SUMMA integrations contribute to the Commission's
    efficiency?
  answer: The rationalisation exercise included an initial assessment to avoid redundant system functionality.
    For each integrated system, the integration design ensures that the responsibilities of each system
    for data and controls are clearly defined and that there is no duplication or overlap. This reduces
    the Commission's overall IT maintenance costs while improving data quality.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'SUMMA integration with other
    systems', question 2
- question: Is SUMMA able to receive data from local systems to extend the standardisation of certain
    fields as e.g., the contract reference, and facilitate an integrated reporting?
  answer: The main tool to achieve this is the shared space in the corporate Data Warehouse, which allows
    combining operational and financial data without replication. As for SUMMA, it is possible to store
    data describing transactions in the WBS structure. In addition, there is a SUMMA web service that
    allows to tag any operation. A tag is any text associated with a transaction ID. It is possible to
    create many tags per one transaction ID.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'SUMMA integration with other
    systems', question 3
- question: How many workflow phases are foreseen in SUMMA?
  answer: 'The number of the workflow phases in SUMMA depends on the type of transaction being performed.
    For certain key expenditure transactions requiring in-depth controls and checks, such as the creation
    of a Fund Reservation, a Purchase Order and a Payment, a classical workflow with 3 phases has been
    developed in SUMMA, while for the payment a 4th phase is added including the Accounting Officer validation.


    This principle of having 3 or 4 phases must be applied to all transactions of the same type, irrespective
    of the level of difficulty of the controls performed. For the above-mentioned transactions, the classical
    workflow implemented in SUMMA includes the following 3 phases, in line with the Financial Regulation:


    Initiation Verification Authorisation


    However, for certain budgetary transactions, such as budget transfer validation, it has been decided
    to apply and develop a classical workflow involving only 2 phases (Initiating Agent / Authorising
    Officer). There''s also a particularity for the invoice workflow with mandatories DEA (Data Entry
    Agent) and IA visas. With in addition an AO visa if there''s a clearing related to the invoice.


    A distinction must also be made between a ''phase'' which implies a VISA from the User in the system
    and a ''step''. There are certain steps (actions) that can be performed by a user directly in SUMMA
    without giving a VISA. This is the reason why, for example, the goods receipt is posted in 1 step.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Workflows', question 1
- question: Will there be a simple Initiating Agent workflow for creating Purchase Orders in SUMMA?
  answer: No, the creation of Purchase Order will be subject to a 3-phase workflow (Initiating Agent/Verifying
    Agent/Authorising Officer).
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Workflows', question 2
- question: Will there be a workflow tool for transactions not carried out in eGrants or eProcurement?
  answer: In its EC Release version, SUMMA foresees that all Procurement and Grant contracts will be managed
    in corporate solutions, such as e-Grants or e-Procurement. The standard workflow will apply for transactions
    to be processed directly in SUMMA.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Workflows', question 3
- question: Can an Authorising Officer by delegation (AOD) decide to use a simplified procedure?
  answer: A predefined dedicated workflow is set up for each type of transaction in SUMMA. This is different
    from ABAC, where an Initiating Agent can choose its own workflow à la carte per type of transaction.
    The possibility of simplified workflows is being analysed.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Workflows', question 4
- question: What will be the workflow of a cost claim in SUMMA, including reception, admissibility, eligibility,
    and how will the "stop the clock" of the different steps be implemented?
  answer: 'Invoices in ABAC have 2 steps:


    Step 1: registration of the invoice in the accounts followed by Data Entry Agent visa. Step 2: analysis
    and verification of the invoice eligible amount and opening the possibility of a payment, followed
    by Initiating Agent visa.


    The workflows for the invoices in SUMMA will have similar steps:


    Invoice parked and saved: registration of the invoice in the accounts. Status set by DEA. The DEA
    also provide his visa. Invoice posted: analysis and verification of the invoice eligible amount and
    opening the possibility of a payment. Note that the budgetary information such as budgetary commitment,
    budget line, etc. is mandatory in SUMMA in order to post an invoice. IA performed this and provided
    his visa. If there is a clearing to be performed with the invoice there''s a third visa to be provided
    by the AO.


    SUMMA invoice posted = ABAC invoice + ABAC payment request.


    The "stop the clock" is managed via the solution identified for suspensions and is similar to the
    functionalities existing in ABAC.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Workflows', question 5
- question: Is there any integration between ARES validation workflows and SUMMA workflows?
  answer: No. This is not planned.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Workflows', question 6
- question: Does the Initiating Agent's signature (process/terminate) have a financial impact (e.g. triggers
    budget consumption or accounting entry) or his/her involvement is merely procedural?
  answer: The simple creation of a Purchase Order triggers the blocking, reservation of the budget, whereas
    only a visa from the Authorising Officer Responsible (AOR) allows it to be consumed.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Workflows', question 7
- question: Regarding security, ABAC required a password for validation, whereas in SUMMA it is just a
    click. Is additional security planned?
  answer: SUMMA relies on the secure corporate standard EU-Login for authentication. No additional re-
    authentication is required for validation.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Workflows', question 8
- question: Does SUMMA allow extra light workflows for the invoice and payment directive, which consists
    of only 2 visa steps?
  answer: 'No, this is not foreseen. The pre-financing workflow was subject of a RUF working group in
    May- June 2022. The results were presented at the RUF in July 2022. It was decided that the workflow
    for pre-financing would also consist of three distinct and separate phases (Initiation, Verification
    and Authorisation), in line with the Financial Regulation.


    The shorter workflow (IA-AOR) was not adopted for two reasons:


    SAP/SUMMA only allows one workflow model per type of transaction and the working group was asked to
    find the most appropriate one. There are several departments in the Commission that have requested
    to have a separate verification visa as there are pre-financing payments that are more complex and
    deserve accurate and thorough verification before the authorisation.


    While in some ABAC workflow models the verification is implicitly embedded in the AO visa, in SUMMA
    there needs to be an explicit visa to ensure that the verification has been carried out prior to the
    authorisation. Initiation and verification are mandatory phases performed by two different actors
    in compliance with the four-eyes principle of the Financial Regulation.


    In this framework, with the SUMMA 3-step workflow, it is possible to allocate the FVA and AOS tasks
    to the same user and, despite the need to click twice in the system, the actual execution time can
    be faster than a single visa in ABAC. This was demonstrated during the UAT organised in May – June
    2023.


    The same principles explained above apply to de-commitments.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Workflows', question 9
- question: What does the rationalisation of the chart of accounts consist of?
  answer: The rationalisation of the Chart of Accounts is aimed at giving more structure to the numbering
    of the General Ledger Accounts (GLA), so that we can easily distinguish between assets and liabilities,
    current and non-current etc. The impact on typical users will be limited, as several mechanisms have
    been put in place to ensure the automatic derivation of the GLAs. In the P2P flows, SUMMA automatically
    derives the GLA code based on the information registered in the legal commitment (e.g. Purchase Order,
    the type of contract and the type of items ordered).
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 1
- question: Will the Purchase Order remain active/open if we pay out 100% of the amount as Pre-Financing?
  answer: A Purchase Order is not only the equivalent of a RAL (Reste à Liquider) in a level 2 commitment,
    but also the registration of the legal commitment, as well as the breakdown and the list of "materials",
    services purchased, or actions as part of a grant. As long as there are costs or expenses to be accepted,
    the Purchase Order is in fact available for the goods receipt (GR) or service entry sheets (SES) to
    allow the acceptance of costs and the clearing of pre-financing.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 2
- question: What is the procedure for clearing pre-financing in SUMMA?
  answer: The clearing of Pre-Financing is completely covered by SUMMA. When processing invoices, the
    system informs about the pre-financing paid (down payment) in order to warn the financial agents about
    the possibility of encoding the corresponding clearing in a special tab of the invoice.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 3
- question: Does a Suspension in SUMMA suspend both Commitment and Payment?
  answer: The solution for suspending invoices and payments (pre-financing or normal payments) is similar
    to ABAC. This solution meets the requirements of the Financial Regulation or legal commitments. Suspensions
    in SUMMA can be "total" or "partial". If an invoice is partially suspended, a partial payment is still
    possible. No suspension of the Purchase Order (PO) is foreseen at this stage.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 4
- question: Who are the candidates to use Goods Receipt (GR)?
  answer: All DGs (except OIB and OIL) and Ex. Agencies should use exclusively Goods Receipt for purchased
    goods and services (as explained on page 48 of this SUMMA manual) and for grants (as explained on
    page 77 of this SUMMA manual ).
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 5 (Use
    of Service Entry Sheets/Goods Receipt)
- question: Who are the candidates to use Service Entry Sheets (SES)?
  answer: DGs and Ex. Agencies that have not previously utilised the Service Entry Sheet (SES) in ABAC
    should refrain from using it in SUMMA. Currently, SES is exclusively available for use by the OIB
    and OIL.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 5 (Use
    of Service Entry Sheets/Goods Receipt)
- question: What steps should I take to begin using SES?
  answer: Please note that the use of Lean Service Entry Sheets is included in the E-Procurement system
    roadmap and will be made available to all DGs in a future release. Following the release of the E-
    Procurement corporate solution into production, SUMMA's Lean Service Entry Sheets will be made available
    to all DGs and Executive Agencies. If you are interested in exploring the future use of SES and aligning
    this process with the specific requirements of your DG, please contact the SUMMA Expenditure Team.
    You can arrange a meeting by contacting the EC SUMMA Helpdesk.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 5 (Use
    of Service Entry Sheets/Goods Receipt)
- question: Is there any difference from an accounting perspective between using service entry sheets
    (SES) or the goods receipt (GR) process?
  answer: No, there is no difference. Regardless of whether DG choose materials classified under 3* or
    4*, both processes will reference the same GL account, as the assigned material group remains consistent.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 5 (Use
    of Service Entry Sheets/Goods Receipt)
- question: Can I change the material from 3* to 4* on migrated POs?
  answer: 'No, materials should not be changed on migrated POs, as this may lead to unforeseen issues
    within the purchase process flow. Additionally, such changes will not affect GL accounting. The SUMMA
    Expenditure process flow for all DGs (except OIB and OIL) use the Goods Receipt (GR) process by default,
    following:


    Goods Receipt – linked to 3* material codes. Standard Service Entry Sheets – no material is required
    (this specific solution design applies only to OIB & OIL). Lean Service Entry Sheets (not permitted
    for use in 2025, to be supported by E-Procurement in the future) – linked to 4* material codes. In
    case you have doubts please reach EC SUMMA Helpdesk.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 5 (Use
    of Service Entry Sheets/Goods Receipt)
- question: Changes in GL Accounts
  answer: There has been a dedicated SUMMA Clinic about GL accounts. Please consult the recording, presentation
    and infographics for further information.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 6
- question: How is the GL account determined in purchase orders?
  answer: The GL account is determined based on the material group assigned to the selected PO material.
    This means that users are unable to modify the GL account manually. The correct selection of the material
    is crucial to ensuring the appropriate GL account is applied.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 6 (Changes
    in GL Accounts)
- question: Can I change the GL account in a PO item without changing the material?
  answer: No, the correct selection of the material is essential to ensure the appropriate assigned GL
    account.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 6 (Changes
    in GL Accounts)
- question: What should I do if I notice an incorrect GL account in a migrated PO?
  answer: 'It is advisable to avoid making changes to migrated documents unless necessary. Instead, you
    should assess whether the discrepancy impacts accounting:


    Verify the amount and determine if it affects the EC level reporting. Review the category of the GL
    account. In most cases, both the incorrect and correct GL accounts belong to the same category (e.g.,
    commercial services, distinct from core business activities such as subsidies). As a result, such
    errors typically do not affect the interpretation of the EC financial statements.


    If, after this reflection, you still believe that GL account needs to be corrected on migrated POs,
    please refer to the guidance on "How should I post-process a migrated PO if I notice it needs correction?"
    for further instructions.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 6 (Changes
    in GL Accounts)
- question: How should I post-process a migrated PO if I notice it needs a GL account correction and/or
    WBS code (*in case of PO related to IGIA)?
  answer: 'The corrective action depends on the status of the purchase order (PO): Please note that the
    following corrective actions are not applicable to pre-financing lines of the purchase order. Scenario
    1: POs where the invoice has already been validated and paid Invoice or Goods Receipt (GR) correction
    is not possible. For material amounts, the accounting team can make a correction entry at year-end
    to reclassify the amounts to the correct WBS code(*) and/or expense account, but this is only applicable
    if the amounts are material. Information regarding the materiality threshold is provided annually
    through the closure instructions. Scenario 2: For POs that are still open with future payments pending
    An amendment to the migrated PO is needed to affect the future GR and Invoice. To do this, de-commit
    the migrated PO item for the remaining open amount and create a new line item. If the PO item is not
    linked to a fund reservation, please contact helpdesk support to restore the remaining budget line.
    Be sure to provide a complete list of the affected POs. The amendment will initiate a new workflow
    process. Scenario 3: For POs where the invoice has been validated but not yet paid, and is linked
    to fund reservation For such cases, please proceed with the following steps: 1. Cancel the invoice
    and the GR document. 2. Mark the migrated item as deleted. 3. Duplicate the migrated Purchase Order
    (PO) item to create a new entry and update the material code and/or WBS Code (*) accordingly. Ensure
    that the quantity and amount remain unchanged to avoid any impact on the budget. This amendment will
    trigger the initiation of a new workflow process.


    Scenario 4: For POs where the invoice has been validated but not yet paid, not linked to fund reservation
    In general, if a PO originating from previous years (migrated) and not linked to funds reservation,
    is de-committed, then a potential removal of corresponding commitment appropriations would occur,
    e.g. if PO was on funds which cannot be legally reused like VOBU/2024. In that situation, please proceed
    with the following steps: 1. Cancel both the invoice and the GR document. 2. Mark the migrated item
    as deleted. 3. Contact the helpdesk to restore the budget and provide the full list of affected PO
    items. This request will be analysed, and available budget will be restored if justified. 4. Duplicate
    the migrated PO item to create a new item and adjust the material code and/or WBS Code (*). No changes
    should be made to the quantity or amount to avoid impacts on budget. This amendment will trigger the
    initiation of a new workflow process.


    Scenario 5: For POs with no invoice or GR Please update the material in the PO item. Ensure that there
    are no changes to the quantity or amount in order to avoid any impact on the budget. Scenario 6: For
    POs with parked invoices and no GR Please proceed with the following steps: Delete the parked invoice
    linked to the PO item. Update the material and/or WBS Code (*) in the PO item and ensure that there
    are no changes to the quantity or amount to avoid any impact on the budget .


    Regarding the PO related to IGIA projects for which a WBS Code is used, taking into account the number
    of transactions concerned and that correcting the GL account and WBS CODE on the migrated POs is difficult
    (see information above), you are not expected to correct in all migrated POs the incoherences in GL
    accounts and WBS Code, you can proceed with mass correction using G* postings in SUMMA for year-end
    corrections.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 6 (Changes
    in GL Accounts)
- question: What should I do if I need to issue my invoice to a different GL account for the same contract?
  answer: For newly created contracts, select the material code at the PO item level that best represents
    the predominant nature of the service, especially if you anticipate invoicing against different GL
    accounts. For migrated POs, please refer to the guidance on "How should I post-process a migrated
    PO if I notice it needs correction?" for further instructions.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 6 (Changes
    in GL Accounts)
- question: How should I proceed to handle the migrated services and supply contracts initially managed
    in ABAC Assets?
  answer: The procurement contracts initially managed in ABAC Assets mu st be amended and processed within
    ABAC Assets. Data related to amendments, good receipt, invoices and equipment will flow to SUMMA through
    the integration between the two systems. If you encounter any issues or require further clarification
    regarding the post-processing of migrated procurement contracts, the e-Procurement Helpdesk team is
    available to assist you. For more information, please refer to the relevant user guide, which details
    the two approaches used for the migration of procurement contracts from ABAC Assets and ABAC Workflow
    to SUMMA.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 7 (Post-processing
    of migrated procurement contracts from ABAC Assets/ABAC Workflow)
- question: I am currently unable to find the migrated commitments for internal legal entities (LE Key
    6999*). What I should I do?
  answer: Intra-Commission DGs transactions are excluded from the migration scope, as they follow a distinct
    creation process that is fully compatible with the SUMMA intra-billing solution. These transactions
    will be generated in bulk by the SUMMA solution team and communicated to the users accordingly.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Expenditure', question 8
- question: Can we budget only by unit? When defining the granularity of the budget, is it possible to
    define different granularity level for operational budget lines and for administrative budget lines?
  answer: 'You will be able to manage the budget at unit, directorate or DG level and post on the same
    or different levels.


    DGs have a possibility to choose between:


    Budgeting and posting at the same level: DG, Directorate, Unit; or Budgeting at higher level (DG)
    and posting at lower level (Directorate, Unit or delegation like INTPA for example). Different granularity
    for administrative/operational budget or shared/direct management budget. The DGs'' preferences have
    been communicated to DG BUDG. The conclusions have been summarised in the SUMMA Working Group on Budget
    Structure.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    1
- question: What about administrative and prerogative budget lines in the funded programme?
  answer: The funded programme works similarly to an ABAC local position. It represents a local extension
    in the budget line and is part of the budget structure. Funded programmes that have been defined for
    SUMMA together with DGs/Executive Agencies are in the majority of cases derived from ABAC local positions
    but transformed for SUMMA following data rationalisation and better master data governance objectives.
    If a DG would like to break down their budget beyond the already available elements of the budget
    structure element (e.g. Funds Centre, Commitment Item), the Funded Programme can be used to have budget
    control at a lower level. If such a lower granularity is only needed for reporting purposes, only
    the WBS shall be used with reference to the Funded Programme “EMPTY”.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    2
- question: In the case of granularity at unit level and expenditure directly linked to the Director-General
    or Deputy Director-General, what operational unit should be indicated?
  answer: There is no possibility to introduce the organisational data (responsible organisation in ABAC)
    at transaction level. The choice of the granularity of the fund centre is crucial for your later reporting.
    Therefore, there will be no reporting data at unit level when the fund centre is at DG or directorate
    level.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    3
- question: How will the fund management work for co-delegated budget be handled – by the Operational
    Unit of the receiving DG or by the co-delegating DG?
  answer: The operational unit will be in charge of managing the file (receiving DG).
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    4
- question: What is the "Unit" that will appear in SUMMA budget structure? Is it the one providing the
    "certified correct" or the Authorising Officer by Sub-Delegation unit?
  answer: The unit is defined as the operational unit, the main responsible for the project or file.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    5
- question: What is meant by posting?
  answer: In SUMMA, there will be budget addresses (where the budget is inscribed) and posting addresses
    (where the budget is consumed). This concept also exists today in ABAC (Credit versus Consumption
    lines).
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    6
- question: Will a line that is used by 10 units result in 10 lines?
  answer: Yes, one budget address for each unit.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    7
- question: In case of reorganisations, files do not always follow the new units. Will the reorganisation
    updates in SYSPER be applied automatically?
  answer: 'In such cases, DG BUDGET would need to be informed to perform a custom re-assignment.


    In case of partial reorganisations, the DG will need to indicate the part of the files that need to
    be reassigned.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    8
- question: Is the budget availability checked at WBS level?
  answer: The budget availability is checked at the Funded Program/Budget Address level.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    9
- question: Can "project keys" be interpreted as calls within a work programme?
  answer: Project keys are individual references of a project. The funded program is the overarching level
    for a group of projects. The call ID could become the funded program.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    10
- question: Would it be up to the eGrants system to create the budget addresses in SUMMA since the project
    ID is part of the address?
  answer: No. Budget addresses are created only by a specific user intervention (generate budget addresses
    elements).
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    11
- question: Could we also make transfers in N+1 if the same constraint remains as it is now for the CL1
    in ABAC?
  answer: The proposed way forward is to encode estimated amounts by unit and modify these amounts once
    the exact allocations are known. DG BUDGET has issued a SUMMA business requirement to allow re-allocating
    amounts within a fund reservation or between funds reservations even from previous years.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    12
- question: How will you manage H7 administrative budgets in the Funded Programme?
  answer: The definition of Funded Programmes is up to the DGs, who can define them according to their
    specific business requirements to add more detail to their budget line. In case further advice on
    Funded Programmes is needed, a request for further guidance can be sent to the SUMMA Helpdesk.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    13
- question: What will be the procedure for the prerogative budget lines that are used by the entire DG?
  answer: Such commitments could be fully allocated to a central unit managing common expenditure.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    14
- question: What about a provisional commitment used to cover expenditure for the whole DG (i.e., mainly
    administrative expenditure - missions of staff, salaries).
  answer: Such commitments could be fully allocated to a central unit managing common expenditure.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    15
- question: Who will have the responsibility / duty in SUMMA to internally transfer the credits in a co-delegated
    type II entity (i.e., within the executive agencies' budget lines)?
  answer: Transfer responsibilities do not change compared to ABAC.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    16
- question: Given that the budget address in ABAC is more "flexible" than in SUMMA due to local extension,
    do you envisage to already standardise the budget lines in ABAC to allow for transparent migration
    from ABAC to SUMMA?
  answer: No, this is not yet planned.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    17
- question: Should funds be re-allocated if budget line is used by more units, when the flexibility clause
    in the financing decisions is used?
  answer: Yes, this is the impact.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    18
- question: Could you provide more information on fund centres broken down by operational unit?
  answer: The breakdown of fund management centres per operational unit is being discussed in the ad-
    hoc working group on Budget Structure organised by the RUF.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    19
- question: Which are the DGs that do not use the unit concept?
  answer: A BO report providing the use of the unit in the Com L2 Responsible organisation field is available
    in the ABAC DWH.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    20
- question: Will forecasts take place by unit, too?
  answer: 'The bi-annual forecast is available at the level of unit, too. In practical terms, the DGs
    must forecast at the same granularity level they chose their budgeting and posting in SUMMA: DG, Directorate,
    and/or unit.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    21
- question: How and where will the dimensions 'programming period' and 'fund' be encoded and reported?
  answer: DG BUDG has worked on an integrated MFF structure combining different views (legacy programs
    used by accounting, programs including contributions from other programs for performance reporting
    etc.). This alternative MFF view shows the fund and its MFF period in a dedicated field in the budget
    structure (functional area). This alternative view does not affect the number of budget lines as it
    can be derived from the budget line. The functional area is standard SAP field in the budget structure,
    available in other SAP modules as accounting.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    22
- question: Is it necessary for harmonising local references through the encoding of WBS to have the funded
    programme as a budget structure?
  answer: The local reference stored into SUMMA must correspond to a genuine project number in the local
    system to allow linking local and SUMMA data and reducing the need of copying SUMMA data into local
    systems.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    23
- question: How should we manage L2 commitment under L1, when L1 is managed by one unit and L2 by different
    units?
  answer: This problem already exists in the External Aid DGs and is managed through decommitments or
    manual interventions in ABAC. The proposed way forward is to encode estimated amounts by unit and
    modify these amounts once the exact allocations are known. DG BUDG has issued a SUMMA business requirement
    to allow re-allocating amounts within a fund reservation or between funds reservations even from previous
    years.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    24
- question: Have you considered that when the budget structure grows, the number of transfers grows too?
  answer: This situation would only arise if the budget was managed at unit level. DG BUDG proposal is
    to give DGs flexibility to post at unit level while managing the budget at DG level. Therefore, the
    number of transfers will remain unaffected. For the DGs already budgeting at local line level, the
    number of transfers will remain equal compared to ABAC.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    25
- question: Can we eliminate local lines at unit level with the new MFF?
  answer: Local lines are used in many areas of the budget. Programming at unit level was one of the main
    requests. Managing the budget at unit level will be optional in SUMMA. Only posting at unit level
    is foreseen, which is very close to the current way of working in shared management, where the unit
    is encoded at commitment level. Posting the commitment at unit level will eliminate the need of indicating
    the unit in all transactions.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    26
- question: Will SUMMA include the environments/transactions related to the Trust Funds (i.e., ABAC T004,
    T005)?
  answer: Trust Funds will not be migrated to SUMMA, the open transactions should be fully paid by end
    of 2026 in ABAC.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    27
- question: In the case of Global (CL1) commitments, usually, the details of the operational units are
    not known when those commitments are created. Which unit will need to be indicated and how will the
    split in the individual commitments be done?
  answer: The L1 details should contain the best guess for a share. The share can be adjusted even in
    n+1.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    28
- question: Depending on the granularity level chosen, what will be the impact on the Budget Forecast
    I.T tool? And what will be the impact on the hearings details requested?
  answer: The functioning of BPC Forecasting tool remains the same, but its setup has been enhanced as
    to display all the fund centers available for a given DG. Each fund centre must be opened individually,
    and the belonging budget lines forecasted, saved, and published. This guarantees that all budget lines
    are forecasted, and any potential under-forecast avoided. There is no impact on the budget hearings
    process.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    29
- question: In the case of granularity at unit level, can DG BUDG confirm that this level will improve
    the integration in the future MAPP IT Tool? What will be the impact if DIR level or DG level is chosen?
  answer: DG BUDG cannot assess the level of granularity used in MAPP.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    30
- question: Regarding the budgetary commitment, are there any other places/possibilities where the name
    of the operational unit in charge of the commitment/payment can be identified?
  answer: The main goal is to have a centralised field where the organisational information is available.
    Being in the budget structure, all subsequent transactions inherit this information automatically
    without further encoding.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    31
- question: Will the various cascade levels of the budget structure still be visible in SUMMA?
  answer: And will the division of responsibilities be done accordingly? Co-delegations are visible in
    the proposal.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    32
- question: Will priority of fund sources become semi-automatic due to the limited number available (C1-C7)?
  answer: It will be possible to modify the funds source to apply priority rules. Automation was not foreseen
    for the go-live, as this is not a core functionality.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    33
- question: How do we check the validity period of the appropriations (commitments and payments)?
  answer: The budget period master data contain start and end dates for the use of appropriations.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    34
- question: When defining the fund centre, how will the structure be defined? Will it be according to
    COMREF? Is there a special treatment for the special units that are not allocated to a given Directorate
    and are directly dependant from the Director General or DDG?
  answer: The Fund Centre will synchronise with Sysper (=COMREF) data.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    35
- question: How will the transfer of projects be managed in SUMMA?
  answer: SUMMA will reassign open commitment amounts to another budget address.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    36
- question: How should we correct the budget structure in a Purchase Order or in a payment when realising
    that the budget line selected is incorrect?
  answer: A regularisation payment should be performed if the payment is already validated.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    37
- question: Can transfer of funds between different fund centres be managed by the DG?
  answer: Transfers between units can be performed within the DG, in analogy to current transfers on local
    lines.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    38
- question: Why will there be no possibility to differentiate between commitment and payment appropriations
    in SUMMA?
  answer: There is always a possibility to differentiate commitment and payment appropriations. Both appropriations
    are stored in different ledgers. For Non-Differentiated budget addresses, both appropriations are
    always equal. For Differentiated budget addresses, commitment and payment appropriations may differ.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    39
- question: If the funded programme is included in the budget line structure, this will result in managing
    many budget lines per funded programmes. Do we consider funded programme the whole IPA III fund 2021-2027?
  answer: 'The dimension allows the DG decentralised to define more detail for the budget line. Each DG
    can freely choose whether to use Funded Programme or not. In case they do not want to add more detail,
    the default value EMPTY will be used for all their Budget Structure Elements. The advantage of defining
    values can be: To have budget control on a more detailed level Provide reporting information, e.g.
    by yearly work programme'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    40
- question: There is a new functionality of funds reservation (L1 commitment) in SUMMA allowing a modification
    of amounts allocated. What does the joint thematic call NEAR-INTPA require for processing L1 commitment
    in INTPA and then sharing the funds with NEAR? Does it cover only NDICI or IPA III as well?
  answer: The re-allocation facility on funds reservations will be available for the entire Commission
    and all programmes.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    41
- question: Will the terms "Funded Programme" and "Work Breakdown Structure (WBS)" have the same or a
    similar relationship as ABAC "Level 1 Commitments" and "Level 2 Commitments" from an operational viewpoint?
  answer: In ABAC Terms, the equivalent to Funded Programme would rather be the local position, for WBS
    the posting criteria – however, both elements differ in many ways from the functionalities of the
    former ABAC fields. A WBS actually derives the funded programme in an expenditure document, the Funded
    Programme cannot be selected by its own. The Equivalent of a Level 1 Commitment would be the Funds
    Reservation, for a Level 2 Commitment the Purchase Order.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    42
- question: Could you foresee the introduction of posting criteria related to specific crisis situations,
    such as in Ukraine and Syria, without going through a heavy technical/procedural update process, allowing
    the trace of funds to address these crisis situations?
  answer: In SUMMA, tracking country-specific expenditure is possible via the Tagging Mechanism (the ‘ASSOCNTRY’
    tag). The same functionality is used for tracking expenditure related to Ukraine via the ‘BUD_UA_EXP’
    tag. The Tagging Mechanism does not require a full workload and it is easy to set up in the SUMMA
    core system. However, it should only be used when standard SUMMA fields are not available for reporting
    purposes. More information about the mechanism is available on the SUMMA master data page, where instructions
    on the use of the ‘BUD_UA_EXP’ tag are provided. Instructions for using the ‘ASSONTRY’ tag will be
    published soon.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    43
- question: In the case of joint thematic calls, could DG BUDG technically foresee a smooth change of
    the lead role of DGs specific cases in the future for which another DG might be asked to take the
    lead?
  answer: If a DG is to take the lead in a call, the Funds Reservation should be encoded by that DG. If
    this cannot be done, a re-allocation requires decommitting and re-committing the funds and transferring
    funds to another DG.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    44
- question: Does budget inscription need Authorising Officer Sub-Delegated validation?
  answer: There is no Authorising Officer Sub-delegated validation currently for budget inscription and
    it will remain the same for SUMMA.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    45
- question: Which workflow is to be used for credits transfers (CODEL II/III, internal adjustments)?
  answer: 'Two step workflow (Initiating Agent + Authorising Officer) for: adjustments between budget
    line extensions (in ABAC terms: ‘between central extensions of the budget position’) rebalancing adjustments
    between type1 co-delegations autonomous transfers adjustments and transfers managed by executive agencies
    and external entities No workflow (i.e., only 1 agent) for: adjustments within budget line extensions
    (in ABAC terms: ‘within central extensions of the budget position’) adjustments within the same post,
    to/between sub-items of the Office’s budget line adjustments from/to types 2 and 3 co-delegations,
    Fund Center at Directorate or unit level, Funded Program chargeback adjustments'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    46
- question: Do you foresee a specific user group to address budgetary issues, such as CODEL? And if yes,
    when should it be expected?
  answer: No specific user group is foreseen for co-delegations. If it should be created, please share
    with us the topics to be discussed via BUDG-SUMMA@ec.europa.eu
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    47
- question: Given that the "Budget period" is the year of origin of the funds, could you please confirm
    that in the case of open transactions from 2012 to 2021 under
  answer: '10.029901-C8 we will face the following situation? Yes, transactions will be grouped by funds
    source and budget period.


    For open commitments, the budget period will also be pertained in the budget address.


    For data migration from ABAC to SUMMA, please consult question 61.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    48
- question: How C4 and C5 will be managed in SUMMA?
  answer: For appropriations, the budget period will show which appropriations from the previous years(s)
    are still available in the current financial year. This principle will also apply to assigned revenue.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    49
- question: In the internal rules, co-delegations are defined at DG level. What will be the consequences
    on the co-delegation definition if a DG decides to have a granularity at unit level?
  answer: 'The implementing unit will be shown in the Fund Centre followed by the DG (without unit) having
    given the funds: Ex: ESTAT>HOME will becomeHOME.E.5<ESTAT.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    50
- question: Will the operational unit be available at transactional level in SUMMA?
  answer: DG BUDG aims at harmonising the information in the system. The organisational information will
    be managed in the hierarchy of funds centres for budget management.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    51
- question: In the context of shared management, Member States can ask transfers of funds between different
    Funds and thus DGs have access to budget lines of other DGs. If we cannot have a mixed approach in
    the same DG (a budget line at DG level and another budget line at unit level) when we chose the granularity,
    what happens in the "transfer line" if a DG decides unit level and another DG prefers DG level?
  answer: When managing budget lines from other DGs, co-delegation applies. If the implementing DG has
    chosen unit level, the funds will be allocated at unit level.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    52
- question: What are the consequences on the reports Authorising Officer Sub-delegated and Annual Activity
    Report, if we do not go at the level of the unit?
  answer: The Annual Activity Report will remain at DG level. If the DG choses unit level for implementation,
    further information and indicators (e.g., financial scorecard) will become available for assessment
    within the DG and could provide automated Authorising Officer Sub- delegated reports.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    53
- question: Will the concept of "Fund Reservation" work in the same way as our current L1 commitments?
  answer: Funds Reservations broadly work like L1 commitments.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    54
- question: What is it going to happen to the existing L1 of a DG? How will they be converted into Fund
    Reservation transactions?
  answer: L1 commitments will be migrated to Funds Reservations in SUMMA.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    55
- question: Would it be possible in SUMMA to partially de-commit a Fund Reservation made in year N, in
    the year N+1 and re-commit this amount in a new Fund Reservation?
  answer: 'For L1 re-allocation we have noted the following requirements:


    i. Modifying a funds reservation in n+1 is allowed


    ii. In addition, we will assess the feasibility for:


    Re-allocation between funds reservations. Transfer from N to N+1 appropriations to re-commit for a
    funds reservation in another DG.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    56
- question: What is the format of Account Assignment?
  answer: 'Account Assignment is a set of 6 independent dimensions, which constitute a budgeting address
    (can hold appropriations) or posting address (can hold consumption): Funds Source, Budget Period,
    Funds Management Center, Commitment Item, Functional Area, Funded Program. Each of the 6 dimensions
    is encoded seperately in SUMMA, e.g. when posting transcations or querying information on available
    appropriations. For reporting purposes, it may be represented as a single ID composed of these fields
    in that specific order and separated by:


    ''/'' if there is no such character in any of the attributes ''|'' if there is the character ''/''
    in some of the attributes


    Examples of valid text representations of Account Assignments:


    VOBU/2022/INTPA.C.C2/E.14.020120/NDICI_21_27/INTPA


    EARN/N|2022|INTPA|E.14029902.03|DCI_14_20|EMPTY


    EARN/N|2022|INTPA|E.14029902.03|DCI_14_20|EMPTY'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    58
- question: What Funds priority rules of consumption should be used in SUMMA?
  answer: 'This document summarises the order of priority of Funds (ex. ABAC Fund Sources) and Budget
    Periods in which the commitment and payment appropriations should be consumed in SUMMA.


    As the corporate and local systems that are integrated with SUMMA will implement major bulk of the
    budget, it is very important that they also comply with these priority rules.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    59
- question: Will there be a flexibility in SUMMA to keep the credits/appropriations at one budget address
    and consume them from another budget address?
  answer: 'Yes, in SUMMA, each budget address (N.B. can be applied independently for commitments and payments)
    can be defined separately as budgeting (can hold appropriations, i.e. ABAC credit lines), posting
    (can be used for making commitments and payments, i.e. ABAC consumption lines), or both. For cases
    where the posting address is not a budgeting address itself, SUMMA will consider the budget structure
    and find the related budgeting address by looking upwards in the following sequence:


    More detailed explanation in the link from the posting to budgeting address document.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    60
- question: For the data migration and the systems integration, what is the detailed technical mapping
    between the ABAC Fund Source and SUMMA Fund and Budget Period?
  answer: 'Please consult the detailed technical mapping (last update on 18.09.2025) between the ABAC
    Fund Source and SUMMA Fund and Budget Period (N.B. ABAC Fund Source is split in SUMMA into Fund and
    Budget Period). The file contains 4 tabs covering:


    CORA – carry-over of residual appropriations (not used) 1. Funded Program (if any, parent is always
    ''EMPTY'' e.g. From FR to ''EMPTY'') 2. Fund Centre (e.g. From AGRI.A1 to AGRI.A to AGRI) 3. Commitment
    Item (e.g. From E.01010501.01 to E.01010501) COCA expenditure – carried-forward corresponding (already
    used) appropriations COCA revenue – carried-forward corresponding (already used) appropriations RIB
    – revenue increasing budget


    The file also contains in the last 2 tabs a detail on the automatic carry-overs for NDICI, IPA III,
    NSCI, OCT and other instruments, which affect CORA and COCA expenditure.'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    61
- question: When do the appropriations expire?
  answer: While the general rule is that appropriations are valid for 1 year, there are a number of exceptions
    where the appropriations are valid for consumption for a shorter or longer period. Please see the
    table for the validity of appropriations. The date of expiration of appropriations is a function of
    Fund, Budget Period, DA/NDA indicator, Staff/Non-Staff on NDA, and Commitment Item Policy. Once the
    appropriations are expired, DG BUDG will remove them from the E.* addresses with the budgetary document
    TREX.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Budget structure', question
    62
- question: How should I proceed to clear the migrated pre-finance documents?
  answer: Please refer to the following link for the user guidance on clearing migrated pre-finance documents.
    If you encounter any issues during the process, the EC SUMMA Helpdesk team is available to assist
    you.
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Accounting', question 1
- question: How can I monitor the consumption, including workflow amounts, in SUMMA?
  answer: 'Consumption (FR, PO, PAY) The budget consumption is calculated in SUMMA Data Warehouse (DWH)
    and offers two perspectives of open amount:


    Cost accepted view looking at PO consumption by posted invoices; Payments made view looking at PO
    consumed by approved payment directives.


    There is no possibility as such in SUMMA (S4) nor in SUMMA DWH to differentiate the consumed amount
    from the amount still in the workflow.


    SUMMA Workflow As you may be aware, SUMMA (S4) workflow has been fully customised as the standard
    SUMMA (S4) features only allow differentiation between “parked" and “posted" documents. The VISA workflow
    has been developed only for certain financial documents where such necessity is imposed by the Financial
    Regulation.


    Considering all above-mentioned aspects, all transactions open/still in the VISA workflow chain are
    presented as such in our SUMMA DWH reporting products, including:


    SUMMA 360° dashboard that present both, open and closed transactions; SUMMA Open Transactions dashboard
    (planned release in the coming days), which will provide an overview of all transactions in VISA workflow
    with their open amounts (as explained above).'
  sources:
  - SUMMA questions and answers (BUDGpedia FAQ page, 03/09/2026), section 'Reporting', question 1
