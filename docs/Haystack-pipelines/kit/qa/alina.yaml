# ALINA reference Q&A: the 34 exemplar questions and answers written by DIGIT.R3
# procurement experts ("ALINA - Exemplar questions and answers"), extracted from the
# consult_reference_qa tool of ../../v1-agent-9k.yaml. Guidance for the agent, never cited.
entries:
- question: Can a framework contract run for longer than four years?
  answer: 'Yes, but only exceptionally and on justification linked to the subject matter.

    The duration of a framework contract shall not exceed four years, save in exceptional cases duly justified
    in particular by the subject matter of the framework contract (Point 1.1 of Annex I to the Financial
    Regulation).

    The justification must be grounded in the nature of the purchase, not in administrative convenience.
    The Vademecum gives the example of a framework contract for the maintenance of a machine with a ten-year
    expected life, which may be set to run for ten years because that is what the required service demands
    (Vademecum, section 2.7.1).

    Duration and value are separate limits. The value of the framework contract over its total duration
    must be estimated, and a maximum total amount in euro (the ceiling) must be indicated in the award
    decision, the award notice and the framework contract itself. The framework contract can be consumed
    up to that ceiling (Vademecum, section 2.7.1).

    For framework contracts, the value to be taken into account is the maximum value of all the contracts
    envisaged during the total duration of the framework contract, including any form of options and any
    renewal (Points 35.1 and 35.2 of Annex I FR).

    A longer duration therefore does not relax the ceiling: a ten-year framework contract must still be
    estimated and capped for its full ten years.'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Annex I, Points 1.1, 35.1, 35.2
  - Vademecum on Public Procurement (BUDG, June 2025), section 2.7.1
  - Circular on framework contracts (BUDG 2019.03), points II.6 and II.9
- question: A tenderer has submitted a price far below the others. How should we handle it?
  answer: 'The assessment is made in two stages, and the obligations differ at each.

    First stage: identification

    The contracting authority must determine whether the tenders contain evidence such as to raise suspicion
    that they might be abnormally low. It need not request written details from the tenderer or analyse
    each tender in detail at this stage. In the absence of a definition in EU law, the contracting authority
    determines the method, provided it is objective and non-discriminatory (Explanatory note on abnormally
    low tenders, BUDG, October 2023, section 2.1).

    Indications include doubts as to compliance with the law of the place of performance on staff remuneration,
    social security contributions, occupational safety and health or selling at a loss; doubts that the
    price covers all costs generated by the technical aspects of the tender; a price considerably below
    the other tenders or the normal market price; or a considerable difference from the estimated value
    of the procurement (same section).

    Second stage:  investigation

    Where such indications exist, the contracting authority must request in writing details of the constituent
    elements of the price or costs it considers relevant and give the tenderer the opportunity to present
    observations (Point 23.1 of Annex I FR). It may take into account observations on the economics of
    the process, the technical solutions chosen or exceptionally favourable conditions, the originality
    of the tender, compliance by the tenderer and its subcontractors with environmental, social and labour
    law obligations, and the possibility of State aid.

    Rejection

    The contracting authority shall reject the tender only where the evidence supplied does not satisfactorily
    account for the low price or costs. It shall reject the tender where it has established that the tender
    is abnormally low because it does not comply with applicable environmental, social and labour law
    obligations (Point 23.2 of Annex I FR).

    Where the low price results from State aid, rejection on that sole ground is possible only if the
    tenderer cannot prove, within a sufficient time limit, that the aid was compatible with the internal
    market within the meaning of Article 107 TFEU (Point 23.3 of Annex I FR).

    Challenge by an unsuccessful tenderer

    Where an unsuccessful tenderer raises doubts in a substantiated manner as to the abnormally low nature
    of the successful tender, the contracting authority is required to enter the second stage of assessment.
    In practice this arises during the standstill period, and the authorising officer must suspend contract
    signature, reopen the evaluation and conduct the second-stage assessment (BUDG note, October 2023,
    section 2.1, citing Case C-101/22 P Commission v Sopra Steria Benelux and Unisys Belgium).

    The contracting authority must be able to state reasons both where it concludes that a tender does
    not appear abnormally low and where, after investigation, it concludes that it is or is not abnormally
    low (BUDG note, October 2023, summary and section 3.1).'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Annex I, Points 23.1, 23.2, 23.3 and 36.1
  - Explanatory note on abnormally low tenders (BUDG, October 2023), sections 2.1, 2.2 and 3.1
  - Vademecum on Public Procurement (BUDG, June 2025), section 4.7.5.1
- question: Does a standstill period apply before we sign a specific contract under a framework contract?
  answer: 'No. Specific contracts based on a framework contract are expressly excluded from the standstill
    period.

    The standstill period does not apply where only one tender has been submitted; to specific contracts
    based on a framework contract; to dynamic purchasing systems; or to the negotiated procedure without
    prior publication, except for contracts awarded under Point 11.1, second subparagraph, point (b) (Point
    36.2 of Annex I FR).

    Where it does apply, the standstill period is 10 days when using electronic means of communication
    and 15 days when using other means (Article 178(3) FR), and it runs from the day after the simultaneous
    dispatch of the notifications to successful and unsuccessful tenderers by electronic means (Point
    36.1 of Annex I FR).

    The exclusion concerns the standstill period only. For the award of specific contracts under a framework
    contract with reopening of competition, the contracting authority must still inform the tenderers
    of the result of the evaluation (Article 173(2), second subparagraph, FR).

    The contracting authority may in any event suspend signature for additional examination where justified
    by requests or comments from unsuccessful or aggrieved candidates or tenderers, informing all candidates
    or tenderers within three working days of the suspension decision (Point 36.1 of Annex I FR).'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Annex I, Points 36.1 and 36.2
  - Regulation (EU, Euratom) 2024/2509, Articles 173(2) and 178(2)–(3)
- question: A tenderer tells the contracting authority, after the submission deadline, that one of its
    subcontractors has been taken over and must be replaced. Can this change be accepted?
  answer: 'Yes, provided five conditions are met. The rule applies at any stage between the deadline for
    submission and signature of the contract, whatever the type of procedure. It would be disproportionate
    to reject a tenderer on the basis of a change in subcontracting where that change has no impact on
    the capacity to execute the contract and on the tender (Circular on subcontracting and joint tenders,
    BUDG 2023.09, section on change in subcontracting before the contract is signed).

    The following conditions must be verified:

    1. The new subcontractor is not in an exclusion situation, verified by a declaration of non-exclusion
    if this was required in the original procurement documents, and by supporting evidence in case of
    doubt.

    2. The tenderer still fulfils the selection criteria with the new subcontractor, compared with the
    tender originally submitted, and the new subcontractor fulfils the selection criteria applicable to
    it.

    3. The new subcontractor has access to procurement, provided this option was applied to subcontractors
    in the tender specifications.

    4. The new subcontractor is not subject to restrictive measures.

    5. The change does not entail a substantial change in the tender. This is satisfied where all tasks
    of the former subcontractor are taken over by another entity involved, the change does not make the
    tender non-compliant with the tender specifications, and it does not modify the evaluation of the
    award criteria of the tender as originally submitted.

    The tender must always be evaluated as it was submitted, and the effect of the change analysed against
    it. If all conditions are met the change can be accepted; if one is not met, the tender must be rejected.

    The DG BUDG model contracts make any change in subcontracting subject to prior approval by the contracting
    authority. The assessment covers the advantage for the contracting authority, whether selection criteria
    are still fulfilled (they apply throughout execution, subject to proportionality where the contract
    is well advanced), whether the change distorts competition, the exclusion situation of the new subcontractor,
    access to procurement, and restrictive measures. There is no obligation to accept a change during
    execution, except where refusal would be in bad faith or abusive under the law applicable to the contract
    (Circular BUDG 2023.09, section on change in subcontracting after the contract has been signed).'
  sources:
  - Circular on subcontracting and joint tenders (BUDG 2023.09), sections on change in subcontracting
    before and after signature
  - Regulation (EU, Euratom) 2024/2509, Article 138(1) (exclusion) and Annex I, Point 18
- question: A consulting company helped draft the technical specifications and now wants to tender. Is
    this a conflict of interest?
  answer: 'The Vademecum distinguishes four situations, and the term ''conflict of interests'' applies
    only to the contracting authority, not to economic operators (Vademecum, section 1.6).

    Conflict of interests for the contracting authority — where the impartial and objective exercise of
    the function of a member of staff is compromised for reasons involving family, emotional life, political
    or national affinity, economic interest or any other direct or indirect personal interest (Article
    61 FR). This covers both actual conflicts and the appearance of a conflict; the person must inform
    their management in writing, which decides on appropriate action. It applies to the staff and authorising
    officer in charge of the procedure and to those involved in the opening and evaluation phases.

    Grave professional misconduct by an economic operator — attempting to unduly influence decision-making,
    entering into agreements with other operators to distort competition, or seeking confidential information
    conferring undue advantage. These are exclusion grounds under Article 138(1)(c) FR.

    Prior involvement in preparing the procurement documents — the situation described in the question.
    The authorising officer shall reject a participant who was previously involved in the preparation
    of documents used in the award procedure where this entails a breach of the principle of equality
    of treatment, including distortion of competition, that cannot be remedied otherwise (Article 143(1)(c)
    FR).

    Professional conflicting interests — previous or ongoing professional activities of an economic operator
    that affect or risk affecting its capacity to perform a contract in an independent, impartial and
    objective manner (Article 2(56) FR). This is assessed at selection stage under technical and professional
    capacity, on the basis of a declaration of professional conflicting interests (Points 20.1 and 20.6
    of Annex I FR; Article 143(1)(d) FR).

    In the case described, Article 143(1)(c) FR is the operative provision. Rejection is not automatic:
    it is for the contracting authority to prove the distortion of competition and to prove that it has
    taken all possible measures to avoid rejection. The procedure is contradictory — the tenderer must
    be given the opportunity to prove that its prior involvement cannot distort competition, and the relevant
    information exchanged in the context of its involvement must be communicated to the other participants
    (Article 143(1), second subparagraph, FR; Vademecum, section 1.6).

    The Vademecum recommends avoiding rejection by preparing remedial measures from the outset: giving
    other operators the same information provided to the technical assistance contractor, and setting
    a time limit for receipt of tenders well above the legal minimum, since a short time limit would give
    the prior contractor an undue advantage.'
  sources:
  - Vademecum on Public Procurement (BUDG, June 2025), sections 1.6 and 4.7.5.4
  - Regulation (EU, Euratom) 2024/2509, Articles 2(56), 61, 138(1)(c), 143(1)(c) and (d)
  - Regulation (EU, Euratom) 2024/2509, Annex I, Points 20.1 and 20.6
- question: A tenderer has submitted a question four working days before the deadline. Are we obliged
    to answer, and must we extend the deadline?
  answer: 'There is no obligation to reply, but if you do reply, the consequences depend on the content
    of the answer.

    The contracting authority is not bound to reply to requests for additional information made less than
    six working days before the deadline for receipt of tenders (Point 25.2, second subparagraph, of Annex
    I FR; Vademecum, section 4.5.1).

    The time limit must be extended where additional information was not provided at the latest six days
    before the deadline although the economic operator requested it in good time, or where significant
    changes are made to the procurement documents (Point 25.3 of Annex I FR).

    A reply may still be provided if considered necessary. Where the reply provides additional information
    not previously available, or results in significant changes to the procurement documents, the deadline
    must be extended. Where the reply is limited to minor information merely clarifying existing information,
    the contracting authority may exercise its discretion not to extend; the Vademecum advises exercising
    this option with caution and extending in case of doubt (Vademecum, section 4.5.1).

    Where the reduced time limits for urgent cases have been applied under Point 26 of Annex I FR, additional
    information must be provided no later than four days before the deadline. For a reopening of competition
    under a framework contract, the Vademecum recommends setting the questions and answers deadline at
    four days before the deadline for receipt of specific tenders, except where the submission period
    is shorter than 15 days (Vademecum, section 4.5.1).

    Contacts must always take place in writing, and all records must be kept in the procurement file.
    Additional information provided at the request of an economic operator and any information provided
    on the contracting authority''s own initiative must be made available simultaneously to all operators
    by the same means as the procurement documents. Before answering, the question must be edited to exclude
    personal or commercially sensitive data and any reference that could disclose the identity of the
    operator asking it (Article 172 FR; Vademecum, section 4.5.1).'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Annex I, Points 25.2, 25.3 and 26
  - Regulation (EU, Euratom) 2024/2509, Article 172
  - Vademecum on Public Procurement (BUDG, June 2025), section 4.5.1
- question: Can a Contracting Authority increase the ceiling of a Framework Contract in year 3 of the
    contract? Under what circumstances?
  answer: 'Yes, but only exceptionally and within the strict limits for modification of a contract during
    its performance.

    For framework contracts, the value to be taken into account is the maximum value of all the contracts
    envisaged during the total duration of the framework contract, including any form of options and any
    renewal (Points 35.1 and 35.2 of Annex I to the Financial Regulation). That maximum total amount in
    euro must be indicated in the award decision, the award notice and the framework contract itself.
    The framework contract can be used only up to that ceiling (Vademecum, section 2.7.1; Circular on
    framework contracts, points II.6 and II.9).

    As a rule, the ceiling is therefore an essential element of the framework contract and cannot be revised
    freely once the contract has been signed. An increase in year 3 is possible only if it can be justified
    as a lawful contract modification under Article 175 FR.

    Under Article 175 FR, a modification without a new procurement procedure is possible only in limited
    situations, in particular where:

    the modification has been clearly, precisely and unequivocally provided for in the initial procurement
    documents by review clauses or options, including as regards possible adjustments of value, and provided
    that the overall nature of the contract is not altered;

    additional works, supplies or services by the original contractor have become necessary and a change
    of contractor cannot be made for technical reasons linked to interchangeability or interoperability,
    or would cause substantial duplication of costs or substantial inconvenience;

    the need for modification has been brought about by circumstances which a diligent contracting authority
    could not foresee, provided that the modification does not alter the overall nature of the contract;

    the value of the modification remains below the thresholds laid down in Article 175 FR for low-value
    amendments and the modification does not affect the subject matter of the contract.

    Even in those cases, the modification must not alter the overall nature of the framework contract.
    A significant upward revision of the ceiling will often be problematic because the ceiling is directly
    linked to the volume of competition originally advertised. If the increased value would have been
    liable to attract other tenderers or to affect the outcome of the procedure, the amendment is likely
    to be regarded as substantial and a new procurement procedure should be launched instead.

    The fact that the ceiling is nearly exhausted in year 3, or that the contracting authority underestimated
    its needs, is not in itself sufficient. The original estimate had to cover the maximum value of all
    contracts envisaged for the total duration of the framework contract. Administrative convenience or
    poor planning cannot by themselves justify an increase.

    Accordingly, the ceiling of a framework contract may be increased in year 3 only on an exceptional
    basis, where one of the grounds in Article 175 FR is genuinely met, the modification does not change
    the overall nature of the framework contract, and the increase does not amount to a substantial alteration
    of the conditions of competition set by the original procurement.'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Article 175
  - Regulation (EU, Euratom) 2024/2509, Annex I, Points 35.1 and 35.2
  - Vademecum on Public Procurement (BUDG, June 2025), section 2.7.1
  - Circular on framework contracts (BUDG 2019.03), points II.6 and II.9
- question: At the end of a Tender, after receiving a notification of rejection due to not meeting minimum
    requirements, a tenderer requests the Contracting Authority to share the name of the winning tenderer
    as well as its advantages. Should the Contracting Authority reply to this request?
  answer: 'No. A tenderer rejected because its tender did not meet the minimum requirements is not entitled
    to receive the name of the successful tenderer or the characteristics and relative advantages of the
    successful tender.

    The Financial Regulation distinguishes between the information to be given in the rejection notification
    and the additional information that may be requested afterwards. A tenderer whose tender is rejected
    for non-compliance must be informed of the reasons why its tender was not accepted. That satisfies
    the duty to state reasons in relation to its own rejection (Article 170 FR; Article 173 FR).

    By contrast, the right to request the name of the successful tenderer, the characteristics and relative
    advantages of the successful tender, and the contract value is reserved to tenderers who made an admissible
    tender. A tender that fails to meet the minimum requirements is not admissible for that purpose, because
    it does not comply with the procurement documents and cannot validly proceed to award comparison (Article
    170 FR; Vademecum, section 4.11).

    The contracting authority should therefore reply to the request, but to explain that the tenderer
    is not entitled to that additional award information because its tender was rejected as non-compliant
    with the minimum requirements. It should not disclose the name of the successful tenderer or its advantages
    on the basis of such a request.

    This is without prejudice to the general obligation to draft the rejection letter properly and to
    state sufficiently the reasons for non-compliance. It is also without prejudice to publication obligations
    applicable to the contract award notice, through which certain information may become public in due
    course.'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Articles 170 and 173
  - Vademecum on Public Procurement (BUDG, June 2025), section 4.11
- question: Can an Authorising Officer decide not to appoint an evaluation committee?
  answer: 'The authorising officer may decide not to appoint an evaluation committee only in the cases
    expressly provided for in the Financial Regulation.

    As a rule, requests to participate and tenders must be evaluated by an evaluation committee appointed
    by the responsible authorising officer, and that committee must be made up of at least three persons
    (Article 153(2), first and second sentences, FR).

    By way of exception, Article 171(5), points (a) to (e), FR allows the authorising officer to waive
    the appointment of an evaluation committee in the following cases:

    where the value of the contract is below the thresholds referred to in Article 178(1) FR;

    on the basis of a risk analysis, for the cases referred to in point 11.1, second subparagraph, points
    (c), (e), (f)(i), (f)(iii), (h) and (m), of Annex I FR;

    on the basis of a risk analysis, when reopening competition within a framework contract;

    for procedures in the field of external actions having a value of less than or equal to EUR 20 000;

    on the basis of a risk analysis, for specific procurements under a dynamic purchasing system.

    Outside those cases, the rule remains that an evaluation committee must be appointed.

    Even where the appointment of an evaluation committee is waived, the evaluation must still comply
    with the applicable procurement rules, including equal treatment and absence of conflicts of interest,
    and must be properly documented.'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Article 153(2)
  - Regulation (EU, Euratom) 2024/2509, Article 171(5), points (a) to (e)
  - Vademecum on Public Procurement (BUDG, June 2025), section 4.7
- question: Can a Contracting Authority cancel a Procurement Procedure while the same is ongoing? Would
    economic operators that have submitted their tenders be entitled to any compensation?
  answer: 'Yes. The contracting authority may cancel or abandon a procurement procedure while it is ongoing,
    provided this is done before the contract is signed (Article 174(1) FR).

    Article 174(1) FR provides that, before the contract is signed, the contracting authority may abandon
    the procurement procedure or cancel the award procedure. The decision must be justified and brought
    to the attention of the candidates or tenderers as soon as possible (Article 174(1) FR).

    Economic operators that have submitted requests to participate or tenders are not entitled to compensation
    merely because the procedure is cancelled or abandoned. Article 174(2) FR expressly states that the
    contracting authority shall not be liable for any compensation with respect to candidates or tenderers
    whose requests to participate or tenders have not been accepted, including where it decides not to
    award the contract (Article 174(2) FR).

    Accordingly, a contracting authority may cancel an ongoing procedure, but it must adopt a justified
    decision and inform the candidates or tenderers without delay. The economic operators concerned do
    not acquire a right to compensation solely because they participated in the procedure (Article 174(1)
    and (2) FR).

    This is without prejudice to any available remedies if an operator considers that the decision infringes
    the applicable procurement rules.'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Article 174(1) and (2)
  - Vademecum on Public Procurement (BUDG, June 2025), section 4.10
- question: Is it possible to add a Contracting Authority to a Procurement Procedure after it has been
    launched?
  answer: 'Yes, but only exceptionally.

    As a rule, the contracting authorities covered by the procedure must be identified from the outset
    in the procurement documents, in line with the principles of transparency and equal treatment (Article
    160(1) FR).

    However, Article 168 FR provides a specific exception: in a situation of extreme urgency resulting
    from a crisis, new contracting authorities may be added by the contracting authority after the launch
    of the procurement procedure and before contract signature, subject to the conditions set out in Article
    163(6) FR and provided that the modification does not alter the subject matter of the contract or
    the framework contract (Article 168 FR).

    This means that adding a new contracting authority after launch is not generally allowed, but may
    be done where all of the following conditions are met (Article 168 FR):

    there is a situation of extreme urgency resulting from a crisis;

    the addition takes place after launch but before signature of the contract;

    the conditions in Article 163(6) FR are fulfilled; and

    the modification does not alter the subject matter of the contract or framework contract.

    Outside that specific case, a new contracting authority cannot be added once the procedure has been
    launched (Article 168 FR).'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Article 168
  - Regulation (EU, Euratom) 2024/2509, Article 163(6)
- question: A European citizen has requested information linked to the award of a Tender. She has particular
    interest in the financial discounts offered by the awarded tenderer. Can we share this information?
  answer: 'Not automatically. Information on the financial discounts offered by the successful tenderer
    is in principle commercially sensitive and may be refused if disclosure would undermine the protection
    of commercial interests.

    Access by a member of the public to documents relating to a procurement procedure is governed by the
    rules on public access to documents, subject to the protection of the interests listed in Regulation
    (EC) No 1049/2001. In particular, access must be refused where disclosure would undermine the protection
    of commercial interests of a natural or legal person, unless there is an overriding public interest
    in disclosure (Article 4(2), first indent, of Regulation (EC) No 1049/2001).

    In procurement matters, detailed price breakdowns, pricing methodology, rebates and financial discounts
    generally form part of the commercially sensitive elements of a tender. Disclosure may reveal the
    successful tenderer’s business strategy and pricing structure and may prejudice its legitimate commercial
    interests or distort competition in future procedures (Vademecum, Section 4.11)

    The contracting authority should therefore assess the request concretely and document by document.
    If the requested information consists of specific discounts or rebate structures contained in the
    successful tender, these elements should normally not be disclosed. Only non-confidential information
    may be released, and partial access should be considered where possible.

    Accordingly, the answer will normally be that the financial discounts offered by the awarded tenderer
    cannot be shared, unless after a specific assessment it is concluded that disclosure would not harm
    commercial interests, or an overriding public interest in disclosure is established.'
  sources:
  - Regulation (EC) No 1049/2001, Article 4(2), first indent
  - Vademecum on Public Procurement (BUDG, June 2025), section 4.11
- question: What are the remedial measures?
  answer: 'A tenderer in an exclusion situation may present remedial measures to demonstrate its reliability
    despite the existence of the relevant exclusion ground.

    Under Article 138(10) FR, the economic operator shall not be excluded where it proves that it has
    taken sufficient remedial measures to demonstrate its reliability (Article 138(10) FR).

    The remedial measures referred to in Article 138(10), points (a) to (c), FR are the following):

    measures to identify the origin of the situations giving rise to exclusion and concrete technical,
    organisational and personnel measures within the relevant business or activity area of the person
    or entity referred to in Article 137(2), appropriate to correct the conduct and prevent its further
    occurrence (Article 138(10), point (a), FR);

    proof that the person or entity referred to in Article 137(2) has undertaken measures to compensate
    or redress the damage or harm caused to the financial interests of the Union by the underlying facts
    giving rise to the exclusion situation (Article 138(10), point (b), FR);

    proof that the person or entity referred to in Article 137(2) has paid or secured the payment of any
    fine imposed by the competent authority or of any taxes or social security contributions referred
    to in paragraph 1, point (b), of this Article (Article 138(10), point (c), FR).

    Those measures must be assessed in the light of the gravity and particular circumstances of the exclusion
    situation. If they are considered sufficient, the tenderer shall not be excluded on that ground. If
    they are considered insufficient, the economic operator must be informed of the reasons.'
  sources:
  - Regulation (EU, Euratom) 2024/2509, Article 138(10), points (a) to (c)
  - Vademecum on Public Procurement (BUDG, June 2025), section 4.6
- question: What are the grounds for exclusion?
  answer: 'Economic operators may be excluded from participating in EU award procedures or from implementing
    Union funds where they are in one of the exclusion situations laid down in the Financial Regulation.
    The rules are intended to protect the Union’s financial interests and to ensure that entities receiving
    or competing for Union funds meet appropriate standards of legality, integrity and professional reliability.
    (Article 138(1) of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    The main grounds are bankruptcy or insolvency; non-compliance with tax or social security obligations;
    grave professional misconduct; fraud, corruption and other serious criminal offences; significant
    deficiencies in the performance of a legal commitment financed by the Union budget; irregularities;
    the creation or use of an entity to circumvent fiscal, social or other legal obligations; and intentional,
    unjustified obstruction of investigations, checks or audits. (Article 138(1)(a)-(i) of the Financial
    Regulation — Regulation (EU, Euratom) 2024/2509)

    Exclusion is not automatic in every factual situation. The authorising officer must apply the principle
    of proportionality, taking account of factors such as the seriousness and duration of the conduct,
    its recurrence and the degree of intent or negligence. In certain cases, sufficient remedial measures
    may demonstrate that the economic operator has restored its reliability. (Article 138(4), (9) and
    (10) of the Financial Regulation — Regulation (EU, Euratom) 2024/250'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 138.
- question: What are selection criteria?
  answer: 'Selection criteria assess whether a candidate or tenderer has the capacity required to perform
    the contract. They concern the economic operator rather than the quality or price of the tender submitted.
    (Article 170(2) of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    They may relate only to three areas: legal and regulatory capacity to pursue the professional activity,
    economic and financial capacity, and technical and professional capacity. The contracting authority
    must state the selection criteria, the minimum levels of capacity and the evidence required to demonstrate
    compliance. Those requirements must be related and proportionate to the subject matter of the contract.
    (Article 170(2) and point 18.2 of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    Examples include registration in an appropriate professional register, minimum turnover or professional
    risk insurance, relevant previous experience, technical resources, or suitably qualified personnel.
    The level requested should reflect what is genuinely necessary for satisfactory contract performance
    and should not unnecessarily restrict competition. (Points 18.3, 19 and 20 of Annex I to the Financial
    Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 170 and Annex I, points 18-20.
- question: What are award criteria?
  answer: 'Award criteria are used to evaluate the tenders that remain under consideration and to identify
    the most economically advantageous tender. They assess the offer itself, not the general capacity
    of the economic operator. (Article 170(3) and (4) of the Financial Regulation — Regulation (EU, Euratom)
    2024/2509)

    The Financial Regulation provides for three award methods: lowest price, lowest cost and best price-quality
    ratio. Lowest cost must use a cost-effectiveness approach, which may include life-cycle costing. Under
    the best price-quality ratio, the contracting authority considers price or cost together with quality
    criteria linked to the subject matter of the contract. (Article 170(4) of the Financial Regulation
    — Regulation (EU, Euratom) 2024/2509)

    Quality criteria may cover matters such as technical merit, functionality, accessibility, environmental
    or social characteristics, innovation, delivery conditions, after-sales service and, where this can
    significantly affect performance, the organisation, qualifications and experience of staff assigned
    to the contract. The criteria and their weighting must be stated in the procurement documents. (Points
    21.1 and 21.2 of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 170 and Annex I, point 21.
- question: What is the difference between selection and award criteria?
  answer: 'Selection criteria assess the candidate or tenderer: they determine whether the economic operator
    has the legal, financial, technical and professional capacity necessary to perform the contract. Award
    criteria assess the tender: they determine which compliant tender represents the most economically
    advantageous offer. (Article 170(2)-(4) of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    This distinction must be reflected in the design and evaluation of the procedure. A requirement concerning
    the general experience or resources of a company will normally belong at selection stage, while a
    criterion concerning the quality of the methodology, solution or team actually proposed for the contract
    may form part of the award assessment. (Article 170(2)-(4) and article 172 of the Financial Regulation
    — Regulation (EU, Euratom) 2024/2509)

    There can be limited overlap in the type of information considered, but not in the purpose of the
    assessment. In particular, the organisation, qualifications and experience of staff assigned to the
    contract may be used as an award criterion where they can significantly affect performance. The same
    element should not, however, be evaluated twice for the same purpose. (Article 172 and point 21.1
    of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 170, recital 172 and Annex I, point
    21.
- question: What are the main procurement principles?
  answer: 'Contracts financed wholly or partly by the Union budget must respect the principles of transparency,
    proportionality, equal treatment and non-discrimination. These principles apply throughout the procurement
    process, from the definition of the need and the drafting of the procurement documents to evaluation
    and contract award. (Article 163(1) of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    Contracts must also be put out to competition on the broadest possible basis, except where the Financial
    Regulation permits the use of a negotiated procedure. The estimated value must not be manipulated
    to circumvent the applicable rules, and a contract must not be artificially split for that purpose.
    Where appropriate, contracts should be divided into lots with due regard to broad competition. (Article
    163(2) of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    The principles also constrain the use of procurement techniques after award. In particular, framework
    contracts may not be used improperly or in a manner whose purpose or effect is to prevent, restrict
    or distort competition. (Article 163(3) of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 163.
- question: What procurement procedures are available?
  answer: 'The Financial Regulation provides a range of procedures for the award of public contracts and
    concession contracts. These include the open procedure, restricted procedure, design contest, negotiated
    procedure, competitive dialogue, competitive procedure with negotiation, innovation partnership and
    procedures involving a call for expressions of interest. (Article 167(1) of the Financial Regulation
    — Regulation (EU, Euratom) 2024/2509)

    The open and restricted procedures may be used for any purchase. Other procedures are available only
    where the conditions laid down in the Financial Regulation and Annex I are met. For example, a competitive
    procedure with negotiation or competitive dialogue may be appropriate in circumstances linked to the
    nature, complexity or specific characteristics of the purchase. (Article 167(5) of the Financial Regulation
    — Regulation (EU, Euratom) 2024/2509)

    A dynamic purchasing system follows the rules of the restricted procedure and remains open throughout
    its duration to economic operators that satisfy the selection criteria. The choice of procedure should
    therefore follow from the value, subject matter, market conditions and legal conditions applicable
    to the particular procurement. (Article 167(6) of the Financial Regulation — Regulation (EU, Euratom)
    2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 167 and Annex I.
- question: When can a negotiated procedure without prior publication be used?
  answer: 'A negotiated procedure without prior publication of a contract notice is an exception to the
    general requirement for competition and may be used only in the cases expressly provided for in Annex
    I to the Financial Regulation. The contracting authority must be able to demonstrate that the relevant
    legal conditions are fulfilled. (Article 167(5)(f) and point 11 of Annex I to the Financial Regulation
    — Regulation (EU, Euratom) 2024/2509)

    Typical situations include an unsuccessful preceding competitive procedure, cases where the contract
    can be performed by only one economic operator for specified technical, artistic or exclusive-right
    reasons, and extreme urgency resulting from unforeseeable events. Annex I also provides additional
    grounds for particular purchases and circumstances. (Point 11.1 of Annex I to the Financial Regulation
    — Regulation (EU, Euratom) 2024/2509)

    The exception should be applied narrowly. In particular, extreme urgency must make the ordinary time
    limits impossible to respect, the purchase must be limited to what is strictly necessary, and the
    circumstances relied upon must not be attributable to the contracting authority. The reasons for using
    the procedure should be documented in the procurement file and award decision. (Point 11.1(c) and
    point 30 of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 167 and Annex I, points 11 and
    30.
- question: Can the contracting authority negotiate?
  answer: 'Yes, but only where the procurement procedure permits negotiation. In procedures involving
    negotiation, the contracting authority may negotiate the initial and subsequent tenders, or parts
    of them, with the aim of improving their content. Final tenders may not be negotiated. (Article 167(4)
    of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    Negotiation is subject to clear limits. The minimum requirements and the criteria specified in the
    procurement documents may not be negotiated. The contracting authority must also ensure equal treatment
    of tenderers and may not provide information in a discriminatory manner that could give particular
    tenderers an advantage. (Article 167(4) and point 6.5 of Annex I to the Financial Regulation — Regulation
    (EU, Euratom) 2024/2509)

    The contracting authority may reserve the possibility of awarding the contract on the basis of the
    initial tender without negotiation, but only where this possibility was indicated in the procurement
    documents. The scope and conduct of negotiations should therefore be planned and documented from the
    outset of the procedure. (Article 167(4) of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 167 and Annex I, point 6.5.
- question: Can the procurement documents be changed?
  answer: 'The contracting authority may provide additional information before the deadline for receipt
    of requests to participate or tenders where it identifies an error or omission in the procurement
    documents or responds to a request from an economic operator. Information provided must be disclosed
    to all candidates or tenderers concerned. (Article 172(1) of the Financial Regulation — Regulation
    (EU, Euratom) 2024/2509)

    A change must remain consistent with transparency and equal treatment. The contracting authority cannot
    use a correction to transform the procedure into a materially different procurement while leaving
    the original competition unchanged. Where the change is significant, economic operators must be given
    sufficient time to understand it and adapt their tenders. (Articles 163(1) and 172(1) of the Financial
    Regulation — Regulation (EU, Euratom) 2024/2509)

    Accordingly, Annex I requires an extension of the deadline where significant changes are made to the
    procurement documents. An extension is also required where additional information requested in good
    time is not provided sufficiently before the deadline. The appropriate length of the extension depends
    on the significance of the information or change. (Point 25.3 of Annex I to the Financial Regulation
    — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Articles 163 and 172 and Annex I, point
    25.
- question: What are technical specifications?
  answer: 'Technical specifications describe the characteristics required of the works, supplies or services
    to be purchased. They translate the contracting authority’s needs into requirements that allow economic
    operators to understand what must be delivered and allow the authority to assess whether the proposed
    solution is compliant. (Article 169(2) and point 17.1 of Annex I to the Financial Regulation — Regulation
    (EU, Euratom) 2024/2509)

    They must allow equal access to the procedure and must not create unjustified obstacles to competition.
    Specifications may be expressed by reference to recognised standards, normally accompanied by the
    words “or equivalent”, in terms of performance or functional requirements, or through a combination
    of both approaches. (Points 17.1 and 17.4 of Annex I to the Financial Regulation — Regulation (EU,
    Euratom) 2024/2509)

    As a rule, specifications should not refer to a particular make, source, trade mark, patent, type
    or origin where this would favour or eliminate particular operators or products. Such references are
    permissible only where justified by the subject matter or where a sufficiently precise description
    is otherwise not possible, and they must be accompanied by “or equivalent”. (Point 17.9 of Annex I
    to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 169 and Annex I, point 17
- question: What is a framework contract?
  answer: 'A framework contract establishes the terms governing a series of specific contracts that may
    be awarded during a defined period. It is therefore a procurement technique for recurring or foreseeable
    needs, rather than an obligation to purchase a fixed quantity unless the framework itself provides
    otherwise. (Point 1 of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    The duration of a framework contract may not normally exceed four years, except in exceptional cases
    duly justified by its subject matter. Specific contracts must be awarded in accordance with the framework
    terms, and the parties may not substantially deviate from those terms when concluding them. The framework
    may be concluded with one or several economic operators. (Points 1.1-1.3 of Annex I to the Financial
    Regulation — Regulation (EU, Euratom) 2024/2509)

    The estimated value of a framework contract is based on the maximum value of all specific contracts
    envisaged over its total duration. Under Directive 2014/24/EU, the Court of Justice has further underlined
    the importance of transparency regarding the estimated and maximum quantity or value of a framework
    agreement. (Point 35.2 of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509;
    judgment of 17 June 2021, Simonsen & Weel, C-23/20, ECLI:EU:C:2021:490'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Annex I, points 1 and 35.
  - Judgment of the Court of Justice of 17 June 2021, Simonsen & Weel, C-23/20, ECLI:EU:C:2021:490
- question: How are specific contracts awarded under a framework contract?
  answer: 'The method depends on the type of framework contract and on the terms established in the original
    procurement documents. Under a framework concluded with a single economic operator, specific contracts
    are awarded within the limits of the terms laid down in the framework. Where duly justified, the contracting
    authority may ask the contractor to supplement its tender without changing the framework’s essential
    terms. (Point 1.2 of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    For a multiple framework contract, specific contracts may be awarded without reopening competition
    where the framework already sets out all the relevant terms and the objective conditions determining
    which contractor will perform the work. Where not all terms are established, competition must be reopened
    among the framework contractors. (Point 1.3 of Annex I to the Financial Regulation — Regulation (EU,
    Euratom) 2024/2509)

    When competition is reopened, the contractors must be consulted in writing and given sufficient time
    to submit specific tenders. The specific contract is awarded to the tenderer submitting the most economically
    advantageous specific tender on the basis of the award criteria established in the procurement documents
    for the framework. A mixed approach is possible where the original procurement documents expressly
    provided for it. (Points 1.3(c) and 1.4 of Annex I to the Financial Regulation — Regulation (EU, Euratom)
    2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Annex I, points 1.2-1.4.
- question: Can an economic operator rely on other entities?
  answer: 'Yes. For a particular contract, an economic operator may rely on the capacities of other entities,
    regardless of the legal nature of the links between them. The operator must, however, demonstrate
    that the resources necessary for performance will actually be available, for example through a commitment
    from the entity concerned. (Point 18.6 of Annex I to the Financial Regulation — Regulation (EU, Euratom)
    2024/2509)

    There are important limits. Where reliance concerns technical and professional capacity, the entity
    relied upon must perform the works or services for which that capacity is required. Where reliance
    concerns economic and financial capacity, the contracting authority may require the operator and the
    supporting entity to be jointly liable for performance of the contract. (Point 18.6 of Annex I to
    the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    The contracting authority must verify that the supporting entity satisfies the relevant selection
    criteria and must require its replacement where it does not. The exclusion rules also apply to entities
    on whose capacity a candidate or tenderer intends to rely. For certain works, services or installation
    operations, the authority may require critical tasks to be performed directly by the tenderer or a
    member of the tendering group. (Article 138(12) and points 18.7 and 18.8 of Annex I to the Financial
    Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 138 and Annex I, points 18.6-18.8.
- question: Can groups of economic operators submit a tender?
  answer: 'Yes. Groups of economic operators may participate in procurement procedures. The contracting
    authority may not require the group to adopt a particular legal form merely in order to submit a tender
    or a request to participate. (Point 18.9 of Annex I to the Financial Regulation — Regulation (EU,
    Euratom) 2024/2509)

    The procurement documents should explain how a group is expected to meet the selection criteria, taking
    account of the rules on reliance on capacities. This means that the capacities of the members may
    be considered together where permitted, but the arrangement must demonstrate that the group as a whole
    meets the applicable requirements and will have the necessary resources available for performance.
    (Points 18.2 and 18.6 of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    After award, the selected group may be required to adopt a particular legal form where that change
    is necessary for proper performance of the contract. The contracting authority may also require certain
    critical tasks in works, services or installation operations to be performed directly by a participant
    in the group. (Points 18.8 and 18.9 of Annex I to the Financial Regulation — Regulation (EU, Euratom)
    2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Annex I, points 18.2, 18.6, 18.8 and 18.9.
- question: Who can participate in EU procurement?
  answer: 'For procurement by Union institutions, participation is open on equal terms to natural and
    legal persons within the scope of the EU Treaties and to natural and legal persons established in
    third countries that have a special procurement agreement with the Union, under the conditions laid
    down in that agreement. International organisations may also participate. (Article 179(1) of the Financial
    Regulation — Regulation (EU, Euratom) 2024/2509)

    Access is therefore not automatically worldwide. Where the WTO Agreement on Government Procurement
    applies, the procedure must also be open to economic operators established in states that are parties
    to that agreement, under the applicable conditions. Special access rules also apply to procurement
    by or exclusively in the interest of Union delegations in third countries. (Articles 179(3) and 180
    of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Articles 179 and 180.
- question: How is the estimated contract value calculated?
  answer: 'The estimated contract value is used to determine the applicable publicity measures and procurement
    procedure. It must be based on the total amount payable, including any options and renewals, and must
    be calculated at the latest when the contracting authority launches the procurement procedure. (Point
    35.1 of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    The calculation must reflect the procurement as a whole. The estimated value may not be determined
    with the purpose of circumventing the applicable rules, and a contract may not be artificially split
    for that purpose. For framework contracts and dynamic purchasing systems, the relevant value is the
    maximum value of all contracts envisaged during their total duration. (Article 163(2) and point 35.2
    of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    Annex I contains additional rules for recurring contracts, services, works and concessions. For recurring
    contracts, for example, the estimate may be based on the total actual value of successive contracts
    of the same type during the preceding period, adjusted where appropriate, or on the total estimated
    value of successive contracts to be awarded during the financial year. (Points 35.3-35.7 of Annex
    I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 163 and Annex I, point 35.
- question: What publicity requirements apply?
  answer: 'For procedures with a value equal to or above the applicable thresholds, the contracting authority
    must normally publish a contract notice in the Official Journal of the European Union to launch the
    procedure and a contract award notice on its results. The principal exception to prior publication
    concerns procedures that are lawfully conducted as negotiated procedures without prior publication.
    (Article 166(1) of the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    Annex I provides the operational details. Notices must contain the information required by the relevant
    standard forms. An award notice for a contract or framework contract at or above the threshold must
    normally be sent to the Publications Office no later than 30 days after signature. Award notices are
    not published for individual specific contracts based on a framework contract. (Points 2.1 and 2.3
    of Annex I to the Financial Regulation — Regulation (EU, Euratom) 2024/2509)

    Below the thresholds, procedures must still be advertised by appropriate means, normally involving
    appropriate ex ante publicity on the internet, subject to the exceptions laid down in Annex I. Contracting
    authorities must also publish specified ex post information, including lists of certain below-threshold
    contracts and specific contracts under framework contracts, according to the timetable and conditions
    set out in Annex I. (Article 166(2) and points 3.1 and 3.3 of Annex I to the Financial Regulation
    — Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 166 and Annex I, points 2-4.
- question: What is a dps?
  answer: 'A DPS or dynamic purchasing system is a completely electronic purchasing process for commonly
    used purchases that remain generally available on the market (Article 167(6) FR; Annex I, point 13.1,
    FR).

    It follows the rules of the restricted procedure and remains open throughout its duration to any economic
    operator that satisfies the selection criteria (Article 167(6) FR; Annex I, point 13.1, FR).

    No limit may be imposed on the number of economic operators admitted to the system, provided they
    meet the selection criteria (Annex I, point 13.2, FR).

    For each specific procurement under the system, the contracting authority invites all admitted candidates
    in the relevant category, if categories have been used, to submit a tender (Annex I, point 13.5, FR).'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 167(6)
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Annex I, points 13.1, 13.2 and 13.5
- question: Can the contracting authority divide a contract into lots?
  answer: 'Yes, and in some cases it should actively consider doing so.

    The Financial Regulation provides that, where appropriate, contracts shall be divided into lots with
    due regard to broad competition (Article 163(2) FR).

    Dividing a contract into lots may make the procurement more accessible to small and medium-sized enterprises
    and may support broader competition. Whether it is appropriate depends on the subject matter, market
    structure and operational needs of the purchase (Article 163(2) FR).

    However, lots must not be used artificially to circumvent the applicable procurement rules or thresholds.
    The estimated value must still be calculated for the procurement as a whole in accordance with the
    Financial Regulation (Article 163(2) FR; Annex I, point 35.1, FR).'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Article 163(2)
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Annex I, point 35.1
- question: What guarantees can be required?
  answer: 'The Financial Regulation allows different types of guarantees where this is justified by the
    risks associated with the procurement or contract. As a general rule, guarantees should be proportionate
    and based on an assessment of the financial or performance risk concerned. (Article 155(1) of the
    Financial Regulation – Regulation (EU, Euratom) 2024/2509)

    Before contract signature, the contracting authority may require a tender guarantee to ensure that
    a tender is not withdrawn. Where required, it must represent between 1% and 2% of the total estimated
    value of the contract. Guarantees submitted by unsuccessful tenderers are released once the contact
    has been signed. (Article 171(2) of the Financial Regulation – Regulation (EU, Euratom) 2024/2509)

    During contract implementation the authorising officer may require a pre-financing guarantee to limit
    the financial risk associated with advance payments, a performance guarantee for substantial contractual
    obligations in works, supplies or complex services, or a retention money guarantee covering the contractual
    liability period. Performance and retention money guarantees may each amount to a maximum of 10% of
    the total contract value, subject to the applicable conditions and proportionality assessment. (Articles
    155, 156 and 176 of the Financial Regulation – Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Articles 155, 156, 171 and 176.
- question: What happens if a tender is submitted late?
  answer: 'A request to participate or a tender that does not comply with the deadline for receipt must
    be rejected without being opened. The contracting authority has no discretion to accept a late submission
    merely because the delay is minor or because the tender would otherwise be admissible. (Article 171(3)(a)
    of the Financial Regulation – Regulation (EU, Euratom) 2024/2509)

    This rule protects equal treatment and legal certainty. All economic operators must be subject to
    the same submission conditions, and accepting a tender after the deadline could give that tenderer
    an advantage unavailable to operators that complied with the timetable. The contracting authority
    must therefore apply the deadline consistently throughout the procedure. (Article 163(1) and 171(3)
    of the Financial Regulation – Regulation (EU, Euratom) 2024/2509)

    The contracting authority must nevertheless set the submission deadline correctly in the first place.
    It must take into account the complexity of the procurement and provide economic operators with an
    adequate period to prepare their tenders. Where significant changes are subsequently made to the procurement
    documents, an extension of the deadline may be required. (Article 171(1) and Annex I, point 25.3 of
    the Financial Regulation – Regulation (EU, Euratom) 2024/2509)'
  sources:
  - Financial Regulation — Regulation (EU, Euratom) 2024/2509, Articles 163 and 171 and Annex I, point
    25.3
