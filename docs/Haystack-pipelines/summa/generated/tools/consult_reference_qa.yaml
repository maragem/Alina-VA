name: consult_reference_qa
description: 'Look up the curated question-and-answer entries written by the SUMMA support team from real
  helpdesk and peer-exchange cases. Call it FIRST for any procedure, concept or troubleshooting question:
  it returns the closest entries with the documents and sections they rely on, which tells you which document
  to search and what a complete answer covers. The entries are guidance, not sources: never quote or cite
  them; always retrieve and cite the actual passages with search_corpus or search_in_file. If it reports
  that no entries are configured, proceed directly to the search tools.'
