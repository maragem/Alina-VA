name: search_corpus
description: 'Search the whole SUMMA documentation corpus with a short, self-contained query. Use for
  any question that does not target one specific document. Returns the most relevant passages, grouped
  by document and ordered by position within each document, each tagged with a reference token for citation
  and with the document''s version and date when known. The corpus covers SUMMA screens and the financial
  processes around them: search before concluding that a question is out of scope.'
parameters:
  type: object
  additionalProperties: false
  properties:
    query:
      type: string
      description: 'A short, self-contained search query: the terms the documentation itself uses (app,
        tile, field and status names as written). Never paste conversation history.'
  required:
  - query
input_mapping:
  query:
  - retrieval_query.query
  - ranker.query
  - ranker_scoring.query
  state_documents:
  - result_formatter.state_documents
output_mapping:
  result_formatter.documents: documents
  result_formatter.result: result
inputs_from_state:
  documents: state_documents
outputs_to_state:
  documents:
    source: documents
outputs_to_string:
  source: result
pipeline:
  components:
    retrieval_query:
      type: haystack.components.converters.output_adapter.OutputAdapter
      init_parameters:
        template: '{{ query.split()[-100:] | join('' '') }}'
        output_type: str
    query_expander:
      type: deepset_cloud_custom_nodes.code.code_component.Code
      init_parameters:
        code: |
          import re
          from haystack import component
          # Synonym groups from the use case's vocabulary: users write "PO", the documents say
          # "Purchase Order". When any member of a group appears in the query as a whole word, the
          # other members are appended, so BM25 and the dense retriever see both forms whatever the
          # model wrote. Deterministic: the prompt asks the model to do the same, but a rule in the
          # prompt is only followed most of the time, and retrieval depends on the words actually sent.
          SYNONYMS = [['PO', 'Purchase Order'], ['VAT', 'TVA', 'tax'], ['BP', 'Business Partner'], ['DEP', 'Digital Europe Programme'], ['down payment', 'downpayment', 'down-payment', 'prefinancing'], ['show', 'display', 'visualize'], ['LAM', 'Local Authorisation Manager']]
          MAX_ADDED_TERMS = 12

          def _present(term, text_lower):
              return re.search(r"(?<![a-z0-9])" + re.escape(term.lower()) + r"(?![a-z0-9])", text_lower) is not None

          def expand(query):
              text = query or ""
              low = text.lower()
              added = []
              for group in SYNONYMS:
                  if any(_present(t, low) for t in group):
                      for t in group:
                          if not _present(t, low) and t not in added:
                              added.append(t)
              added = added[:MAX_ADDED_TERMS]
              return (text + " " + " ".join(added)).strip() if added else text

          @component
          class QueryExpander:
              """Appends the other forms of any vocabulary term found in the query."""
              @component.output_types(query=str)
              def run(self, query: str):
                  return {"query": expand(query)}
    bm25_retriever:
      type: haystack_integrations.components.retrievers.opensearch.bm25_retriever.OpenSearchBM25Retriever
      init_parameters:
        document_store:
          type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
          init_parameters:
            embedding_dim: 1024
            index: pacioli-docling
        top_k: 30
        fuzziness: 0
    query_embedder:
