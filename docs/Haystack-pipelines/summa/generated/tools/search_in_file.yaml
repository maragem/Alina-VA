  type: object
  additionalProperties: false
  properties:
    query:
      type: string
      description: A short, self-contained search query using the terms the document itself would use.
        Never paste conversation history.
    file_ids:
      type: array
      items:
        type: string
      description: file_id values returned by list_corpus_files. Only documents with these ids are searched.
  required:
  - query
  - file_ids
