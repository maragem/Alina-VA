name: search_in_file
description: Search INSIDE one or more specific documents, identified by file_ids obtained from list_corpus_files.
  Use whenever the user asks what a specific document says or describes, and to open the document that
  governs a process when search_corpus has pointed at it but the answer is still incomplete. If this returns
  nothing relevant, tell the user the named document does not contain it; do not silently substitute another
  source. Returns passages tagged with a reference token for citation.
