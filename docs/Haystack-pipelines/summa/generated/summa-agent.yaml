                        "HXrgsU8EfZldmo5MT5QBwFJOmD8hqym7cwos8bzzs2ge2moSc7jl5rX1D8m5au7ivN04gIJRLwFl5O1bgStA02gVcL3NeMkc"
                        "gYvGLX1w+XybHgp6jtLiuyW7/qwcqKtnEfqzpJSoDLUTxGx8h3UcKhnX0h8JXqqURHw2DKfjTt/hegmunjQfRPmmtiBtVQLg"
                        "7VmWMo/QxtEC/xouJvQA//lP/0z61qdsqnVV/DPOhX4OridT029OL8c9M5tysK1cWnsziBzJbQpiaG4olVo4AsGC1oKNXN1x"
                        "mrNx7F69QI0/WqwLlYltBapgv/cVUcHOQnB6sS9Mo1LXEid3Mb3uRkcUr2hyg/Ai6hECp6FRCwevPH0Efkcp86mD2/vSH/mz"
                        "b57+r/9JorG+uSr5mCD/dXzYn0O9R2zcz7ED4aR/0E+e8TPvwtX4IQfaVYRtSXBqy2QqF9Kjec3mruhadwKyo4HIAi0BcdFY"
                        "Urc3jMaJd8hkX16Fl5+YZVqLvSkJRHwiX6lF3YVte5vV/uf/D2Ah9LA="
                    )))).decode("utf-8"))

                    STOPWORDS = {
                        "a", "an", "the", "and", "or", "of", "to", "in", "on", "for", "with", "by",
                        "is", "are", "be", "was", "were", "it", "this", "that", "these", "those",
                        "i", "we", "you", "my", "our", "your", "do", "does", "did", "can", "could",
                        "should", "would", "how", "what", "which", "when", "where", "who", "why",
                        "please", "need", "want", "there", "from", "as", "at", "if", "not", "no",
                        "me", "us", "about", "into", "via", "also", "any",
                    }
                    # Domain words so common they carry no signal (e.g. the system's own name).
                    DOMAIN_STOPWORDS = {'summa', 'system'}
                    TOP_K = 3
                    MAX_ANSWER_CHARS = 6000
                    EMPTY_MESSAGE = (
                        "No reference Q&A entries are configured in this deployment. "
                        "Proceed directly to search_corpus or search_in_file."
                    )
                    NO_MATCH_MESSAGE = (
                        "No reference entry matches this question. That says nothing "
                        "about the corpus: search it with search_corpus."
                    )

                    def _tokens(text):
                        out = []
                        for tok in re.findall(r"[a-z0-9]+", (text or "").lower()):
                            if tok in STOPWORDS or tok in DOMAIN_STOPWORDS or len(tok) < 2:
                                continue
                            # crude stemming: plural / verbal endings
                            for suffix in ("ations", "ation", "ings", "ing", "ies", "ly", "es", "s", "ed"):
                                if tok.endswith(suffix) and len(tok) - len(suffix) >= 4:
                                    tok = tok[: -len(suffix)]
                                    break
                            out.append(tok)
                        return out

                    # Pre-tokenize once at import.
                    _INDEX = []
                    for _e in QA_ENTRIES:
                        q_toks = _tokens(_e["question"])
                        a_toks = _tokens(_e["answer"] + " " + " ".join(_e.get("sources", [])))
                        a_tf = {}
                        for t in a_toks:
                            a_tf[t] = a_tf.get(t, 0) + 1
                        _INDEX.append({"q": set(q_toks), "q_list": q_toks, "a_tf": a_tf, "a_len": max(len(a_toks), 1)})

                    # Document frequency over answers, so generic domain vocabulary weighs less.
                    _DF = {}
                    for _ix in _INDEX:
                        for t in _ix["a_tf"]:
                            _DF[t] = _DF.get(t, 0) + 1
                    _N = len(_INDEX)

                    def _idf(tok):
                        return math.log(1 + _N / (1 + _DF.get(tok, 0)))

                    def _score(query_tokens, ix):
                        if not query_tokens:
                            return 0.0
                        qset = set(query_tokens)
                        # Title match dominates: the entries are keyed by their question.
                        title_hits = sum(_idf(t) for t in qset if t in ix["q"])
                        title_cov = len(qset & ix["q"]) / max(len(ix["q"]), 1)
                        # Body match, tf-idf-ish and length-normalized.
                        body = 0.0
                        for t in qset:
                            tf = ix["a_tf"].get(t, 0)
                            if tf:
                                body += (1 + math.log(tf)) * _idf(t)
                        body /= math.sqrt(ix["a_len"] / 200.0)
                        # Consecutive-bigram bonus on the title.
                        bigram = 0
                        ql = ix["q_list"]
                        for i in range(len(query_tokens) - 1):
                            pair = (query_tokens[i], query_tokens[i + 1])
                            for j in range(len(ql) - 1):
                                if (ql[j], ql[j + 1]) == pair:
                                    bigram += 1
                                    break
                        return 3.0 * title_hits + 4.0 * title_cov + 1.2 * body + 1.5 * bigram

                    @component
                    class ReferenceQALookup:
                        @component.output_types(result=str)
                        def run(self, query: str):
                            if not _INDEX:
                                return {"result": EMPTY_MESSAGE}
                            query_tokens = _tokens(query)
                            scored = sorted(
                                ((_score(query_tokens, ix), i) for i, ix in enumerate(_INDEX)),
                                key=lambda p: p[0],
                                reverse=True,
                            )
                            best = scored[0][0] if scored else 0.0
                            # Keep the top entries that are at least reasonably close to the best one.
                            picked = [i for s, i in scored[:TOP_K] if s > 0 and s >= 0.35 * best]
                            if not picked:
                                return {"result": NO_MATCH_MESSAGE}
                            blocks = []
                            for rank, i in enumerate(picked, start=1):
                                e = QA_ENTRIES[i]
                                answer = e["answer"]
                                if len(answer) > MAX_ANSWER_CHARS:
                                    answer = answer[:MAX_ANSWER_CHARS] + "\n[... entry truncated ...]"
                                sources = "\n".join(f"- {s}" for s in e.get("sources", [])) or "- (none listed)"
                                blocks.append(
                                    f"### Reference entry {rank}: {e['question']}\n{answer}\nSources:\n{sources}"
                                )
                            header = (
                                f"{len(picked)} reference Q&A entr{'y' if len(picked) == 1 else 'ies'} matching the "
                                "question. GUIDANCE ONLY: use them to choose what to search and what the "
                                "answer must cover. Never quote or cite them; retrieve and cite the "
                                "documents they point to.\n\n"
                            )
                            return {"result": header + "\n\n".join(blocks)}
      - type: haystack.tools.pipeline_tool.PipelineTool
        data:
          name: list_corpus_files
          description: List the documents available in the corpus, optionally filtered by a case-insensitive
            name pattern (substring or simple regex, e.g. "payments"). Use this FIRST whenever the user
            refers to a specific document by name, alias or abbreviation, to resolve it to an exact file_name
            and file_id before calling search_in_file. One line per file with file_name, file_id and,
            when known, doc_type, version and document_date, so you can pick the latest approved version.
            Match with ONE distinctive word ("payments", "release", "VAT") rather than a full title, and
            if that returns nothing, call again with an empty pattern to see everything before concluding
            a document is absent.
          parameters:
            type: object
            additionalProperties: false
            properties:
              name_pattern:
                type: string
                description: Case-insensitive substring or simple regex matched against document names.
                  Prefer ONE distinctive word over a full title. Pass an empty string to list every document.
            required:
            - name_pattern
          input_mapping:
            name_pattern:
            - lister.name_pattern
            - name_search.query
          output_mapping:
            lister.result: result
          outputs_to_string:
            source: result
          pipeline:
            components:
              corpus_scan:
                type: haystack.components.retrievers.filter_retriever.FilterRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 1024
                      index: pacioli-docling
                  filters:
                    field: split_id
                    operator: ==
                    value: 0
              name_search:
                type: haystack_integrations.components.retrievers.opensearch.bm25_retriever.OpenSearchBM25Retriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 1024
                      index: pacioli-docling
                  top_k: 500
                  fuzziness: AUTO
              lister:
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    import json
                    import re
                    from haystack import component
                    from haystack.dataclasses import Document
                    # The store hard-codes a 10 000-hit cap on the scan. With one chunk per file this
                    # means ~10 000 files; the check stays because a silent truncation here is exactly
                    # the failure that cost ALINA two debugging rounds.
                    SCAN_CAP = 10000
                    # Bounds the context cost of an UNFILTERED listing only. A listing narrowed by a
                    # name pattern is never truncated.
                    MAX_FILES_UNFILTERED = 600
                    # Metadata shown on every line, "unknown" when absent.
                    LISTING_FIELDS = ['doc_type', 'version', 'document_date']
                    # Metadata the listing is sorted on before the name (numeric-aware, unknown last).
                    SORT_FIELDS = []
                    LEGEND = "fields: file_name, file_id, doc_type, version, document_date. doc_type/version/document_date read 'unknown' when the document carries no such metadata; prefer the latest version or date when several documents describe the same process."
                    ORDER_LABEL = 'alphabetical'

                    def _name(doc):
                        return doc.meta.get("display_name") or doc.meta.get("file_name") or "unknown"

                    def _meta(doc, key):
                        value = doc.meta.get(key)
                        return str(value) if value not in (None, "") else "unknown"

                    def _sort_value(entry, key):
                        value = entry.get(key)
                        if value in (None, "", "unknown"):
                            return (1, 0, "")
                        try:
                            return (0, float(str(value).strip()), "")
                        except ValueError:
                            return (0, 0, str(value).lower())

                    @component
                    class CorpusFileLister:
                        """Reduces chunks to a distinct-file listing.
                        Receives documents from upstream retrievers (which own the document store), so
                        this component never opens a connection itself:
                          - `documents`    the scan (one chunk per file), capped at SCAN_CAP;
                          - `name_matches` the BM25 hits on the name pattern.
                        Name matching is done here: a regex when the pattern compiles, a
                        case-insensitive substring otherwise, and a match when EVERY token of the
                        pattern appears in the name, in any order.
                        """
                        @component.output_types(result=str)
                        def run(self, documents: list[Document], name_matches: list[Document] | None = None, name_pattern: str = ""):
                            name_pattern = (name_pattern or "").strip()
                            scanned = len(documents or [])
                            scan_truncated = scanned >= SCAN_CAP
                            seen_ids, merged = set(), []
                            for doc in list(documents or []) + list(name_matches or []):
                                if doc.id in seen_ids:
                                    continue
                                seen_ids.add(doc.id)
                                merged.append(doc)
                            pattern = None
                            if name_pattern:
                                try:
                                    pattern = re.compile(name_pattern, re.IGNORECASE)
                                except re.error:
                                    pattern = None
                            needle = name_pattern.lower()
                            tokens = [w for w in re.split(r"[^A-Za-z0-9]+", needle) if w]
                            def matches(name):
                                low = name.lower()
                                if pattern is not None and pattern.search(name):
                                    return True
                                if needle and needle in low:
                                    return True
                                return bool(tokens) and all(w in low for w in tokens)
                            files = {}
                            name_hits = 0
                            for doc in merged:
                                name = _name(doc)
                                file_name = doc.meta.get("file_name") or name
                                if name_pattern and not (matches(name) or matches(file_name)):
                                    continue
                                name_hits += 1
                                entry = {"file_name": name, "file_id": doc.meta.get("file_id")}
                                for key in LISTING_FIELDS:
                                    entry[key] = _meta(doc, key)
                                files.setdefault(doc.meta.get("file_id") or name, entry)
                            listing = sorted(
                                files.values(),
                                key=lambda e: tuple(_sort_value(e, k) for k in SORT_FIELDS) + (e["file_name"].lower(),),
                            )
                            partial_note = (
                                " WARNING: the file scan hit its limit, so this listing is partial."
                                if scan_truncated else ""
                            )
                            if not listing:
                                if name_pattern and name_hits == 0:
                                    return {"result": (
                                        f'No document matches "{name_pattern}".' + partial_note +
                                        " Retry with ONE distinctive word from the name, and with an empty "
                                        "pattern to see the full list of documents. If it is still absent, the "
                                        "document is not in this corpus: say so, and answer from search_corpus "
                                        "if the subject is covered elsewhere."
                                    )}
                                return {"result": "The corpus returned no documents." + partial_note}
                            truncated = not name_pattern and len(listing) > MAX_FILES_UNFILTERED
                            if truncated:
                                listing = listing[:MAX_FILES_UNFILTERED]
                            header = f"{len(listing)} document(s), {ORDER_LABEL}"
                            if truncated:
                                header += (
                                    f" - WARNING, THIS LISTING IS INCOMPLETE: it shows the first "
                                    f"{MAX_FILES_UNFILTERED} of {len(files)} documents. You may NOT "
                                    "conclude from it that any document is missing. Narrow it with a "
                                    "name pattern instead."
                                )
                            header += partial_note
                            header += f"\n{LEGEND}"
                            body = "\n".join(json.dumps(e, ensure_ascii=False) for e in listing)
                            return {"result": f"{header}:\n{body}"}
            connections:
            - sender: corpus_scan.documents
              receiver: lister.documents
            - sender: name_search.documents
              receiver: lister.name_matches
      - type: haystack.tools.pipeline_tool.PipelineTool
        data:
          name: search_corpus
          description: 'Search the whole SUMMA documentation corpus with a short, self-contained query.
            Use for any question that does not target one specific document. Returns the most relevant
            passages, grouped by document and ordered by position within each document, each tagged with
            a reference token for citation and with the document''s version and date when known. The corpus
            covers SUMMA screens and the financial processes around them: search before concluding that
            a question is out of scope.'
          parameters:
            type: object
            additionalProperties: false
            properties:
              query:
                type: string
                description: 'A short, self-contained search query: the terms the documentation itself
                  uses (app, tile, field and status names as written). Never paste conversation history.'
            required:
            - query
          input_mapping:
            query:
            - retrieval_query.query
            - ranker.query
            - ranker_scoring.query
            state_documents:
            - result_formatter.state_documents
          output_mapping:
            result_formatter.documents: documents
            result_formatter.result: result
          inputs_from_state:
            documents: state_documents
          outputs_to_state:
            documents:
              source: documents
          outputs_to_string:
            source: result
          pipeline:
            components:
              retrieval_query:
                type: haystack.components.converters.output_adapter.OutputAdapter
                init_parameters:
                  template: '{{ query.split()[-100:] | join('' '') }}'
                  output_type: str
              query_expander:
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    import re
                    from haystack import component
                    # Synonym groups from the use case's vocabulary: users write "PO", the documents say
                    # "Purchase Order". When any member of a group appears in the query as a whole word, the
                    # other members are appended, so BM25 and the dense retriever see both forms whatever the
                    # model wrote. Deterministic: the prompt asks the model to do the same, but a rule in the
                    # prompt is only followed most of the time, and retrieval depends on the words actually sent.
                    SYNONYMS = [['PO', 'Purchase Order'], ['VAT', 'TVA', 'tax'], ['BP', 'Business Partner'], ['DEP', 'Digital Europe Programme'], ['down payment', 'downpayment', 'down-payment', 'prefinancing'], ['show', 'display', 'visualize'], ['LAM', 'Local Authorisation Manager']]
                    MAX_ADDED_TERMS = 12

                    def _present(term, text_lower):
                        return re.search(r"(?<![a-z0-9])" + re.escape(term.lower()) + r"(?![a-z0-9])", text_lower) is not None

                    def expand(query):
                        text = query or ""
                        low = text.lower()
                        added = []
                        for group in SYNONYMS:
                            if any(_present(t, low) for t in group):
                                for t in group:
                                    if not _present(t, low) and t not in added:
                                        added.append(t)
                        added = added[:MAX_ADDED_TERMS]
                        return (text + " " + " ".join(added)).strip() if added else text

                    @component
                    class QueryExpander:
                        """Appends the other forms of any vocabulary term found in the query."""
                        @component.output_types(query=str)
                        def run(self, query: str):
                            return {"query": expand(query)}
              bm25_retriever:
                type: haystack_integrations.components.retrievers.opensearch.bm25_retriever.OpenSearchBM25Retriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 1024
                      index: pacioli-docling
                  top_k: 30
                  fuzziness: 0
              query_embedder:
                type: deepset_cloud_custom_nodes.embedders.nvidia.text_embedder.DeepsetNvidiaTextEmbedder
                init_parameters:
                  normalize_embeddings: true
                  model: intfloat/multilingual-e5-large
                  prefix: 'query: '
                  suffix: ''
              embedding_retriever:
                type: haystack_integrations.components.retrievers.opensearch.embedding_retriever.OpenSearchEmbeddingRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 1024
                      index: pacioli-docling
                  top_k: 30
              document_joiner:
                type: haystack.components.joiners.document_joiner.DocumentJoiner
                init_parameters:
                  join_mode: reciprocal_rank_fusion
              ranker:
                type: deepset_cloud_custom_nodes.rankers.nvidia.ranker.DeepsetNvidiaRanker
                init_parameters:
                  model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
                  top_k: 10
                  batch_size: 8
                  meta_fields_to_embed: &id001
                  - header
                  - file_name
                  embedding_separator: \n
              sentence_window_retriever:
                type: haystack.components.retrievers.sentence_window_retriever.SentenceWindowRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 1024
                      index: pacioli-docling
                  window_size: 1
                  source_id_meta_field: file_id
                  split_id_meta_field: split_id
                  raise_on_missing_meta_fields: false
              window_joiner:
                type: haystack.components.joiners.document_joiner.DocumentJoiner
                init_parameters:
                  join_mode: concatenate
              ranker_scoring:
                type: deepset_cloud_custom_nodes.rankers.nvidia.ranker.DeepsetNvidiaRanker
                init_parameters:
                  model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
                  top_k: 30
                  batch_size: 8
                  meta_fields_to_embed: *id001
                  embedding_separator: \n
                  scale_score: true
                  calibration_factor: 1
              meta_field_grouping_ranker:
                type: haystack.components.rankers.meta_field_grouping_ranker.MetaFieldGroupingRanker
                init_parameters:
                  group_by: file_id
                  subgroup_by: null
                  sort_docs_by: split_id
              result_formatter:
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    import hashlib
                    from haystack import component
                    from haystack.dataclasses import Document
                    PER_DOC_CHARS = 12000
                    MAX_DOCS_PER_CALL = 30
                    # Optional metadata rendered as attributes when present (version, date, type...).
                    EXTRA_ATTRS = ['doc_type', 'version', 'document_date']
                    # The three texts around the passages. Every branch must end by naming the
                    # condition under which the agent searches again: a tool result that reads as a
                    # licence to stop is the failure ALINA 9j measured (7 regressions).
                    INTRO = "Passages grouped by document, in document order. Cite each claim with the passage's reference token in square brackets, copied exactly, e.g. [a1b2c3]. When two documents describe the same process, prefer the later version or document_date."
                    OUTRO = 'These are the passages this ONE query surfaced, not everything the corpus holds on the question. If the document that actually describes the process is not among them, or a part of the question is still unanswered, search again with different terms, or open the governing document directly with search_in_file.'
                    EMPTY = 'No documents matched this query. This is a result about the QUERY, not about the corpus: reformulate with the vocabulary the documentation itself uses (app, field and status names as written) and search again before concluding anything.'
                    TOKEN_LEN = 6
                    def citation_token(document_id):
                        """Stable per-document citation token. MUST stay identical in
                        attachment_formatter, both result_formatters and citation_renumberer."""
                        return hashlib.sha1(str(document_id).encode("utf-8")).hexdigest()[:TOKEN_LEN]
                    def _attr(doc, key):
                        value = doc.meta.get(key)
                        return f' {key}="{value}"' if value not in (None, "") else ""
                    def render(doc):
                        full = doc.content or ""
                        body = full[:PER_DOC_CHARS]
                        truncated = ' truncated="true"' if len(full) > len(body) else ""
                        tail = "\n[... this passage continues beyond what is shown here ...]" if truncated else ""
                        source = doc.meta.get("display_name") or doc.meta.get("file_name")
                        extra = "".join(_attr(doc, key) for key in EXTRA_ATTRS)
                        return (
                            f'<document reference="{citation_token(doc.id)}" source="{source}" '
                            f'section="{doc.meta.get("header")}" page="{doc.meta.get("page_number")}"'
                            f'{extra}{truncated}>\n{body}{tail}\n</document>'
                        )
                    @component
                    class ResultFormatter:
                        """Renders retrieved passages with STABLE citation tokens, dedups against the
                        documents already in agent state, and appends only the new ones."""
                        @component.output_types(documents=list[Document], result=str)
                        def run(self, documents: list[Document], state_documents: list[Document] | None = None):
                            known = {d.id for d in (state_documents or [])}
                            new_docs, kept = [], []
                            for doc in (documents or [])[:MAX_DOCS_PER_CALL]:
                                if doc.id not in known:
                                    known.add(doc.id)
                                    new_docs.append(doc)
                                kept.append(doc)
                            if not kept:
                                return {"documents": [], "result": EMPTY}
                            return {"documents": new_docs, "result": (
                                INTRO + "\n<documents>\n" + "\n".join(render(d) for d in kept)
                                + "\n</documents>\n" + OUTRO
                            )}
            connections:
            - sender: retrieval_query.output
              receiver: query_expander.query
            - sender: query_expander.query
              receiver: bm25_retriever.query
            - sender: query_expander.query
              receiver: query_embedder.text
            - sender: bm25_retriever.documents
              receiver: document_joiner.documents
            - sender: query_embedder.embedding
              receiver: embedding_retriever.query_embedding
            - sender: embedding_retriever.documents
              receiver: document_joiner.documents
            - sender: document_joiner.documents
              receiver: ranker.documents
            - sender: ranker.documents
              receiver: sentence_window_retriever.retrieved_documents
            - sender: sentence_window_retriever.context_documents
              receiver: window_joiner.documents
            - sender: window_joiner.documents
              receiver: ranker_scoring.documents
            - sender: ranker_scoring.documents
              receiver: meta_field_grouping_ranker.documents
            - sender: meta_field_grouping_ranker.documents
              receiver: result_formatter.documents
      - type: haystack.tools.pipeline_tool.PipelineTool
        data:
          name: search_in_file
          description: Search INSIDE one or more specific documents, identified by file_ids obtained from
            list_corpus_files. Use whenever the user asks what a specific document says or describes,
            and to open the document that governs a process when search_corpus has pointed at it but the
            answer is still incomplete. If this returns nothing relevant, tell the user the named document
            does not contain it; do not silently substitute another source. Returns passages tagged with
            a reference token for citation.
          parameters:
            type: object
            additionalProperties: false
            properties:
              query:
                type: string
                description: A short, self-contained search query using the terms the document itself
                  would use. Never paste conversation history.
              file_ids:
                type: array
                items:
                  type: string
                description: file_id values returned by list_corpus_files. Only documents with these ids
                  are searched.
            required:
            - query
            - file_ids
          input_mapping:
            query:
            - retrieval_query.query
            - ranker.query
            - ranker_scoring.query
            file_ids:
            - file_filter.file_ids
            state_documents:
            - result_formatter.state_documents
          output_mapping:
            result_formatter.documents: documents
            result_formatter.result: result
          inputs_from_state:
            documents: state_documents
          outputs_to_state:
            documents:
              source: documents
          outputs_to_string:
            source: result
          pipeline:
            components:
              file_filter:
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    from typing import Any
                    from haystack import component
                    @component
                    class FileFilter:
                        """Turns a list of file_ids into a retriever filter, ANDed with the entitlement
                        filters when the pipeline has them. SECURITY-SENSITIVE when it does: base
                        filters must be ANDed, never replaced, so a hallucinated or non-entitled
                        file_id yields zero documents, never a leak."""
                        # dict[str, Any], not bare dict: the retrievers' filters input is
                        # declared dict[str, Any] | None and haystack's connection type
                        # check rejects an unparameterized dict as the sender.
                        @component.output_types(filters=dict[str, Any])
                        def run(self, file_ids: list[str], base_filters: dict[str, Any] | None = None):
                            file_condition = {
                                "field": "file_id",
                                "operator": "in",
                                "value": [str(f) for f in (file_ids or []) if f],
                            }
                            if not base_filters:
                                return {"filters": file_condition}
                            return {"filters": {"operator": "AND", "conditions": [base_filters, file_condition]}}
              retrieval_query:
                type: haystack.components.converters.output_adapter.OutputAdapter
                init_parameters:
                  template: '{{ query.split()[-100:] | join('' '') }}'
                  output_type: str
              query_expander:
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    import re
                    from haystack import component
                    # Synonym groups from the use case's vocabulary: users write "PO", the documents say
                    # "Purchase Order". When any member of a group appears in the query as a whole word, the
                    # other members are appended, so BM25 and the dense retriever see both forms whatever the
                    # model wrote. Deterministic: the prompt asks the model to do the same, but a rule in the
                    # prompt is only followed most of the time, and retrieval depends on the words actually sent.
                    SYNONYMS = [['PO', 'Purchase Order'], ['VAT', 'TVA', 'tax'], ['BP', 'Business Partner'], ['DEP', 'Digital Europe Programme'], ['down payment', 'downpayment', 'down-payment', 'prefinancing'], ['show', 'display', 'visualize'], ['LAM', 'Local Authorisation Manager']]
                    MAX_ADDED_TERMS = 12

                    def _present(term, text_lower):
                        return re.search(r"(?<![a-z0-9])" + re.escape(term.lower()) + r"(?![a-z0-9])", text_lower) is not None

                    def expand(query):
                        text = query or ""
                        low = text.lower()
                        added = []
                        for group in SYNONYMS:
                            if any(_present(t, low) for t in group):
                                for t in group:
                                    if not _present(t, low) and t not in added:
                                        added.append(t)
                        added = added[:MAX_ADDED_TERMS]
                        return (text + " " + " ".join(added)).strip() if added else text

                    @component
                    class QueryExpander:
                        """Appends the other forms of any vocabulary term found in the query."""
                        @component.output_types(query=str)
                        def run(self, query: str):
                            return {"query": expand(query)}
              bm25_retriever:
                type: haystack_integrations.components.retrievers.opensearch.bm25_retriever.OpenSearchBM25Retriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 1024
                      index: pacioli-docling
                  top_k: 30
                  fuzziness: 0
              query_embedder:
                type: deepset_cloud_custom_nodes.embedders.nvidia.text_embedder.DeepsetNvidiaTextEmbedder
                init_parameters:
                  normalize_embeddings: true
                  model: intfloat/multilingual-e5-large
                  prefix: 'query: '
                  suffix: ''
              embedding_retriever:
                type: haystack_integrations.components.retrievers.opensearch.embedding_retriever.OpenSearchEmbeddingRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 1024
                      index: pacioli-docling
                  top_k: 30
              document_joiner:
                type: haystack.components.joiners.document_joiner.DocumentJoiner
                init_parameters:
                  join_mode: reciprocal_rank_fusion
              ranker:
                type: deepset_cloud_custom_nodes.rankers.nvidia.ranker.DeepsetNvidiaRanker
                init_parameters:
                  model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
                  top_k: 10
                  batch_size: 8
                  meta_fields_to_embed: &id002
                  - header
                  - file_name
                  embedding_separator: \n
              sentence_window_retriever:
                type: haystack.components.retrievers.sentence_window_retriever.SentenceWindowRetriever
                init_parameters:
                  document_store:
                    type: haystack_integrations.document_stores.opensearch.document_store.OpenSearchDocumentStore
                    init_parameters:
                      embedding_dim: 1024
                      index: pacioli-docling
                  window_size: 1
                  source_id_meta_field: file_id
                  split_id_meta_field: split_id
                  raise_on_missing_meta_fields: false
              window_joiner:
                type: haystack.components.joiners.document_joiner.DocumentJoiner
                init_parameters:
                  join_mode: concatenate
              ranker_scoring:
                type: deepset_cloud_custom_nodes.rankers.nvidia.ranker.DeepsetNvidiaRanker
                init_parameters:
                  model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
                  top_k: 30
                  batch_size: 8
                  meta_fields_to_embed: *id002
                  embedding_separator: \n
                  scale_score: true
                  calibration_factor: 1
              meta_field_grouping_ranker:
                type: haystack.components.rankers.meta_field_grouping_ranker.MetaFieldGroupingRanker
                init_parameters:
                  group_by: file_id
                  subgroup_by: null
                  sort_docs_by: split_id
              result_formatter:
                type: deepset_cloud_custom_nodes.code.code_component.Code
                init_parameters:
                  code: |
                    import hashlib
                    from haystack import component
                    from haystack.dataclasses import Document
                    PER_DOC_CHARS = 12000
                    MAX_DOCS_PER_CALL = 30
                    # Optional metadata rendered as attributes when present (version, date, type...).
                    EXTRA_ATTRS = ['doc_type', 'version', 'document_date']
                    # The three texts around the passages. Every branch must end by naming the
                    # condition under which the agent searches again: a tool result that reads as a
                    # licence to stop is the failure ALINA 9j measured (7 regressions).
                    INTRO = "Passages from the requested document(s), in document order. Cite each claim with the passage's reference token in square brackets, copied exactly, e.g. [a1b2c3]."
                    OUTRO = 'These passages are what this query happened to surface in the requested document(s), not everything they hold on the question. If a part of the question is still unanswered, search again with different terms before you write.'
                    EMPTY = "This query matched nothing in the requested document(s). That is a result about the QUERY, not about the document: reformulate with the document's own vocabulary and search again. Only after a second formulation has also failed may you tell the user the document does not contain this."
                    TOKEN_LEN = 6
                    def citation_token(document_id):
                        """Stable per-document citation token. MUST stay identical in
                        attachment_formatter, both result_formatters and citation_renumberer."""
                        return hashlib.sha1(str(document_id).encode("utf-8")).hexdigest()[:TOKEN_LEN]
                    def _attr(doc, key):
                        value = doc.meta.get(key)
                        return f' {key}="{value}"' if value not in (None, "") else ""
                    def render(doc):
                        full = doc.content or ""
                        body = full[:PER_DOC_CHARS]
                        truncated = ' truncated="true"' if len(full) > len(body) else ""
                        tail = "\n[... this passage continues beyond what is shown here ...]" if truncated else ""
                        source = doc.meta.get("display_name") or doc.meta.get("file_name")
                        extra = "".join(_attr(doc, key) for key in EXTRA_ATTRS)
                        return (
                            f'<document reference="{citation_token(doc.id)}" source="{source}" '
                            f'section="{doc.meta.get("header")}" page="{doc.meta.get("page_number")}"'
                            f'{extra}{truncated}>\n{body}{tail}\n</document>'
                        )
                    @component
                    class ResultFormatter:
                        """Renders retrieved passages with STABLE citation tokens, dedups against the
                        documents already in agent state, and appends only the new ones."""
                        @component.output_types(documents=list[Document], result=str)
                        def run(self, documents: list[Document], state_documents: list[Document] | None = None):
                            known = {d.id for d in (state_documents or [])}
                            new_docs, kept = [], []
                            for doc in (documents or [])[:MAX_DOCS_PER_CALL]:
                                if doc.id not in known:
                                    known.add(doc.id)
                                    new_docs.append(doc)
                                kept.append(doc)
                            if not kept:
                                return {"documents": [], "result": EMPTY}
                            return {"documents": new_docs, "result": (
                                INTRO + "\n<documents>\n" + "\n".join(render(d) for d in kept)
                                + "\n</documents>\n" + OUTRO
                            )}
            connections:
            - sender: file_filter.filters
              receiver: bm25_retriever.filters
            - sender: file_filter.filters
              receiver: embedding_retriever.filters
            - sender: retrieval_query.output
              receiver: query_expander.query
            - sender: query_expander.query
              receiver: bm25_retriever.query
            - sender: query_expander.query
              receiver: query_embedder.text
            - sender: bm25_retriever.documents
              receiver: document_joiner.documents
            - sender: query_embedder.embedding
              receiver: embedding_retriever.query_embedding
            - sender: embedding_retriever.documents
              receiver: document_joiner.documents
            - sender: document_joiner.documents
              receiver: ranker.documents
            - sender: ranker.documents
              receiver: sentence_window_retriever.retrieved_documents
            - sender: sentence_window_retriever.context_documents
              receiver: window_joiner.documents
            - sender: window_joiner.documents
              receiver: ranker_scoring.documents
            - sender: ranker_scoring.documents
              receiver: meta_field_grouping_ranker.documents
            - sender: meta_field_grouping_ranker.documents
              receiver: result_formatter.documents
connections:
- sender: multi_file_converter.documents
  receiver: attachment_metadata_stamper.documents
- sender: attachment_metadata_stamper.documents
  receiver: attachment_formatter.documents
- sender: attachment_formatter.documents
  receiver: agent.documents
- sender: attachment_formatter.result
  receiver: agent.attachments
- sender: history_sanitizer.messages
  receiver: agent.messages
- sender: agent.messages
  receiver: citation_renumberer.messages
- sender: agent.documents
  receiver: citation_renumberer.documents
max_runs_per_component: 100
history:
  granularity: query_answer
metadata: {}
inputs:
  query:
  - agent.query
  messages:
  - history_sanitizer.messages
  files:
  - multi_file_converter.sources
outputs:
  documents: citation_renumberer.documents
  messages: citation_renumberer.messages
